<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">养老机器人四层安全闭环</title>
  <desc id="desc">从照护计划、慢速任务推理、快速动作策略、硬实时安全控制到机器人执行，并通过用户、照护者、远程专家和数据评测形成闭环。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#14213a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5eead4"/>
    </marker>
    <style>
      .f { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .box { fill: #111d31; stroke: #334155; stroke-width: 2; }
      .h { fill: #f8fafc; font-size: 22px; font-weight: 800; }
      .s { fill: #cbd5e1; font-size: 16px; }
      .m { fill: #94a3b8; font-size: 14px; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg2)"/>
  <text x="64" y="68" class="f" fill="#f8fafc" font-size="32" font-weight="800">养老机器人必须是“四层闭环”，不能把照护责任塞进一个端到端模型</text>
  <text x="64" y="103" class="f" fill="#94a3b8" font-size="17">越接近人体、药物和紧急事件，越要降低自主权限，并让安全控制与人类接管独立于 VLA</text>

  <g class="f">
    <rect x="64" y="150" width="240" height="146" rx="18" class="box"/>
    <text x="86" y="187" class="h">1. 照护计划与同意</text>
    <text x="86" y="222" class="s">用户目标、禁忌、权限</text>
    <text x="86" y="250" class="s">药物 / 康复 / 隐私边界</text>
    <text x="86" y="278" class="m">更新频率：天 / 周；由人负责</text>

    <rect x="344" y="150" width="240" height="146" rx="18" class="box"/>
    <text x="366" y="187" class="h">2. 慢速推理 Agent</text>
    <text x="366" y="222" class="s">任务分解、工具调用</text>
    <text x="366" y="250" class="s">成功检测、风险分级</text>
    <text x="366" y="278" class="m">0.1–2 Hz；允许解释与确认</text>

    <rect x="624" y="150" width="240" height="146" rx="18" class="box"/>
    <text x="646" y="187" class="h">3. 快速 VLA / 技能</text>
    <text x="646" y="222" class="s">短动作块、闭环重规划</text>
    <text x="646" y="250" class="s">不确定时停止或求助</text>
    <text x="646" y="278" class="m">5–50 Hz；只执行已授权技能</text>

    <rect x="904" y="150" width="240" height="146" rx="18" class="box"/>
    <text x="926" y="187" class="h">4. 硬实时安全控制</text>
    <text x="926" y="222" class="s">力 / 速 / 位姿约束</text>
    <text x="926" y="250" class="s">碰撞、跌倒、急停</text>
    <text x="926" y="278" class="m">200–1000 Hz；独立于大模型</text>

    <rect x="1184" y="150" width="152" height="146" rx="18" fill="#17342d" stroke="#2dd4bf" stroke-width="2"/>
    <text x="1206" y="187" class="h">机器人</text>
    <text x="1206" y="222" class="s">感知</text>
    <text x="1206" y="249" class="s">行动</text>
    <text x="1206" y="276" class="s">反馈</text>

    <g stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)">
      <line x1="306" y1="223" x2="334" y2="223"/>
      <line x1="586" y1="223" x2="614" y2="223"/>
      <line x1="866" y1="223" x2="894" y2="223"/>
      <line x1="1146" y1="223" x2="1174" y2="223"/>
    </g>

    <rect x="64" y="352" width="1272" height="310" rx="24" fill="#0c1729" stroke="#263752" stroke-width="2"/>
    <text x="88" y="393" fill="#f8fafc" font-size="23" font-weight="800">始终在线的运营、评测与人类协作层</text>

    <rect x="92" y="423" width="260" height="112" rx="16" fill="#152238" stroke="#38bdf8"/>
    <text x="114" y="458" fill="#7dd3fc" font-size="20" font-weight="800">用户与照护者</text>
    <text x="114" y="490" class="s">确认高风险动作、修订偏好</text>
    <text x="114" y="517" class="s">查看告警与解释</text>

    <rect x="382" y="423" width="260" height="112" rx="16" fill="#152238" stroke="#a78bfa"/>
    <text x="404" y="458" fill="#c4b5fd" font-size="20" font-weight="800">远程专家 / 护工</text>
    <text x="404" y="490" class="s">接管长尾任务、现场确认</text>
    <text x="404" y="517" class="s">将纠错沉淀为训练数据</text>

    <rect x="672" y="423" width="260" height="112" rx="16" fill="#152238" stroke="#2dd4bf"/>
    <text x="694" y="458" fill="#5eead4" font-size="20" font-weight="800">Fleet Ops 与数据闭环</text>
    <text x="694" y="490" class="s">版本、日志、回放、回滚</text>
    <text x="694" y="517" class="s">失败聚类、离线重评测</text>

    <rect x="962" y="423" width="346" height="112" rx="16" fill="#152238" stroke="#f59e0b"/>
    <text x="984" y="458" fill="#fcd34d" font-size="20" font-weight="800">安全与照护指标</text>
    <text x="984" y="490" class="s">干预率、险情、恢复率、任务范围</text>
    <text x="984" y="517" class="s">用户负担、隐私事件、护理结果</text>

    <path d="M1260 305 C1260 335 1210 350 1170 350 L200 350 C130 350 105 335 105 306" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="712" y="337" text-anchor="middle" fill="#fde68a" font-size="15">执行状态、异常与用户反馈持续回到照护与运营层</text>

    <rect x="92" y="570" width="1216" height="62" rx="15" fill="#3a1d25" stroke="#fb7185"/>
    <text x="112" y="609" fill="#fecdd3" font-size="18" font-weight="700">禁止纯自主：抱扶转移、洗浴如厕、处方药决策、伤情判断等高风险任务，应由合规医疗 / 照护流程和人类监督主导。</text>
  </g>
</svg>
