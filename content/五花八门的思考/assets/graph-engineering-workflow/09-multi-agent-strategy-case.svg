<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 经营数据分析与策略执行图</title>
  <desc id="desc">Claude Workflow 负责只读数据快照、质量检查、并行领域分析、诊断、策略候选生成、模拟和反方审查，输出待审批提案；外层 Harness 负责策略约束、人工审批、幂等执行、监控和回滚。蓝色节点是 Subagent，绿色节点是确定性函数或工具，金色节点是人工审批，紫色节点是持久化状态。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15324a"/>
      <stop offset="1" stop-color="#245d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17374a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#47697a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b5674d"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #fff; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #dceaf0; }
      .lane-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #294b5e; }
      .node-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #24485b; text-anchor: middle; }
      .node-body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #607784; text-anchor: middle; }
      .edge { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #617684; }
      .boundary { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fff; letter-spacing: 0.4px; }
      .legend { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #4d6573; }
      .note { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #4b6372; }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="18" fill="#f8fafc"/>
  <rect width="1600" height="108" rx="18" fill="url(#header)"/>
  <rect y="90" width="1600" height="18" fill="url(#header)"/>
  <text class="title" x="54" y="49">完整案例：经营数据分析 → 策略审批 → 灰度执行 → 监控回滚</text>
  <text class="subtitle" x="56" y="80">节点可以是 Subagent、确定性函数、工具、人工或子图；高不确定性留给 Agent，高影响副作用交给 Harness</text>

  <g transform="translate(56 130)">
    <rect x="0" y="0" width="24" height="18" rx="5" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
    <text class="legend" x="34" y="15">Subagent</text>
    <rect x="150" y="0" width="24" height="18" rx="5" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
    <text class="legend" x="184" y="15">确定性函数 / 工具</text>
    <rect x="350" y="0" width="24" height="18" rx="5" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
    <text class="legend" x="384" y="15">人工审批</text>
    <rect x="500" y="0" width="24" height="18" rx="5" fill="#f1ecf7" stroke="#816ba6" stroke-width="2"/>
    <text class="legend" x="534" y="15">持久化状态 / 终态</text>
    <line x1="742" y1="9" x2="798" y2="9" stroke="#b5674d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text class="legend" x="812" y="15">失败、重规划或回滚</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="176" width="1524" height="516" rx="18" fill="#fff" stroke="#779eb3" stroke-width="2.5"/>
    <rect x="38" y="176" width="214" height="40" rx="18" fill="#4f829e"/>
    <rect x="38" y="198" width="214" height="18" fill="#4f829e"/>
    <text class="boundary" x="62" y="202">CLAUDE WORKFLOW</text>

    <text class="lane-title" x="66" y="254">A　建立可信数据面</text>
    <g transform="translate(72 278)">
      <rect width="210" height="82" rx="12" fill="#f1ecf7" stroke="#816ba6" stroke-width="2"/>
      <text class="node-title" x="105" y="31">Task Contract</text>
      <text class="node-body" x="105" y="56">目标、窗口、指标口径、预算</text>
    </g>
    <g transform="translate(350 278)">
      <rect width="210" height="82" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="105" y="31">Read-only Snapshot</text>
      <text class="node-body" x="105" y="56">查询数据与指标定义，冻结版本</text>
    </g>
    <g transform="translate(628 278)">
      <rect width="210" height="82" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="105" y="31">Data Quality Gate</text>
      <text class="node-body" x="105" y="56">完整性、延迟、分母与异常值</text>
    </g>
    <g transform="translate(906 278)">
      <rect width="210" height="82" rx="12" fill="#f1ecf7" stroke="#816ba6" stroke-width="2"/>
      <text class="node-title" x="105" y="31">BLOCKED</text>
      <text class="node-body" x="105" y="56">数据不可用，不生成策略</text>
    </g>
    <line x1="282" y1="319" x2="342" y2="319" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="560" y1="319" x2="620" y2="319" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="838" y1="319" x2="898" y2="319" stroke="#b5674d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text class="edge" x="852" y="302">FAIL</text>

    <text class="lane-title" x="66" y="408">B　模式一：按问题结构并行分支</text>
    <g transform="translate(72 432)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Acquisition Agent</text>
      <text class="node-body" x="90" y="53">流量与获客效率</text>
    </g>
    <g transform="translate(280 432)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Conversion Agent</text>
      <text class="node-body" x="90" y="53">漏斗与转化异常</text>
    </g>
    <g transform="translate(488 432)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Retention Agent</text>
      <text class="node-body" x="90" y="53">留存、流失与退款</text>
    </g>
    <g transform="translate(696 432)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Economics Agent</text>
      <text class="node-body" x="90" y="53">毛利、CAC 与回收期</text>
    </g>
    <g transform="translate(980 425)">
      <rect width="220" height="90" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2.5"/>
      <text class="node-title" x="110" y="33">Diagnosis Agent</text>
      <text class="node-body" x="110" y="58">合并证据，区分相关与因果</text>
    </g>
    <line x1="838" y1="360" x2="838" y2="397" stroke="#47697a" stroke-width="2.5"/>
    <line x1="162" y1="397" x2="1090" y2="397" stroke="#47697a" stroke-width="2.5"/>
    <line x1="162" y1="397" x2="162" y2="424" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="370" y1="397" x2="370" y2="424" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="578" y1="397" x2="578" y2="424" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="786" y1="397" x2="786" y2="424" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="252" y1="470" x2="972" y2="470" stroke="#47697a" stroke-width="2"/>
    <line x1="460" y1="470" x2="972" y2="470" stroke="#47697a" stroke-width="2"/>
    <line x1="668" y1="470" x2="972" y2="470" stroke="#47697a" stroke-width="2"/>
    <line x1="876" y1="470" x2="972" y2="470" stroke="#47697a" stroke-width="2" marker-end="url(#arrow)"/>

    <text class="lane-title" x="66" y="562">C　模式二：分析 → Review → 重分析</text>
    <g transform="translate(72 584)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Spend Agent</text>
      <text class="node-body" x="90" y="53">预算重分配候选</text>
    </g>
    <g transform="translate(280 584)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Offer Agent</text>
      <text class="node-body" x="90" y="53">促销与定价候选</text>
    </g>
    <g transform="translate(488 584)">
      <rect width="180" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="90" y="29">Product Agent</text>
      <text class="node-body" x="90" y="53">产品干预候选</text>
    </g>
    <g transform="translate(744 584)">
      <rect width="190" height="76" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="95" y="29">Simulation Tool</text>
      <text class="node-body" x="95" y="53">情景估计与约束计算</text>
    </g>
    <g transform="translate(1004 584)">
      <rect width="190" height="76" rx="12" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
      <text class="node-title" x="95" y="29">Red-team Agent</text>
      <text class="node-body" x="95" y="53">反证、风险与遗漏</text>
    </g>
    <g transform="translate(1264 584)">
      <rect width="230" height="76" rx="12" fill="#f1ecf7" stroke="#816ba6" stroke-width="2.5"/>
      <text class="node-title" x="115" y="29">Proposal Package</text>
      <text class="node-body" x="115" y="53">证据、动作、护栏、回滚条件</text>
    </g>
    <path d="M1090 515 C1090 550 162 550 162 576" fill="none" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1090 515 C1090 550 370 550 370 576" fill="none" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1090 515 C1090 550 578 550 578 576" fill="none" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="668" y1="622" x2="736" y2="622" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="934" y1="622" x2="996" y2="622" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1194" y1="622" x2="1256" y2="622" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1099 584 C1099 538 1090 538 1090 523" fill="none" stroke="#b5674d" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text class="edge" x="1110" y="550">不通过且仍有预算 → 重诊断</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="722" width="1524" height="320" rx="18" fill="#fff" stroke="#9b88ba" stroke-width="2.5"/>
    <rect x="38" y="722" width="214" height="40" rx="18" fill="#8069a7"/>
    <rect x="38" y="744" width="214" height="18" fill="#8069a7"/>
    <text class="boundary" x="62" y="748">EXTERNAL HARNESS</text>
    <text class="lane-title" x="66" y="800">D　审批、幂等执行与反馈闭环</text>

    <g transform="translate(72 834)">
      <rect width="190" height="82" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="95" y="31">Policy Gate</text>
      <text class="node-body" x="95" y="56">预算、权限、合规、Proposal Hash</text>
    </g>
    <g transform="translate(322 834)">
      <rect width="190" height="82" rx="12" fill="#fff1de" stroke="#b67b37" stroke-width="2.5"/>
      <text class="node-title" x="95" y="31">Human Approval</text>
      <text class="node-body" x="95" y="56">审批绑定提案哈希与有效期</text>
    </g>
    <g transform="translate(572 834)">
      <rect width="190" height="82" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="95" y="31">Idempotent Executor</text>
      <text class="node-body" x="95" y="56">灰度动作与唯一操作键</text>
    </g>
    <g transform="translate(822 834)">
      <rect width="190" height="82" rx="12" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
      <text class="node-title" x="95" y="31">Monitor</text>
      <text class="node-body" x="95" y="56">结果指标、护栏与数据延迟</text>
    </g>
    <g transform="translate(1072 834)">
      <rect width="190" height="82" rx="12" fill="#f1ecf7" stroke="#816ba6" stroke-width="2"/>
      <text class="node-title" x="95" y="31">ADOPTED</text>
      <text class="node-body" x="95" y="56">护栏通过，记录策略版本</text>
    </g>
    <g transform="translate(1322 834)">
      <rect width="190" height="82" rx="12" fill="#fff0eb" stroke="#b5674d" stroke-width="2"/>
      <text class="node-title" x="95" y="31">ROLLBACK</text>
      <text class="node-body" x="95" y="56">护栏突破，补偿并重新分析</text>
    </g>
    <line x1="262" y1="875" x2="314" y2="875" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="512" y1="875" x2="564" y2="875" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="762" y1="875" x2="814" y2="875" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1012" y1="862" x2="1064" y2="862" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="1012" y1="895" x2="1314" y2="895" stroke="#b5674d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text class="edge" x="1024" y="846">PASS</text>
    <text class="edge" x="1150" y="920">GUARDRAIL BREACH</text>

    <line x1="1379" y1="660" x2="1379" y2="706" stroke="#47697a" stroke-width="2.5"/>
    <path d="M1379 706 L167 706 L167 826" fill="none" stroke="#47697a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text class="edge" x="720" y="700">Proposal 只作为数据跨越 Workflow / Harness 边界</text>

    <path d="M1417 916 C1417 1000 1090 1000 1090 668" fill="none" stroke="#b5674d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text class="edge" x="1130" y="990">新观测进入下一次分析，不在原 Run 内无限循环</text>
  </g>

  <rect x="38" y="1062" width="1524" height="38" rx="9" fill="#eef3f6" stroke="#c2d0d8"/>
  <text class="note" x="66" y="1087">设计原则：Agent 负责高熵判断；函数与工具负责可计算事实；Human Gate 负责高影响授权；Harness 负责跨 Session 状态与副作用。</text>
</svg>
