<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript Workflow 到运行图与可观测状态</title>
  <desc id="desc">JavaScript 文件用 await、pipeline、条件和循环表达控制流；Workflow Runtime 执行这些结构，动态生成运行图并记录 Agent 生命周期、结果、成本和耗时。业务状态不会自动出现，必须由 Workflow 显式结构化并交给外部状态存储。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15324a"/>
      <stop offset="1" stop-color="#245d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17374a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#466a7d"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f8a73"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #fff; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #dceaf0; }
      .panel-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #173042; }
      .panel-sub { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #5a7180; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #294b5e; }
      .code-note { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #637784; }
      .node { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #294b5e; text-anchor: middle; }
      .state-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #294b5e; }
      .state-body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #5d7280; }
      .badge { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fff; letter-spacing: 0.3px; }
      .note { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #4b6372; }
    </style>
  </defs>

  <rect width="1600" height="920" rx="18" fill="#f8fafc"/>
  <rect width="1600" height="108" rx="18" fill="url(#header)"/>
  <rect y="90" width="1600" height="18" fill="url(#header)"/>
  <text class="title" x="54" y="49">JavaScript 不是图格式，而是图的生成程序</text>
  <text class="subtitle" x="56" y="80">源码规定控制结构；Runtime 才知道本次真正展开的节点、分支、循环、结果与资源消耗</text>

  <g filter="url(#shadow)">
    <g transform="translate(38 146)">
      <rect width="430" height="650" rx="16" fill="#fff" stroke="#7fa3b6" stroke-width="2"/>
      <text class="panel-title" x="26" y="43">1　Workflow JavaScript</text>
      <text class="panel-sub" x="26" y="70">可读、可保存、可复用的控制程序</text>

      <g transform="translate(24 104)">
        <rect width="382" height="72" rx="10" fill="#edf4f8"/>
        <text class="code" x="18" y="29">await agent(...)</text>
        <text class="code-note" x="18" y="54">顺序依赖：前一结果到下一节点</text>
      </g>
      <g transform="translate(24 190)">
        <rect width="382" height="72" rx="10" fill="#edf6f1"/>
        <text class="code" x="18" y="29">await pipeline(items, fn)</text>
        <text class="code-note" x="18" y="54">按运行时数据 fan-out，再 fan-in</text>
      </g>
      <g transform="translate(24 276)">
        <rect width="382" height="72" rx="10" fill="#fbf4e9"/>
        <text class="code" x="18" y="29">if / switch</text>
        <text class="code-note" x="18" y="54">条件路由：本次只激活命中的分支</text>
      </g>
      <g transform="translate(24 362)">
        <rect width="382" height="72" rx="10" fill="#fff1ec"/>
        <text class="code" x="18" y="29">for / while + break</text>
        <text class="code-note" x="18" y="54">有界回边：重试、修复、搜索至收敛</text>
      </g>
      <g transform="translate(24 448)">
        <rect width="382" height="72" rx="10" fill="#f3eff8"/>
        <text class="code" x="18" y="29">schema / variables / return</text>
        <text class="code-note" x="18" y="54">结构化节点输出、中间状态与终态</text>
      </g>

      <rect x="24" y="550" width="382" height="70" rx="10" fill="#eef2f5" stroke="#c1d0d8"/>
      <text class="code" x="42" y="580">meta.name + description</text>
      <text class="code-note" x="42" y="605">定义可保存命令的身份，不定义运行状态</text>
    </g>

    <g transform="translate(585 146)">
      <rect width="430" height="650" rx="16" fill="#fff" stroke="#6f9b86" stroke-width="2"/>
      <text class="panel-title" x="26" y="43">2　Workflow Runtime</text>
      <text class="panel-sub" x="26" y="70">解释脚本、调度 Agent、缓存完成结果</text>

      <rect x="26" y="102" width="378" height="74" rx="11" fill="#edf6f1" stroke="#72a28e"/>
      <rect x="44" y="122" width="94" height="26" rx="13" fill="#4f8a73"/>
      <text class="badge" x="61" y="140">INTERPRET</text>
      <text class="state-body" x="158" y="136">执行 top-level await 与普通 JS 控制流</text>

      <g transform="translate(38 218)">
        <rect x="0" y="95" width="92" height="50" rx="10" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
        <text class="node" x="46" y="126">Discover</text>
        <rect x="142" y="15" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <rect x="142" y="95" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <rect x="142" y="175" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <text class="node" x="188" y="46">Worker A</text>
        <text class="node" x="188" y="126">Worker B</text>
        <text class="node" x="188" y="206">Worker C</text>
        <rect x="286" y="95" width="92" height="50" rx="10" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
        <text class="node" x="332" y="126">Synthesize</text>
        <line x1="92" y1="120" x2="140" y2="40" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="92" y1="120" x2="140" y2="120" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="92" y1="120" x2="140" y2="200" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="234" y1="40" x2="284" y2="120" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="234" y1="120" x2="284" y2="120" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="234" y1="200" x2="284" y2="120" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
      </g>

      <rect x="26" y="494" width="378" height="126" rx="11" fill="#f1f5f7"/>
      <text class="state-title" x="46" y="525">本次运行才确定</text>
      <text class="state-body" x="46" y="553">实际 Agent 数量 · 选中分支 · 循环次数</text>
      <text class="state-body" x="46" y="581">完成结果缓存 · Token · 耗时 · 错误</text>
      <text class="state-body" x="46" y="609">这些信息不存在于静态 JS 文本本身</text>
    </g>

    <g transform="translate(1132 146)">
      <rect width="430" height="650" rx="16" fill="#fff" stroke="#9b88ba" stroke-width="2"/>
      <text class="panel-title" x="26" y="43">3　可观测状态</text>
      <text class="panel-sub" x="26" y="70">能看见多少，取决于状态属于哪一层</text>

      <g transform="translate(24 104)">
        <rect width="382" height="124" rx="11" fill="#edf6f1" stroke="#72a28e"/>
        <rect x="18" y="16" width="86" height="25" rx="12" fill="#4f8a73"/>
        <text class="badge" x="38" y="34">VISIBLE</text>
        <text class="state-title" x="122" y="34">Runtime 生命周期</text>
        <text class="state-body" x="18" y="68">Run / Phase / Agent 进度、结果、Token、耗时</text>
        <text class="state-body" x="18" y="94">/workflows 可下钻，完成结果支持同 Session 恢复</text>
      </g>

      <g transform="translate(24 248)">
        <rect width="382" height="124" rx="11" fill="#fbf4e9" stroke="#c39859"/>
        <rect x="18" y="16" width="86" height="25" rx="12" fill="#b27a36"/>
        <text class="badge" x="31" y="34">PARTIAL</text>
        <text class="state-title" x="122" y="34">脚本内部状态</text>
        <text class="state-body" x="18" y="68">变量、循环计数、当前分支由 Runtime 持有</text>
        <text class="state-body" x="18" y="94">公开 UI 未承诺可查询完整 JS Heap 或程序计数器</text>
      </g>

      <g transform="translate(24 392)">
        <rect width="382" height="148" rx="11" fill="#fff1ec" stroke="#c98a70"/>
        <rect x="18" y="16" width="102" height="25" rx="12" fill="#ad654b"/>
        <text class="badge" x="33" y="34">EXPLICIT</text>
        <text class="state-title" x="138" y="34">业务与治理状态</text>
        <text class="state-body" x="18" y="68">验收项、失败指纹、审批、Artifact 哈希、幂等键</text>
        <text class="state-body" x="18" y="94">不会自动产生；必须结构化输出并外部持久化</text>
        <text class="state-body" x="18" y="120">跨 Session 的“全状态”属于 Harness，而非 JS 变量</text>
      </g>

      <rect x="24" y="562" width="382" height="58" rx="10" fill="#f3eff8"/>
      <text class="state-title" x="42" y="588">结论：Runtime 可观测 ≠ 自动拥有全部业务状态</text>
      <text class="state-body" x="42" y="612">完整状态需要事件日志、Checkpoint 与外部 State Store</text>
    </g>
  </g>

  <line x1="470" y1="470" x2="575" y2="470" stroke="#466a7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1017" y1="470" x2="1122" y2="470" stroke="#4f8a73" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text class="panel-sub" x="489" y="450">执行控制结构</text>
  <text class="panel-sub" x="1035" y="450">记录运行事件</text>

  <rect x="38" y="834" width="1524" height="50" rx="10" fill="#eef3f6" stroke="#c2d0d8"/>
  <text class="note" x="66" y="865">Workflow 源码只能说明“允许怎样运行”；要回答“这次运行到了哪里”，必须询问执行它的 Runtime 与状态存储。</text>
</svg>
