<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 模板、运行图与执行 Trace</title>
  <desc id="desc">同一 Workflow 模板根据输入实例化不同数量的工作节点，运行图展开有限修复循环，执行 Trace 记录每一步状态、动作、观察和成本。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15324a"/>
      <stop offset="1" stop-color="#245d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17374a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#466a7d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b86a2e"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #fff; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #dceaf0; }
      .panel-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #173042; }
      .panel-sub { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #5b7180; }
      .node { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #294b5e; text-anchor: middle; }
      .edge { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #6b5a43; }
      .trace-head { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #294b5e; }
      .trace-body { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #596f7d; }
      .formula { font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6e4f2f; }
      .note { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #4b6372; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="18" fill="#f8fafc"/>
  <rect width="1600" height="108" rx="18" fill="url(#header)"/>
  <rect y="90" width="1600" height="18" fill="url(#header)"/>
  <text class="title" x="54" y="49">一个 Workflow，三个不同的工程对象</text>
  <text class="subtitle" x="56" y="80">模板描述允许发生什么；运行图描述本次实例化了什么；Trace 记录实际上发生了什么</text>

  <g filter="url(#shadow)">
    <g transform="translate(38 148)">
      <rect width="480" height="548" rx="16" fill="#fff" stroke="#7fa3b6" stroke-width="2"/>
      <text class="panel-title" x="28" y="44">1　Workflow Template</text>
      <text class="panel-sub" x="28" y="72">可复用的节点词汇、边、路由策略和允许动作</text>
      <g transform="translate(42 126)">
        <rect x="0" y="74" width="94" height="52" rx="10" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
        <text class="node" x="47" y="105">Discover</text>
        <rect x="152" y="10" width="110" height="52" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <text class="node" x="207" y="41">Worker[*]</text>
        <rect x="152" y="138" width="110" height="52" rx="10" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
        <text class="node" x="207" y="169">Verifier[*]</text>
        <rect x="330" y="74" width="94" height="52" rx="10" fill="#f1ecf7" stroke="#816ba6" stroke-width="2"/>
        <text class="node" x="377" y="105">Done</text>
        <path d="M94 95 C120 95 126 37 150 37" fill="none" stroke="#466a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
        <path d="M207 63 L207 136" stroke="#466a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
        <path d="M263 163 C292 163 297 101 328 101" fill="none" stroke="#466a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
        <path d="M152 164 C112 164 112 36 150 36" fill="none" stroke="#b86a2e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-warn)"/>
        <text class="edge" x="55" y="151">FAIL · max 3</text>
        <text class="edge" x="282" y="138">PASS</text>
      </g>
      <rect x="28" y="356" width="424" height="142" rx="11" fill="#f1f5f7"/>
      <text class="formula" x="48" y="390">G_template = (V, E, Phi, Sigma, A)</text>
      <text class="panel-sub" x="48" y="424">Phi：Prompt、Tool、Model、Schema</text>
      <text class="panel-sub" x="48" y="452">Sigma：路由与调度策略</text>
      <text class="panel-sub" x="48" y="480">A：允许激活、重试或编辑的动作</text>
    </g>

    <g transform="translate(560 148)">
      <rect width="480" height="548" rx="16" fill="#fff" stroke="#6f9b86" stroke-width="2"/>
      <text class="panel-title" x="28" y="44">2　Realized Graph</text>
      <text class="panel-sub" x="28" y="72">输入决定本次实际展开多少节点、选择哪些分支</text>
      <g transform="translate(40 115)">
        <rect x="0" y="120" width="88" height="50" rx="10" fill="#e7f1f6" stroke="#5f8da6" stroke-width="2"/>
        <text class="node" x="44" y="151">Discover</text>
        <rect x="138" y="20" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <rect x="138" y="120" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <rect x="138" y="220" width="92" height="50" rx="10" fill="#e8f2ed" stroke="#579079" stroke-width="2"/>
        <text class="node" x="184" y="51">Worker A</text><text class="node" x="184" y="151">Worker B</text><text class="node" x="184" y="251">Worker C</text>
        <rect x="286" y="20" width="92" height="50" rx="10" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
        <rect x="286" y="120" width="92" height="50" rx="10" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
        <rect x="286" y="220" width="92" height="50" rx="10" fill="#fff1de" stroke="#b67b37" stroke-width="2"/>
        <text class="node" x="332" y="51">Verify A</text><text class="node" x="332" y="151">Verify B</text><text class="node" x="332" y="251">Verify C</text>
        <line x1="88" y1="145" x2="136" y2="45" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="88" y1="145" x2="136" y2="145" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="88" y1="145" x2="136" y2="245" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="230" y1="45" x2="284" y2="45" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="230" y1="145" x2="284" y2="145" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="230" y1="245" x2="284" y2="245" stroke="#466a7d" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M332 173 C332 203 184 203 184 173" fill="none" stroke="#b86a2e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-warn)"/>
        <text class="edge" x="230" y="198">B failed → retry 1</text>
      </g>
      <rect x="28" y="430" width="424" height="68" rx="11" fill="#edf6f1"/>
      <text class="formula" x="48" y="459">G_run = instantiate(G_template, x, state)</text>
      <text class="panel-sub" x="48" y="485">同一模板面对不同输入会形成不同运行图</text>
    </g>

    <g transform="translate(1082 148)">
      <rect width="480" height="548" rx="16" fill="#fff" stroke="#9b88ba" stroke-width="2"/>
      <text class="panel-title" x="28" y="44">3　Execution Trace</text>
      <text class="panel-sub" x="28" y="72">事件序列保存状态、动作、观察、证据和成本</text>
      <g transform="translate(28 108)">
        <rect width="424" height="52" rx="9" fill="#edf2f5"/>
        <text class="trace-head" x="16" y="21">t   node       observation       cost</text>
        <text class="trace-body" x="16" y="42">0   discover   files=[A,B,C]     8.2k</text>
        <rect y="66" width="424" height="52" rx="9" fill="#edf6f1"/>
        <text class="trace-body" x="16" y="88">1   worker:A   patch=a31f        22k</text>
        <text class="trace-body" x="16" y="108">2   worker:B   patch=91de        27k</text>
        <rect y="132" width="424" height="52" rx="9" fill="#fff4e6"/>
        <text class="trace-body" x="16" y="154">3   verify:B   FAIL E_TYPE       11k</text>
        <text class="trace-body" x="16" y="174">4   worker:B   patch=5bc2        18k</text>
        <rect y="198" width="424" height="52" rx="9" fill="#f2edf7"/>
        <text class="trace-body" x="16" y="220">5   verify:B   PASS              9k</text>
        <text class="trace-body" x="16" y="240">6   integrate  PASS              15k</text>
      </g>
      <rect x="28" y="392" width="424" height="106" rx="11" fill="#f3eff8"/>
      <text class="formula" x="48" y="424">trace = {(s_t, a_t, o_t, c_t)} t=1..T</text>
      <text class="panel-sub" x="48" y="454">Trace 才能回答失败发生在哪里、</text>
      <text class="panel-sub" x="48" y="480">图是否按约束运行，以及成本花在何处</text>
    </g>
  </g>

  <line x1="520" y1="422" x2="552" y2="422" stroke="#466a7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1042" y1="422" x2="1074" y2="422" stroke="#466a7d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="38" y="730" width="1524" height="50" rx="10" fill="#eef3f6" stroke="#c2d0d8"/>
  <text class="note" x="66" y="761">Graph Engineering 的版本、评测和回归对象不能只保存 Workflow 源码；必须同时保存运行图与 Trace。</text>
</svg>
