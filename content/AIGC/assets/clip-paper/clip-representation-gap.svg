<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 表示能力与 zero-shot 接口之间仍有差距</title>
  <desc id="desc">图中汇总论文 Figure 8 的三条结论：zero-shot 与监督线性探针的跨数据集相关系数为 0.82，多数任务差距为 10 到 25 个准确率点，只有 5 个数据集差距不超过 3 点。</desc>
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#17213a"/></linearGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.66" stop-color="#38bdf8"/><stop offset="0.66" stop-color="#fb7185"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bgr)"/>
  <text x="56" y="60" fill="#f8fafc" font-family="Arial, Noto Sans SC, sans-serif" font-size="30" font-weight="700">表示里“有信息”，不等于文字接口“会调用”</text>
  <text x="56" y="93" fill="#94a3b8" font-family="Arial, Noto Sans SC, sans-serif" font-size="17">本文按论文 §3.2 / Figure 8 汇总 · 不重建原始散点</text>

  <g font-family="Arial, Noto Sans SC, sans-serif">
    <rect x="56" y="136" width="326" height="242" rx="22" fill="#101c32" stroke="#38bdf8" stroke-width="2"/>
    <text x="82" y="177" fill="#bae6fd" font-size="18" font-weight="700">共同变化趋势</text>
    <text x="82" y="251" fill="#38bdf8" font-size="64" font-weight="700">r = 0.82</text>
    <text x="82" y="296" fill="#e0f2fe" font-size="18">表示越强，zero-shot 通常也越强</text>
    <text x="82" y="331" fill="#94a3b8" font-size="15">但相关不等于两种接口等价</text>

    <rect x="408" y="136" width="380" height="242" rx="22" fill="#251825" stroke="#fb7185" stroke-width="2"/>
    <text x="434" y="177" fill="#fecdd3" font-size="18" font-weight="700">多数任务的接口损失</text>
    <text x="434" y="249" fill="#fb7185" font-size="58" font-weight="700">10–25</text>
    <text x="637" y="248" fill="#fecdd3" font-size="20">准确率点</text>
    <rect x="434" y="283" width="328" height="24" rx="12" fill="url(#gap)"/>
    <text x="434" y="337" fill="#fda4af" font-size="16">监督线性探针通常明显更高</text>

    <rect x="814" y="136" width="330" height="242" rx="22" fill="#14261d" stroke="#22c55e" stroke-width="2"/>
    <text x="840" y="177" fill="#bbf7d0" font-size="18" font-weight="700">接近完整提取的少数任务</text>
    <text x="840" y="251" fill="#4ade80" font-size="64" font-weight="700">5</text>
    <text x="893" y="248" fill="#dcfce7" font-size="20">个数据集</text>
    <text x="840" y="296" fill="#dcfce7" font-size="18">zero-shot 差距 ≤ 3 点</text>
    <text x="840" y="331" fill="#94a3b8" font-size="15">其余任务仍需更好的任务接口</text>
  </g>

  <rect x="56" y="410" width="1088" height="50" rx="15" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="442" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Noto Sans SC, sans-serif" font-size="18">监督线性探针：用完整下游训练集拟合　｜　Zero-shot：只用类别文本生成分类器</text>
  <text x="600" y="486" text-anchor="middle" fill="#64748b" font-family="Arial, Noto Sans SC, sans-serif" font-size="14">差距可能来自表示缺失，也可能来自文本无法表达精确决策规则；Figure 8 本身不能继续拆因</text>
</svg>
