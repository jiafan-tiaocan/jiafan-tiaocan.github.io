<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">GPT-SoVITS v1 双阶段网络结构与零样本推理路径</title>
  <desc id="desc">参考语音分为两路：一路经 CN-HuBERT 和 SoVITS RVQ 形成提示语义 Token，另一路经频谱和 MelStyleEncoder 形成声学风格条件。S1 GPT 用参考与目标文本的音素和 BERT 表示、提示 Token 生成目标语义 Token。S2 SoVITS 将语义 Token、目标音素与风格条件送入 TextEncoder/MRTE、逆流和生成器得到波形。图中同时区分 5 秒零样本推理和约 1 分钟的可选 S1/S2 说话人微调。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .bg{fill:url(#bg)}
      .title{fill:#f8fafc;font-size:36px;font-weight:760}
      .subtitle{fill:#9fb0c4;font-size:18px}
      .lane{fill:#0d192b;stroke:#334155;stroke-width:2}
      .lane-title{fill:#dbeafe;font-size:19px;font-weight:720}
      .input{fill:#172238;stroke:#64748b;stroke-width:2}
      .feature{fill:#15223a;stroke:#60a5fa;stroke-width:2}
      .s1{fill:#211b34;stroke:#a78bfa;stroke-width:3}
      .s2{fill:#102b28;stroke:#2dd4bf;stroke-width:3}
      .output{fill:#2d2413;stroke:#f59e0b;stroke-width:3}
      .box-title{fill:#f8fafc;font-size:18px;font-weight:730;text-anchor:middle}
      .box-note{fill:#aebdd0;font-size:14px;text-anchor:middle}
      .stage-title{fill:#f8fafc;font-size:25px;font-weight:780;text-anchor:middle}
      .stage-note{fill:#cbd5e1;font-size:16px;text-anchor:middle}
      .line{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}
      .line-purple{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#arrow-purple)}
      .line-teal{fill:none;stroke:#2dd4bf;stroke-width:3;marker-end:url(#arrow-teal)}
      .callout{fill:#111d31;stroke:#475569;stroke-width:1.8}
      .callout-title{fill:#f8fafc;font-size:17px;font-weight:730}
      .callout-text{fill:#b6c4d6;font-size:15px}
      .zero{fill:#10352f;stroke:#2dd4bf;stroke-width:2}
      .sft{fill:#3a2811;stroke:#f59e0b;stroke-width:2}
      .mode-title{fill:#f8fafc;font-size:18px;font-weight:750}
      .mode-text{fill:#cbd5e1;font-size:15px}
      .foot{fill:#91a2b7;font-size:14px}
      @media (prefers-color-scheme: light){
        .bg{fill:#f8fafc}
        .title,.box-title,.stage-title,.callout-title,.mode-title{fill:#0f172a}
        .subtitle,.box-note,.stage-note,.callout-text,.mode-text,.foot{fill:#475569}
        .lane{fill:#eef3f9;stroke:#cbd5e1}
        .lane-title{fill:#1e3a5f}
        .input{fill:#ffffff;stroke:#94a3b8}
        .feature{fill:#eff6ff;stroke:#2563eb}
        .s1{fill:#f5f3ff;stroke:#7c3aed}
        .s2{fill:#ecfdf5;stroke:#0f9f8f}
        .output{fill:#fff8e8;stroke:#d97706}
        .callout{fill:#ffffff;stroke:#cbd5e1}
        .zero{fill:#dcfce7;stroke:#0f9f8f}
        .sft{fill:#fff1c7;stroke:#d97706}
      }
    </style>
  </defs>

  <rect class="bg" width="1500" height="920" rx="28"/>
  <text class="title" x="64" y="62">GPT-SoVITS v1：“参考语义前缀 + GPT 规划 + SoVITS 渲染”</text>
  <text class="subtitle" x="64" y="100">据官方 v1 固定源码重绘：S1 决定目标语义 Token，S2 用参考声学风格恢复波形。</text>

  <rect class="lane" x="42" y="132" width="1416" height="608" rx="24"/>
  <text class="lane-title" x="70" y="170">零样本推理路径</text>

  <g filter="url(#shadow)">
    <rect class="input" x="78" y="211" width="214" height="90" rx="16"/>
    <rect class="input" x="78" y="345" width="214" height="90" rx="16"/>
    <rect class="input" x="78" y="479" width="214" height="90" rx="16"/>
    <rect class="feature" x="354" y="191" width="218" height="108" rx="16"/>
    <rect class="feature" x="354" y="325" width="218" height="108" rx="16"/>
    <rect class="feature" x="354" y="459" width="218" height="108" rx="16"/>
    <rect class="s1" x="652" y="194" width="322" height="238" rx="22"/>
    <rect class="s2" x="1046" y="194" width="334" height="376" rx="22"/>
    <rect class="output" x="1123" y="620" width="180" height="78" rx="18"/>
  </g>

  <text class="box-title" x="185" y="246">参考语音</text>
  <text class="box-note" x="185" y="274">约 3-10 秒波形</text>
  <text class="box-title" x="185" y="380">参考文本</text>
  <text class="box-note" x="185" y="408">与参考语音对齐</text>
  <text class="box-title" x="185" y="514">目标文本</text>
  <text class="box-note" x="185" y="542">想让该音色说的新内容</text>

  <text class="box-title" x="463" y="226">CN-HuBERT</text>
  <text class="box-note" x="463" y="253">SSL feature</text>
  <text class="box-note" x="463" y="276">→ SoVITS RVQ 提取离散码</text>
  <text class="box-title" x="463" y="360">频谱 + MelStyleEncoder</text>
  <text class="box-note" x="463" y="387">得到参考声学风格 gₑ</text>
  <text class="box-note" x="463" y="410">保留音色、录音与风格线索</text>
  <text class="box-title" x="463" y="494">音素 + 中文 BERT</text>
  <text class="box-note" x="463" y="521">参考文本与目标文本拼接</text>
  <text class="box-note" x="463" y="544">内容与语境条件</text>

  <text class="stage-title" x="813" y="237">S1·Text2Semantic GPT</text>
  <text class="stage-note" x="813" y="274">音素嵌入 + BERT 投影</text>
  <text class="stage-note" x="813" y="304">提示语义 Token 作为前缀</text>
  <text class="stage-note" x="813" y="334">AR Transformer 续写</text>
  <rect class="callout" x="699" y="359" width="228" height="50" rx="13"/>
  <text class="box-title" x="813" y="390">目标语义 Token</text>

  <text class="stage-title" x="1213" y="237">S2·SoVITS</text>
  <text class="stage-note" x="1213" y="274">RVQ decode 语义表示</text>
  <text class="stage-note" x="1213" y="310">+ 目标音素 + 风格 gₑ</text>
  <text class="stage-note" x="1213" y="346">TextEncoder / MRTE</text>
  <text class="stage-note" x="1213" y="382">先验隐变量</text>
  <text class="stage-note" x="1213" y="418">逆向 Residual Coupling Flow</text>
  <text class="stage-note" x="1213" y="454">Generator / Vocoder</text>
  <rect class="callout" x="1094" y="486" width="238" height="58" rx="13"/>
  <text class="box-title" x="1213" y="512">连续声学表示</text>
  <text class="box-note" x="1213" y="535">从内容规划还原到音色波形</text>

  <text class="box-title" x="1213" y="650">目标波形</text>
  <text class="box-note" x="1213" y="677">克隆后的新内容</text>

  <path class="line" d="M292 246 H354"/>
  <path class="line" d="M292 263 C318 263 326 379 354 379"/>
  <path class="line" d="M292 390 C322 390 322 493 354 493"/>
  <path class="line" d="M292 524 H354"/>
  <path class="line-purple" d="M572 245 H624 C641 245 652 260 652 278"/>
  <path class="line-purple" d="M572 513 H620 C639 513 642 386 652 386"/>
  <path class="line-purple" d="M974 385 H1046"/>
  <path class="line-teal" d="M572 379 C610 379 610 590 650 590 H1000 C1028 590 1046 568 1046 540"/>
  <path class="line-teal" d="M1213 570 V620"/>

  <rect class="zero" x="58" y="765" width="662" height="108" rx="20"/>
  <text class="mode-title" x="88" y="800">5 秒 zero-shot：真正的“新音色不训练”</text>
  <text class="mode-text" x="88" y="831">加载通用 S1/S2 权重 → 只提取提示 Token 与 gₑ → 前向生成</text>
  <text class="mode-text" x="88" y="858">没有 loss.backward()，没有 optimizer.step()，也没有新说话人专属权重。</text>

  <rect class="sft" x="780" y="765" width="662" height="108" rx="20"/>
  <text class="mode-title" x="810" y="800">约 1 分钟 few-shot：可选的单音色 SFT</text>
  <text class="mode-text" x="810" y="831">官方路线允许对 S1 GPT 与 S2 SoVITS 微调，以提高相似度与稳定性。</text>
  <text class="mode-text" x="810" y="858">我们 1.0 阶段为了可用性主要走这条路；这是工程选择，不是模型不支持 zero-shot。</text>

  <text class="foot" x="64" y="904">源码锚点：RVC-Boss/GPT-SoVITS commit f20bc37（2024-01-22）的 inference_webui.py、AR/models/t2s_model.py 与 module/models.py。</text>
</svg>
