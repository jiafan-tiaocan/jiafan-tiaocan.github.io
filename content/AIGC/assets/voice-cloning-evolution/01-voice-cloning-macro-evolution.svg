<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">从训练一个音色到注册一个音色：三代生产方案的两次质变</title>
  <desc id="desc">图中区分了学术上的免训练能力边界与项目中的生产主路径。SV2TTS 在 2018 年已展示未见说话人零样本合成；项目三代方案从 GPT-SoVITS 可零样本但以单音色微调求稳定，到 CosyVoice 将短提示免微调变成生产默认，再到 MiniMax 将新音色变成 voice_id 托管资产。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .bg{fill:url(#bg)}
      .title{fill:#f8fafc;font-size:38px;font-weight:760}
      .subtitle{fill:#a9b8cb;font-size:19px}
      .research{fill:#0d192b;stroke:#334155;stroke-width:2}
      .research-title{fill:#dbeafe;font-size:19px;font-weight:700}
      .research-node{fill:#172238;stroke:#475569;stroke-width:1.8}
      .research-year{fill:#93c5fd;font-size:16px;font-weight:700}
      .research-body{fill:#dbe5f2;font-size:16px;font-weight:620}
      .research-note{fill:#91a2b7;font-size:14px}
      .card1{fill:#241d2b;stroke:#f59e0b;stroke-width:3}
      .card2{fill:#102723;stroke:#2dd4bf;stroke-width:3}
      .card3{fill:#10233a;stroke:#60a5fa;stroke-width:3}
      .gen{fill:#f8fafc;font-size:18px;font-weight:760}
      .model{fill:#f8fafc;font-size:30px;font-weight:780}
      .date{fill:#a9b8cb;font-size:15px;font-weight:650}
      .label{fill:#94a3b8;font-size:15px;font-weight:650}
      .value{fill:#e2e8f0;font-size:17px;font-weight:640}
      .small{fill:#9dafc4;font-size:14px}
      .badge1{fill:#3a2811;stroke:#f59e0b;stroke-width:1.5}
      .badge2{fill:#123b32;stroke:#2dd4bf;stroke-width:1.5}
      .badge3{fill:#142e4e;stroke:#60a5fa;stroke-width:1.5}
      .badge-text{fill:#f8fafc;font-size:16px;font-weight:750}
      .shift{fill:#f8fafc;font-size:17px;font-weight:760}
      .shift-note{fill:#a9b8cb;font-size:14px}
      .boundary{fill:#0d192b;stroke:#334155;stroke-width:2}
      .boundary-title{fill:#f8fafc;font-size:19px;font-weight:730}
      .boundary-body{fill:#b6c4d6;font-size:16px}
      .footer-box{fill:#162137;stroke:#475569;stroke-width:1.5}
      .footer{fill:#e2e8f0;font-size:18px;font-weight:730}
      @media (prefers-color-scheme: light){
        .bg{fill:#f8fafc}
        .title,.model,.gen,.shift,.boundary-title{fill:#0f172a}
        .subtitle,.date,.label,.small,.shift-note{fill:#64748b}
        .research{fill:#eef3f9;stroke:#cbd5e1}
        .research-title{fill:#1e3a5f}
        .research-node{fill:#ffffff;stroke:#cbd5e1}
        .research-year{fill:#1d4ed8}
        .research-body,.value,.boundary-body,.footer{fill:#334155}
        .research-note{fill:#64748b}
        .card1{fill:#fff8e8;stroke:#d97706}
        .card2{fill:#ecfdf5;stroke:#0f9f8f}
        .card3{fill:#eff6ff;stroke:#2563eb}
        .badge1{fill:#fff1c7;stroke:#d97706}
        .badge2{fill:#d9f7ef;stroke:#0f9f8f}
        .badge3{fill:#dbeafe;stroke:#2563eb}
        .badge-text{fill:#0f172a}
        .boundary{fill:#ffffff;stroke:#cbd5e1}
        .footer-box{fill:#eaf0f7;stroke:#cbd5e1}
      }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1040" rx="28"/>
  <text class="title" x="64" y="62">从“训练一个音色”到“注册一个音色”</text>
  <text class="subtitle" x="64" y="101">三代生产方案有两次质变；“免训练”要区分学术上首次可行，与项目上成为稳定主路径。</text>

  <rect class="research" x="48" y="132" width="1404" height="174" rx="22"/>
  <text class="research-title" x="76" y="168">学术能力边界：“新说话人不更新模型权重”早于我们的三代项目方案</text>
  <rect class="research-node" x="78" y="188" width="370" height="92" rx="15"/>
  <text class="research-year" x="102" y="216">2018 以前</text>
  <text class="research-body" x="102" y="241">新说话人通常需数据采集与适配</text>
  <text class="research-note" x="102" y="264">身份主要固化在音库、ID 或专属参数中</text>
  <rect class="research-node" x="565" y="188" width="370" height="92" rx="15"/>
  <text class="research-year" x="589" y="216">2018·SV2TTS</text>
  <text class="research-body" x="589" y="241">首次明确展示未见说话人零样本 TTS</text>
  <text class="research-note" x="589" y="264">参考语音 → Speaker Embedding，权重不变</text>
  <rect class="research-node" x="1052" y="188" width="370" height="92" rx="15"/>
  <text class="research-year" x="1076" y="216">2023·VALL-E</text>
  <text class="research-body" x="1076" y="241">3 秒声学 Prompt 进入 Codec LM 上下文</text>
  <text class="research-note" x="1076" y="264">从定长身份向量走向细粒度语音上下文</text>
  <path d="M448 234 H565" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M935 234 H1052" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <g filter="url(#shadow)">
    <rect class="card1" x="58" y="354" width="406" height="444" rx="24"/>
    <rect class="card2" x="547" y="354" width="406" height="444" rx="24"/>
    <rect class="card3" x="1036" y="354" width="406" height="444" rx="24"/>
  </g>

  <text class="gen" x="88" y="392">第一代·自建少样本</text>
  <text class="model" x="88" y="434">GPT-SoVITS</text>
  <text class="date" x="88" y="462">2024 项目 1.0 基线</text>
  <text class="label" x="88" y="504">官方能力</text>
  <text class="value" x="88" y="532">5 秒 zero-shot；1 分钟 few-shot SFT</text>
  <text class="label" x="88" y="574">我们当时的生产选择</text>
  <text class="value" x="88" y="602">为稳定性主要走单音色 S1/S2 微调</text>
  <text class="label" x="88" y="644">模型主干</text>
  <text class="value" x="88" y="672">GPT 语义 Token 规划</text>
  <text class="value" x="88" y="699">+ SoVITS VAE/Flow/GAN 声学解码</text>
  <rect class="badge1" x="88" y="733" width="346" height="44" rx="22"/>
  <text class="badge-text" x="261" y="761" text-anchor="middle">新音色：可免训练，但项目常更新权重</text>

  <text class="gen" x="577" y="392">第二代·免微调成为默认</text>
  <text class="model" x="577" y="434">CosyVoice</text>
  <text class="date" x="577" y="462">2024 起的项目升级</text>
  <text class="label" x="577" y="504">新音色接入</text>
  <text class="value" x="577" y="532">3-15 秒参考 Prompt，不做反传与优化</text>
  <text class="label" x="577" y="574">关键变化</text>
  <text class="value" x="577" y="602">监督式语义 Token 更靠近“说对”</text>
  <text class="label" x="577" y="644">模型主干</text>
  <text class="value" x="577" y="672">Text-to-Token LLM</text>
  <text class="value" x="577" y="699">+ Conditional Flow Matching 声学渲染</text>
  <rect class="badge2" x="577" y="733" width="346" height="44" rx="22"/>
  <text class="badge-text" x="750" y="761" text-anchor="middle">新音色：推理时条件化，权重不变</text>

  <text class="gen" x="1066" y="392">第三代·托管音色能力</text>
  <text class="model" x="1066" y="434">MiniMax Speech</text>
  <text class="date" x="1066" y="462">当前使用 Speech 2.8 API</text>
  <text class="label" x="1066" y="504">新音色接入</text>
  <text class="value" x="1066" y="532">≥10 秒参考语音 → voice_id</text>
  <text class="label" x="1066" y="574">关键变化</text>
  <text class="value" x="1066" y="602">训练、推理、升级与扩缩容交给平台</text>
  <text class="label" x="1066" y="644">公开 Speech-02 主干＊</text>
  <text class="value" x="1066" y="672">可学习 Speaker Encoder + AR</text>
  <text class="value" x="1066" y="699">+ Latent Flow Matching / Flow-VAE</text>
  <rect class="badge3" x="1066" y="733" width="346" height="44" rx="22"/>
  <text class="badge-text" x="1239" y="761" text-anchor="middle">新音色：注册 API 资产，本地权重不变</text>

  <path d="M466 566 H545" stroke="url(#arrow1)" stroke-width="5" marker-end="url(#arrow-teal)"/>
  <rect class="boundary" x="422" y="809" width="657" height="83" rx="17"/>
  <text class="shift" x="750" y="841" text-anchor="middle">质变一：模型与接入方式</text>
  <text class="shift-note" x="750" y="868" text-anchor="middle">免微调从“官方可用、项目不稳”变成生产默认</text>

  <path d="M955 566 H1034" stroke="url(#arrow2)" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <rect class="boundary" x="900" y="904" width="542" height="83" rx="17"/>
  <text class="shift" x="1171" y="936" text-anchor="middle">质变二：系统边界</text>
  <text class="shift-note" x="1171" y="963" text-anchor="middle">从团队托管通用模型，到平台托管 voice_id 能力</text>

  <rect class="boundary" x="58" y="904" width="788" height="83" rx="17"/>
  <text class="boundary-title" x="86" y="936">两个“免训练”时间点</text>
  <text class="boundary-body" x="86" y="965">研究边界：2018 SV2TTS　|　项目生产主路径：2024 CosyVoice</text>

  <rect class="footer-box" x="300" y="998" width="900" height="34" rx="17"/>
  <text class="footer" x="750" y="1021" text-anchor="middle">免训练 ≠ 模型没训练；训练成本被前移到共享基础模型，新音色只计算条件或注册资产。</text>
</svg>
