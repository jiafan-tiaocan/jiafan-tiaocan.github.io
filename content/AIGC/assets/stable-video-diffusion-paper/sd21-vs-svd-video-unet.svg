<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Stable Diffusion 2.1 与 Stable Video Diffusion 的网络结构差异</title>
  <desc id="desc">左侧是 Stable Diffusion 2.1 的二维 latent diffusion 管线与多尺度 U-Net；右侧是 Stable Video Diffusion 保留同一空间骨架、在空间残差块和空间 Transformer 后插入时间模块的结构。图中同时标出图生视频版本的八通道输入、图像条件、微条件和时序 VAE 解码器。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#F5F7FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="svdCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8B5CF6"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .h1{font-size:36px;font-weight:750;fill:#0F172A}
      .sub{font-size:21px;fill:#475569}
      .panelTitle{font-size:28px;font-weight:750;fill:#0F172A}
      .label{font-size:20px;font-weight:650;fill:#0F172A}
      .small{font-size:17px;fill:#334155}
      .tiny{font-size:16px;fill:#475569}
      .white{fill:#FFFFFF}
    </style>
  </defs>

  <rect width="1600" height="1040" rx="30" fill="url(#pageBg)"/>
  <text x="70" y="72" class="font h1">从 SD 2.1 到 SVD：U 形骨架没换，时间模块被插了进去</text>
  <text x="70" y="112" class="font sub">先分清完整管线与去噪器：VAE / 条件编码器包在外面，Video U-Net 才是论文所说的“时空化”主体</text>

  <g filter="url(#shadow)">
    <rect x="58" y="150" width="710" height="790" rx="26" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="832" y="150" width="710" height="790" rx="26" fill="url(#svdCard)" stroke="#2DD4BF" stroke-width="4"/>
  </g>

  <!-- Left: SD 2.1 -->
  <circle cx="100" cy="199" r="22" fill="#2563EB"/>
  <text x="100" y="207" text-anchor="middle" class="font label white">A</text>
  <text x="136" y="208" class="font panelTitle">Stable Diffusion 2.1：单帧空间去噪</text>

  <rect x="94" y="245" width="180" height="80" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
  <text x="184" y="276" text-anchor="middle" class="font label">图像 → VAE</text>
  <text x="184" y="304" text-anchor="middle" class="font small">得到 4 通道 latent</text>
  <rect x="330" y="245" width="200" height="80" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/>
  <text x="430" y="276" text-anchor="middle" class="font label">带噪 latent</text>
  <text x="430" y="304" text-anchor="middle" class="font small">(B, 4, h, w)</text>
  <rect x="586" y="245" width="146" height="80" rx="16" fill="#EEF2FF" stroke="#818CF8" stroke-width="2.5"/>
  <text x="659" y="276" text-anchor="middle" class="font label">条件</text>
  <text x="659" y="304" text-anchor="middle" class="font tiny">文本→CLIP / 噪声步</text>

  <line x1="274" y1="285" x2="316" y2="285" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <path d="M430 325 C430 372 160 360 160 394" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M659 325 C659 383 344 370 338 423" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowViolet)"/>

  <text x="93" y="374" class="font label" fill="#1D4ED8">SD 2.1 空间 U-Net</text>
  <text x="732" y="374" text-anchor="end" class="font tiny">蓝色模块只在 H×W 内建模</text>

  <g>
    <rect x="94" y="410" width="132" height="118" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="160" y="447" text-anchor="middle" class="font label">Down 1</text>
    <text x="160" y="477" text-anchor="middle" class="font small">C = 320</text>
    <text x="160" y="505" text-anchor="middle" class="font tiny">Res + Attn</text>

    <rect x="252" y="438" width="132" height="118" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="318" y="475" text-anchor="middle" class="font label">Down 2</text>
    <text x="318" y="505" text-anchor="middle" class="font small">C = 640</text>
    <text x="318" y="533" text-anchor="middle" class="font tiny">Res + Attn</text>

    <rect x="410" y="466" width="132" height="118" rx="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="476" y="503" text-anchor="middle" class="font label">Down 3/4</text>
    <text x="476" y="533" text-anchor="middle" class="font small">C = 1280</text>
    <text x="476" y="561" text-anchor="middle" class="font tiny">低分辨率</text>

    <rect x="568" y="494" width="164" height="118" rx="17" fill="#E0E7FF" stroke="#6366F1" stroke-width="3"/>
    <text x="650" y="532" text-anchor="middle" class="font label">Middle</text>
    <text x="650" y="562" text-anchor="middle" class="font small">Res–Attn–Res</text>
    <text x="650" y="590" text-anchor="middle" class="font tiny">语义瓶颈</text>
  </g>

  <path d="M226 469 L238 486" fill="none" stroke="#2563EB" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <path d="M384 497 L397 514" fill="none" stroke="#2563EB" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <path d="M542 525 L555 543" fill="none" stroke="#2563EB" stroke-width="3.5" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="568" y="662" width="164" height="102" rx="17" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
    <text x="650" y="702" text-anchor="middle" class="font label">Up 4 → 1</text>
    <text x="650" y="733" text-anchor="middle" class="font small">拼接 Skip 后上采样</text>
    <rect x="366" y="662" width="166" height="102" rx="17" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <text x="449" y="702" text-anchor="middle" class="font label">多尺度 Skip</text>
    <text x="449" y="733" text-anchor="middle" class="font small">保留细节与定位</text>
    <rect x="94" y="662" width="220" height="102" rx="17" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
    <text x="204" y="702" text-anchor="middle" class="font label">4 通道去噪输出</text>
    <text x="204" y="733" text-anchor="middle" class="font small">VAE 解码为 1 张图</text>
  </g>
  <path d="M650 612 L650 647" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <line x1="568" y1="713" x2="546" y2="713" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <line x1="366" y1="713" x2="329" y2="713" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <path d="M160 528 C160 615 405 606 420 647" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
  <path d="M318 556 C318 610 443 610 449 647" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>

  <rect x="94" y="810" width="638" height="88" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="116" y="844" class="font label">心智模型</text>
  <text x="116" y="875" class="font small">每次只看一张图：空间 ResBlock 画局部，空间 Attention / Cross-Attn 管全局语义与文本条件。</text>

  <!-- Right: SVD -->
  <circle cx="874" cy="199" r="22" fill="#0F766E"/>
  <text x="874" y="207" text-anchor="middle" class="font label white">B</text>
  <text x="910" y="208" class="font panelTitle">Stable Video Diffusion：空间之后再混时间</text>

  <rect x="868" y="245" width="202" height="80" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/>
  <text x="969" y="276" text-anchor="middle" class="font label">I2V 输入 latent</text>
  <text x="969" y="304" text-anchor="middle" class="font small">(B·T, 8, h, w)</text>
  <rect x="1110" y="245" width="196" height="80" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2.5"/>
  <text x="1208" y="276" text-anchor="middle" class="font label">图像语义条件</text>
  <text x="1208" y="304" text-anchor="middle" class="font small">CLIP → Cross-Attn</text>
  <rect x="1346" y="245" width="160" height="80" rx="16" fill="#FAF5FF" stroke="#C084FC" stroke-width="2.5"/>
  <text x="1426" y="276" text-anchor="middle" class="font label">微条件</text>
  <text x="1426" y="304" text-anchor="middle" class="font tiny">fps / motion / aug</text>

  <text x="868" y="374" class="font label" fill="#0F766E">同一套多尺度 U 形空间骨架</text>
  <text x="1506" y="374" text-anchor="end" class="font tiny">青色模块是新增时间路径</text>

  <g>
    <rect x="868" y="410" width="142" height="176" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="881" y="426" width="116" height="52" rx="11" fill="#DBEAFE"/>
    <text x="939" y="458" text-anchor="middle" class="font small">空间 Res</text>
    <rect x="881" y="488" width="116" height="72" rx="11" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="939" y="518" text-anchor="middle" class="font small">时间 Res</text>
    <text x="939" y="544" text-anchor="middle" class="font tiny">3×1×1</text>

    <rect x="1034" y="438" width="142" height="176" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="1047" y="454" width="116" height="52" rx="11" fill="#DBEAFE"/>
    <text x="1105" y="486" text-anchor="middle" class="font small">空间 Attn</text>
    <rect x="1047" y="516" width="116" height="72" rx="11" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="1105" y="546" text-anchor="middle" class="font small">时间 Attn</text>
    <text x="1105" y="572" text-anchor="middle" class="font tiny">沿 T 混合</text>

    <rect x="1200" y="466" width="142" height="176" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="1213" y="482" width="116" height="52" rx="11" fill="#DBEAFE"/>
    <text x="1271" y="514" text-anchor="middle" class="font small">低分辨率</text>
    <rect x="1213" y="544" width="116" height="72" rx="11" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="1271" y="574" text-anchor="middle" class="font small">时空 Block</text>
    <text x="1271" y="600" text-anchor="middle" class="font tiny">C=1280</text>

    <rect x="1366" y="494" width="140" height="176" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="3"/>
    <rect x="1379" y="510" width="114" height="52" rx="11" fill="#E0E7FF"/>
    <text x="1436" y="542" text-anchor="middle" class="font small">Middle</text>
    <rect x="1379" y="572" width="114" height="72" rx="11" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="1436" y="602" text-anchor="middle" class="font small">时间模块</text>
    <text x="1436" y="628" text-anchor="middle" class="font tiny">同样插入</text>
  </g>

  <path d="M1010 498 L1021 516" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrowTeal)"/>
  <path d="M1176 526 L1187 544" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrowTeal)"/>
  <path d="M1342 554 L1353 572" fill="none" stroke="#0F766E" stroke-width="3.5" marker-end="url(#arrowTeal)"/>
  <path d="M969 325 C969 366 939 370 939 395" fill="none" stroke="#F97316" stroke-width="3" marker-end="url(#arrowSlate)"/>
  <path d="M1208 325 C1208 382 1105 379 1105 424" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowViolet)"/>
  <path d="M1426 325 C1426 385 1410 422 1402 477" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowViolet)"/>

  <g>
    <rect x="1366" y="710" width="140" height="100" rx="17" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="1436" y="748" text-anchor="middle" class="font label">Up 4 → 1</text>
    <text x="1436" y="779" text-anchor="middle" class="font tiny">时空 Block + Skip</text>
    <rect x="1122" y="710" width="208" height="100" rx="17" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5"/>
    <text x="1226" y="748" text-anchor="middle" class="font label">多尺度 Skip</text>
    <text x="1226" y="779" text-anchor="middle" class="font tiny">仍按帧保留空间细节</text>
    <rect x="868" y="710" width="218" height="100" rx="17" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
    <text x="977" y="748" text-anchor="middle" class="font label">4 通道 × T 输出</text>
    <text x="977" y="779" text-anchor="middle" class="font tiny">时序 VAE Decoder 去闪烁</text>
  </g>
  <path d="M1436 670 L1436 695" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <line x1="1366" y1="760" x2="1345" y2="760" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <line x1="1122" y1="760" x2="1101" y2="760" stroke="#475569" stroke-width="3.5" marker-end="url(#arrowSlate)"/>
  <path d="M939 586 C939 668 1180 653 1194 695" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>
  <path d="M1105 614 C1105 667 1220 669 1226 695" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>

  <rect x="868" y="843" width="638" height="55" rx="15" fill="#0F766E"/>
  <text x="1187" y="878" text-anchor="middle" class="font small white">不是“全 3D 化”：空间权重来自 SD 2.1，空间层与时间层一起训练</text>

  <!-- Difference banner -->
  <g filter="url(#shadow)">
    <rect x="348" y="965" width="904" height="50" rx="16" fill="#0F172A"/>
  </g>
  <text x="800" y="997" text-anchor="middle" class="font label white">核心变更：单帧空间先验 + 因子化时间混合；论文主模型新增 656M 时间参数，U-Net 总计 1.521B</text>
</svg>
