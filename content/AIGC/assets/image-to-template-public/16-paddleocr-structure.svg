<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1080" viewBox="0 0 1880 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315f9a"/></marker>
    <style>
      .f{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.title{font-size:38px;font-weight:800;fill:#172033}.sub{font-size:18px;fill:#59677a}.section{font-size:22px;font-weight:800;fill:#172033}.node{font-size:18px;font-weight:800;fill:#172033}.body{font-size:16px;fill:#4f5c70}.small{font-size:14px;fill:#69758a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#324158}.tag{font-size:14px;font-weight:800;fill:#fff}.metric{font-size:17px;font-weight:800;fill:#315f9a}.white{font-size:17px;font-weight:800;fill:#fff}.whiteBody{font-size:14px;fill:#eaf2ff}
    </style>
  </defs>
  <rect width="1880" height="1080" fill="#fff"/>
  <text class="f title" x="60" y="64">PaddleOCR：先定位文字，再识别字符，最后重建可编辑文本层</text>
  <text class="f sub" x="60" y="98">项目历史 Checkpoint 未保留；下图以官方 PP-OCRv4 mobile 配置为可复现参照，说明这类两阶段 OCR 的主要网络与接口</text>
  <line x1="60" y1="122" x2="1820" y2="122" stroke="#aeb8c6" stroke-width="2"/>

  <text class="f section" x="60" y="176">① 文字检测：回答“文字在哪里”</text>
  <rect x="60" y="198" width="1760" height="310" rx="20" fill="#f8fafc" stroke="#c5ced9" stroke-width="2"/>
  <rect x="88" y="234" width="220" height="218" rx="16" fill="#edf3ff" stroke="#315f9a" stroke-width="2"/>
  <rect x="116" y="266" width="164" height="92" rx="8" fill="#173154"/>
  <text class="f white" x="198" y="305" text-anchor="middle">探索深海</text>
  <text class="f whiteBody" x="198" y="334" text-anchor="middle">立即了解</text>
  <text class="f node" x="198" y="394" text-anchor="middle">整张 RGB 卡片</text>
  <text class="f small" x="198" y="422" text-anchor="middle">长边限制 + 归一化</text>

  <line x1="308" y1="343" x2="360" y2="343" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="374" y="250" width="250" height="184" rx="16" fill="#fff" stroke="#315f9a" stroke-width="3"/>
  <text class="f node" x="499" y="288" text-anchor="middle">PPLCNetV3 ×0.75</text>
  <text class="f body" x="402" y="322">轻量 CNN Backbone</text>
  <text class="f body" x="402" y="352">多尺度提取笔画与行纹理</text>
  <text class="f small" x="402" y="392">输出多个分辨率特征图</text>

  <line x1="624" y1="343" x2="676" y2="343" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="690" y="250" width="224" height="184" rx="16" fill="#fff" stroke="#2b8a64" stroke-width="3"/>
  <text class="f node" x="802" y="288" text-anchor="middle">RSEFPN</text>
  <text class="f body" x="716" y="322">通道数 96</text>
  <text class="f body" x="716" y="352">融合大小文字特征</text>
  <text class="f small" x="716" y="392">保留跨层 Shortcut</text>

  <line x1="914" y1="343" x2="966" y2="343" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="980" y="250" width="224" height="184" rx="16" fill="#fff7f0" stroke="#d85c35" stroke-width="3"/>
  <text class="f node" x="1092" y="288" text-anchor="middle">DB Head</text>
  <text class="f body" x="1006" y="322">概率图 + 阈值图</text>
  <text class="f body" x="1006" y="352">可微二值化 k=50</text>
  <text class="f small" x="1006" y="392">训练：Dice + OHEM</text>

  <line x1="1204" y1="343" x2="1256" y2="343" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1270" y="250" width="248" height="184" rx="16" fill="#fff" stroke="#9aa7b8" stroke-width="2"/>
  <text class="f node" x="1394" y="288" text-anchor="middle">DB 后处理</text>
  <text class="f body" x="1298" y="322">阈值 0.3 / 框阈值 0.6</text>
  <text class="f body" x="1298" y="352">连通域 → Polygon</text>
  <text class="f small" x="1298" y="392">Unclip 1.5 扩回完整文字</text>

  <line x1="1518" y1="343" x2="1570" y2="343" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1584" y="250" width="204" height="184" rx="16" fill="#102a54"/>
  <text class="f white" x="1686" y="288" text-anchor="middle">检测输出</text>
  <text class="f whiteBody" x="1610" y="326">dt_polys</text>
  <text class="f whiteBody" x="1610" y="356">检测分数</text>
  <text class="f whiteBody" x="1610" y="386">原图四边形区域</text>
  <rect x="88" y="466" width="1700" height="24" rx="12" fill="#e9eef5"/>
  <text class="f small" x="938" y="484" text-anchor="middle">PP-OCRv4_mobile_det 官方推理模型文件约 4.7 MB；这是部署文件大小，不等同于精确参数量</text>

  <text class="f section" x="60" y="560">② 文字识别：回答“框里写了什么”</text>
  <rect x="60" y="582" width="1260" height="330" rx="20" fill="#f8fafc" stroke="#c5ced9" stroke-width="2"/>
  <rect x="88" y="626" width="212" height="226" rx="16" fill="#f2f7f4" stroke="#2b8a64" stroke-width="2"/>
  <rect x="112" y="658" width="164" height="56" rx="8" fill="#173154"/>
  <text class="f white" x="194" y="694" text-anchor="middle">探索深海</text>
  <text class="f node" x="194" y="758" text-anchor="middle">透视矫正 Crop</text>
  <text class="f mono" x="194" y="790" text-anchor="middle">[3,48,320]</text>
  <text class="f small" x="194" y="824" text-anchor="middle">按文字方向排序</text>

  <line x1="300" y1="742" x2="352" y2="742" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="366" y="642" width="226" height="196" rx="16" fill="#fff" stroke="#315f9a" stroke-width="3"/>
  <text class="f node" x="479" y="680" text-anchor="middle">PPLCNetV3 ×0.95</text>
  <text class="f body" x="392" y="718">把字形压成序列特征</text>
  <text class="f body" x="392" y="748">兼顾局部笔画与上下文</text>
  <text class="f small" x="392" y="790">识别 Backbone</text>

  <line x1="592" y1="742" x2="644" y2="742" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="658" y="642" width="216" height="196" rx="16" fill="#fff" stroke="#6952bd" stroke-width="3"/>
  <text class="f node" x="766" y="680" text-anchor="middle">SVTR Neck</text>
  <text class="f body" x="684" y="718">2 层 · hidden 120</text>
  <text class="f body" x="684" y="748">轻量全局字符关系</text>
  <text class="f small" x="684" y="790">kernel [1,3]</text>

  <line x1="874" y1="742" x2="926" y2="742" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="940" y="642" width="220" height="196" rx="16" fill="#fff7f0" stroke="#d85c35" stroke-width="3"/>
  <text class="f node" x="1050" y="680" text-anchor="middle">MultiHead</text>
  <text class="f body" x="966" y="718">训练：CTC + NRTR</text>
  <text class="f body" x="966" y="748">推理：CTC Decode</text>
  <text class="f small" x="966" y="790">字符序列 + 置信度</text>

  <line x1="1160" y1="742" x2="1200" y2="742" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1214" y="642" width="82" height="196" rx="16" fill="#102a54"/>
  <text class="f tag" x="1255" y="690" text-anchor="middle">输出</text>
  <text class="f whiteBody" x="1255" y="738" text-anchor="middle">文字</text>
  <text class="f whiteBody" x="1255" y="770" text-anchor="middle">分数</text>
  <text class="f whiteBody" x="1255" y="802" text-anchor="middle">行框</text>

  <rect x="88" y="870" width="1208" height="24" rx="12" fill="#e9eef5"/>
  <text class="f small" x="692" y="888" text-anchor="middle">PP-OCRv4_mobile_rec 官方推理模型文件约 10.5 MB；部署时检测与识别是两个独立权重</text>

  <text class="f section" x="1360" y="560">③ 项目 Adapter：模型结果还不是模版</text>
  <rect x="1360" y="582" width="460" height="330" rx="20" fill="#fbf9ff" stroke="#6952bd" stroke-width="3"/>
  <text class="f node" x="1390" y="630">几何适配</text>
  <text class="f body" x="1390" y="660">Polygon / Crop 坐标逆映射回原图</text>
  <text class="f node" x="1390" y="710">内容强校验</text>
  <text class="f body" x="1390" y="740">金额、日期、数字、词典与低分重试</text>
  <text class="f node" x="1390" y="790">可编辑化</text>
  <text class="f body" x="1390" y="820">角色规则 + 颜色候选 + 字号近似</text>
  <text class="f body" x="1390" y="850">生成 Text Layer 与外扩羽化 Mask</text>
  <rect x="1390" y="872" width="400" height="24" rx="12" fill="#eee9ff"/>
  <text class="f small" x="1590" y="890" text-anchor="middle">输出：text / bbox / score / style / source</text>

  <rect x="60" y="956" width="1760" height="76" rx="16" fill="#f4f6f9" stroke="#c8d0db"/>
  <text class="f metric" x="88" y="988">职责边界：</text>
  <text class="f body" x="194" y="988">DB 检测器负责“哪里有字”；SVTR_LCNet 识别器负责“写了什么”；项目规则负责“它是标题还是说明、怎样变成可编辑层”。</text>
  <text class="f small" x="88" y="1018">图中网络与 4.7/10.5 MB 文件量级来自 PaddleOCR 官方 PP-OCRv4 mobile 配置和模型表；历史项目只确认使用 PaddleOCR，不能反推线上精确版本。</text>
</svg>
