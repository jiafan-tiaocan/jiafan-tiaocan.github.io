<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1560" viewBox="0 0 1880 1560">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315f9a"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2b8a64"/></marker>
    <style>
      .f{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.title{font-size:36px;font-weight:800;fill:#172033}.sub{font-size:18px;fill:#5c6778}.label{font-size:22px;font-weight:800;fill:#172033}.node{font-size:18px;font-weight:800;fill:#172033}.body{font-size:15px;fill:#4f5c70}.small{font-size:13px;fill:#69758a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#324158}.chip{font-size:14px;font-weight:700;fill:#30415d}.metric{font-size:31px;font-weight:800;fill:#173c72}.white{font-size:17px;font-weight:800;fill:#fff}.whiteBody{font-size:14px;fill:#edf3ff}
    </style>
  </defs>
  <rect width="1880" height="1560" fill="#fff"/>
  <text class="f title" x="52" y="58">Grounding DINO + SAM 2：先用语言找框，再用提示分割贴边</text>
  <text class="f sub" x="52" y="91">Grounding DINO 解决开放词汇定位，SAM 2 解决框内像素边界；业务角色仍由规则与 Schema 门禁裁决</text>
  <line x1="52" y1="112" x2="1828" y2="112" stroke="#aeb8c6" stroke-width="2"/>

  <!-- Grounding DINO -->
  <text class="f label" x="52" y="154">(a) Grounding DINO-T：文本条件的开放词汇检测</text>
  <rect x="52" y="178" width="876" height="486" rx="18" fill="#f8faff" stroke="#315f9a" stroke-width="2"/>
  <rect x="80" y="214" width="190" height="178" rx="14" fill="#fff" stroke="#8ca7cd"/>
  <text class="f node" x="175" y="246" text-anchor="middle">双路输入编码</text>
  <rect x="100" y="268" width="150" height="45" rx="9" fill="#eaf2fd"/>
  <text class="f chip" x="175" y="296" text-anchor="middle">RGB → Swin-T</text>
  <rect x="100" y="326" width="150" height="45" rx="9" fill="#fff2e9"/>
  <text class="f chip" x="175" y="354" text-anchor="middle">“strip.” → BERT</text>
  <text class="f small" x="175" y="382" text-anchor="middle">多尺度视觉 + 文本 Token</text>
  <line x1="270" y1="304" x2="318" y2="304" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="334" y="214" width="210" height="178" rx="14" fill="#edf3ff" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="439" y="246" text-anchor="middle">Feature Enhancer</text>
  <text class="f body" x="358" y="282">图像可变形 Self-Attn</text>
  <text class="f body" x="358" y="312">文本 Self-Attn</text>
  <text class="f body" x="358" y="342">图像 ↔ 文本 Cross-Attn</text>
  <text class="f small" x="439" y="376" text-anchor="middle">先让两种模态互相看见</text>
  <line x1="544" y1="304" x2="592" y2="304" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="608" y="214" width="290" height="178" rx="14" fill="#fff" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="753" y="246" text-anchor="middle">Query Selection + Decoder</text>
  <text class="f body" x="632" y="282">语言引导选择 900 个 Object Query</text>
  <text class="f body" x="632" y="312">6 层 Cross-modality Decoder</text>
  <text class="f body" x="632" y="342">hidden 256 · 8 heads · FFN 2048</text>
  <text class="f small" x="753" y="376" text-anchor="middle">Query 同时读取图像特征与文本特征</text>

  <line x1="175" y1="416" x2="175" y2="454" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="439" y1="416" x2="439" y2="454" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="753" y1="416" x2="753" y2="454" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="80" y="470" width="818" height="154" rx="14" fill="#102a54"/>
  <text class="f white" x="106" y="505">输出契约：开放词汇 BBox，而不是像素 Mask</text>
  <text class="f whiteBody" x="106" y="540">默认 900 个候选 · boxes 为归一化 cxcywh · 每个 Query 对全部文本 Token 输出相似度</text>
  <text class="f whiteBody" x="106" y="570">box_threshold 过滤候选框；text_threshold 从 Token 相似度恢复 phrase</text>
  <text class="f whiteBody" x="106" y="600">官方 Grounding DINO-T / Swin-T Checkpoint：172,277,902 参数，约 172.3M</text>

  <!-- SAM2 -->
  <text class="f label" x="964" y="154">(b) SAM 2：由 Box Prompt 约束的可提示分割</text>
  <rect x="964" y="178" width="864" height="486" rx="18" fill="#f7fbf9" stroke="#2b8a64" stroke-width="2"/>
  <rect x="992" y="214" width="190" height="178" rx="14" fill="#fff" stroke="#79b49d"/>
  <text class="f node" x="1087" y="246" text-anchor="middle">图像编码器</text>
  <text class="f body" x="1018" y="282">1024×1024 RGB</text>
  <text class="f body" x="1018" y="312">Hiera 分层 ViT</text>
  <text class="f body" x="1018" y="342">FPN → 256 维特征</text>
  <text class="f small" x="1087" y="376" text-anchor="middle">高分辨率旁路保留细边界</text>
  <path d="M1182 304 V196 H1660 V214" fill="none" stroke="#2b8a64" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text class="f small" x="1420" y="190" text-anchor="middle">图像特征直接进入 Mask Decoder</text>
  <rect x="1246" y="214" width="210" height="178" rx="14" fill="#edf7f2" stroke="#2b8a64" stroke-width="2"/>
  <text class="f node" x="1351" y="246" text-anchor="middle">Prompt Encoder</text>
  <text class="f body" x="1270" y="282">Grounding DINO 的 xyxy</text>
  <text class="f body" x="1270" y="312">→ 两个角点 Token</text>
  <text class="f body" x="1270" y="342">可叠加正负点或 Mask</text>
  <text class="f small" x="1351" y="376" text-anchor="middle">提示模型“分割哪一个对象”</text>
  <line x1="1456" y1="304" x2="1504" y2="304" stroke="#2b8a64" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="1520" y="214" width="280" height="178" rx="14" fill="#fff" stroke="#2b8a64" stroke-width="2"/>
  <text class="f node" x="1660" y="246" text-anchor="middle">Two-way Mask Decoder</text>
  <text class="f body" x="1544" y="282">Prompt ↔ Image 双向 Attention</text>
  <text class="f body" x="1544" y="312">融合高分辨率 FPN 特征</text>
  <text class="f body" x="1544" y="342">输出 3 个候选 Mask + IoU</text>
  <text class="f small" x="1660" y="376" text-anchor="middle">再上采样回原图尺寸</text>

  <rect x="992" y="430" width="808" height="90" rx="14" fill="#f1f3f6" stroke="#aeb8c6" stroke-dasharray="8 6"/>
  <text class="f node" x="1018" y="463">视频专用旁路：Memory Encoder → Memory Bank → 4 层 Memory Attention</text>
  <text class="f body" x="1018" y="493">项目处理单张广告图，不累积跨帧 Memory；不能把视频记忆机制写成按钮分割的必要步骤。</text>
  <rect x="992" y="542" width="808" height="82" rx="14" fill="#123e34"/>
  <text class="f white" x="1018" y="575">输出契约：像素 Mask，不判断业务角色</text>
  <text class="f whiteBody" x="1018" y="604">masks [3,H,W] · IoU predictions [3] · low-res logits [3,256,256]</text>

  <!-- connector and responsibilities -->
  <rect x="824" y="678" width="232" height="76" rx="14" fill="#fff3eb" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="940" y="708" text-anchor="middle">确定性适配器</text>
  <text class="f small" x="940" y="734" text-anchor="middle">cxcywh → xyxy · 阈值 · 形状门禁</text>
  <path d="M898 584 H940 V678" fill="none" stroke="#d85c35" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1056 716 H1210 V350 H1246" fill="none" stroke="#d85c35" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- concrete prompt contract -->
  <text class="f label" x="52" y="800">(c) 从文本 Prompt 到 Box Prompt：一条可以直接实现的接口样例</text>
  <rect x="52" y="824" width="1776" height="250" rx="18" fill="#fffaf6" stroke="#d98a61" stroke-width="2"/>

  <rect x="80" y="862" width="310" height="166" rx="14" fill="#edf3ff" stroke="#315f9a"/>
  <text class="f node" x="105" y="895">① Grounding DINO 输入</text>
  <text class="f mono" x="105" y="925">image = RGB[628,1200,3]</text>
  <text class="f mono" x="105" y="951">caption = "strip."</text>
  <text class="f mono" x="105" y="977">box_threshold = 0.35</text>
  <text class="f mono" x="105" y="1003">text_threshold = 0.25</text>
  <line x1="390" y1="945" x2="420" y2="945" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="432" y="862" width="310" height="166" rx="14" fill="#fff" stroke="#315f9a"/>
  <text class="f node" x="457" y="895">② 原始候选</text>
  <text class="f mono" x="457" y="925">phrase = "strip"</text>
  <text class="f mono" x="457" y="951">score = 0.84</text>
  <text class="f mono" x="457" y="977">cxcywh = [.781,.851,</text>
  <text class="f mono" x="457" y="1003">          .225,.089]</text>
  <line x1="742" y1="945" x2="772" y2="945" stroke="#d85c35" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="784" y="862" width="310" height="166" rx="14" fill="#fff3eb" stroke="#d85c35"/>
  <text class="f node" x="809" y="895">③ 确定性坐标适配</text>
  <text class="f mono" x="809" y="925">cxcywh → pixel xyxy</text>
  <text class="f mono" x="809" y="951">bbox = [802,506,</text>
  <text class="f mono" x="809" y="977">        1072,562]</text>
  <text class="f mono" x="809" y="1003">ratio = 4.82 → 形状门禁</text>
  <line x1="1094" y1="945" x2="1124" y2="945" stroke="#2b8a64" stroke-width="3" marker-end="url(#greenArrow)"/>

  <rect x="1136" y="862" width="310" height="166" rx="14" fill="#edf7f2" stroke="#2b8a64"/>
  <text class="f node" x="1161" y="895">④ SAM 2 Box Prompt</text>
  <text class="f mono" x="1161" y="925">box = [[802,506,</text>
  <text class="f mono" x="1161" y="951">        1072,562]]</text>
  <text class="f mono" x="1161" y="977">point_coords = None</text>
  <text class="f mono" x="1161" y="1003">multimask_output = True</text>
  <line x1="1446" y1="945" x2="1476" y2="945" stroke="#2b8a64" stroke-width="3" marker-end="url(#greenArrow)"/>

  <rect x="1488" y="862" width="312" height="166" rx="14" fill="#123e34" stroke="#2b8a64"/>
  <text class="f white" x="1513" y="895">⑤ 候选与最终门禁</text>
  <text class="f whiteBody" x="1513" y="925">masks = [3,628,1200]</text>
  <text class="f whiteBody" x="1513" y="951">scores = [.91,.86,.63]</text>
  <text class="f whiteBody" x="1513" y="977">logits = [3,256,256]</text>
  <text class="f whiteBody" x="1513" y="1003">选 mask[0]，再验形状 / OCR</text>
  <text class="f small" x="80" y="1054">注：框、阈值和质量分是贯穿全文的合成接口样例，用于说明坐标空间与张量形状，不代表遗失的线上配置。</text>

  <text class="f label" x="52" y="1090">(d) 参数量与工程职责</text>
  <rect x="52" y="1114" width="1776" height="364" rx="18" fill="#fbfcfe" stroke="#9aa7b8" stroke-width="2"/>
  <rect x="80" y="1144" width="540" height="136" rx="14" fill="#edf3ff" stroke="#6d8fbd"/>
  <text class="f metric" x="350" y="1192" text-anchor="middle">Grounding DINO-T · 172.3M</text>
  <text class="f body" x="106" y="1228">Swin-T + BERT-base + Feature Enhancer + 6 层 Decoder</text>
  <text class="f body" x="106" y="1258">解决：文字描述对应哪一个区域；不输出像素边界</text>
  <rect x="648" y="1144" width="540" height="136" rx="14" fill="#edf7f2" stroke="#52a984"/>
  <text class="f metric" x="918" y="1192" text-anchor="middle">SAM 2.1 · 38.9M–224.4M</text>
  <text class="f body" x="674" y="1228">Hiera-T 38.9M · S 46.0M · B+ 80.8M · L 224.4M</text>
  <text class="f body" x="674" y="1258">解决：给定框后哪些像素属于对象；不理解“按钮”角色</text>
  <rect x="1216" y="1144" width="584" height="136" rx="14" fill="#fff3eb" stroke="#d98a61"/>
  <text class="f metric" x="1508" y="1192" text-anchor="middle">项目版本：未保留</text>
  <text class="f body" x="1242" y="1228">历史材料只写 GroundingDINO + SAM2，没有 Checkpoint 名。</text>
  <text class="f body" x="1242" y="1258">本文用官方 Grounding DINO-T 与 SAM 2.1 型号表说明量级。</text>

  <rect x="80" y="1310" width="1720" height="132" rx="14" fill="#102a54"/>
  <text class="f white" x="106" y="1346">三层问题必须分开</text>
  <text class="f whiteBody" x="106" y="1380">Grounding DINO：“哪里像长条区域？”　→　SAM 2：“这个框里哪些像素连成目标？”</text>
  <text class="f whiteBody" x="106" y="1410">形状 / OCR / Schema 门禁：“它是否真的承担 Control 角色，能否作为独立图层交付？”</text>
  <text class="f small" x="52" y="1518">结构依据 Grounding DINO 与 SAM 2 官方论文、配置和模型仓库确定性重绘；参数量采用官方 Checkpoint 口径。</text>
</svg>
