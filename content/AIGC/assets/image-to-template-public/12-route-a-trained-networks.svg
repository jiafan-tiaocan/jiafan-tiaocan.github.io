<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1600" viewBox="0 0 1880 1600">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a54"/><stop offset="1" stop-color="#185b76"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2f6df6"/></marker>
    <marker id="gradArrow" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#ee7441"/></marker>
    <style>
      .f{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:20px;fill:#dbeaff}.panelTitle{font-size:27px;font-weight:800;fill:#172033}.panelSub{font-size:17px;fill:#637084}.nodeTitle{font-size:20px;font-weight:800;fill:#172033}.body{font-size:16px;fill:#526075}.small{font-size:14px;fill:#68768a}.whiteTitle{font-size:20px;font-weight:800;fill:#fff}.whiteBody{font-size:16px;fill:#e5edfb}.chip{font-size:15px;font-weight:700;fill:#26344b}.legend{font-size:16px;font-weight:700;fill:#26344b}
    </style>
  </defs>
  <rect width="1880" height="1600" fill="#fff"/>
  <rect width="1880" height="116" fill="url(#header)"/>
  <text class="f title" x="62" y="57">路线 A：三个经过训练的模块，参数究竟怎样流动</text>
  <text class="f sub" x="62" y="91">蓝色为前向张量流，橙色虚线为训练梯度；灰色模块冻结，橙色模块更新参数</text>

  <!-- Logo YOLOv7 -->
  <rect x="52" y="144" width="1776" height="408" rx="28" fill="#f6f9ff" stroke="#cbd8ee" stroke-width="2"/>
  <text class="f panelTitle" x="82" y="188">A. Logo Slot：域内训练的单类 YOLOv7</text>
  <text class="f panelSub" x="82" y="218">历史材料明确记录 YOLOv7；以下层级与张量尺寸对齐官方训练配置，类别数 C=1，输入示例为 960×960</text>
  <rect x="82" y="254" width="205" height="160" rx="20" fill="#fff" stroke="#2f6df6" stroke-width="3" filter="url(#shadow)"/>
  <text class="f nodeTitle" x="184" y="292" text-anchor="middle">训练样本</text>
  <text class="f body" x="104" y="326">RGB [B,3,960,960]</text>
  <text class="f body" x="104" y="356">GT: class,cx,cy,w,h</text>
  <text class="f small" x="104" y="386">Sketch Logo Slot 自动产标</text>
  <line x1="287" y1="334" x2="337" y2="334" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="353" y="248" width="330" height="174" rx="20" fill="#fff" stroke="#2f6df6" stroke-width="3"/>
  <text class="f nodeTitle" x="518" y="284" text-anchor="middle">Backbone：Stem + E-ELAN</text>
  <text class="f body" x="378" y="316">Conv 下采样：/2、/4、/8、/16、/32</text>
  <text class="f body" x="378" y="346">多分支 Conv → Concat → 1×1 聚合</text>
  <text class="f body" x="378" y="376">输出 P3 / P4 / P5 多尺度特征</text>
  <text class="f small" x="378" y="402">小 Logo 主要依赖 P3/8 高分辨率特征</text>
  <line x1="683" y1="334" x2="733" y2="334" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="749" y="248" width="322" height="174" rx="20" fill="#fff" stroke="#2f6df6" stroke-width="3"/>
  <text class="f nodeTitle" x="910" y="284" text-anchor="middle">Neck：SPPCSPC + PAN/FPN</text>
  <text class="f body" x="774" y="316">SPP 扩大感受野</text>
  <text class="f body" x="774" y="346">Top-down 上采样融合语义</text>
  <text class="f body" x="774" y="376">Bottom-up 回传定位信息</text>
  <text class="f small" x="774" y="402">输出通道：P3=256, P4=512, P5=1024</text>
  <line x1="1071" y1="334" x2="1121" y2="334" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1137" y="238" width="350" height="194" rx="20" fill="#fff" stroke="#2f6df6" stroke-width="3"/>
  <text class="f nodeTitle" x="1312" y="276" text-anchor="middle">RepConv + IDetect 三尺度头</text>
  <text class="f body" x="1162" y="310">P3: [B,18,120,120] → [B,3,120,120,6]</text>
  <text class="f body" x="1162" y="340">P4: [B,18,60,60] → [B,3,60,60,6]</text>
  <text class="f body" x="1162" y="370">P5: [B,18,30,30] → [B,3,30,30,6]</text>
  <text class="f small" x="1162" y="402">每格 3 Anchor × (xywh + obj + 1 class)</text>
  <line x1="1487" y1="334" x2="1537" y2="334" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1553" y="254" width="236" height="160" rx="20" fill="#102a54" filter="url(#shadow)"/>
  <text class="f whiteTitle" x="1671" y="292" text-anchor="middle">解码 + NMS</text>
  <text class="f whiteBody" x="1578" y="326">像素 XYXY + score</text>
  <text class="f whiteBody" x="1578" y="356">安全边距与坐标逆变换</text>
  <text class="f whiteBody" x="1578" y="386">输出 Logo Slot</text>
  <path d="M1440 448 H480" fill="none" stroke="#ee7441" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#gradArrow)"/>
  <text class="f chip" x="960" y="475" text-anchor="middle">L = λbox·CIoU + λobj·BCEobj + λcls·BCEcls；梯度更新 Backbone、Neck 与 Head</text>

  <!-- Main visual -->
  <rect x="52" y="580" width="1776" height="354" rx="28" fill="#faf7ff" stroke="#d5cbed" stroke-width="2"/>
  <text class="f panelTitle" x="82" y="624">B. 主视觉：独立训练的 YOLOv7-tiny 复原实现</text>
  <text class="f panelSub" x="82" y="654">原始材料只保留“小检测模型”，没有网络名；这里给出与当时 YOLOv7 工具链一致、可完整复现的独立 checkpoint</text>
  <rect x="82" y="696" width="238" height="140" rx="20" fill="#fff" stroke="#7857d8" stroke-width="3"/>
  <text class="f nodeTitle" x="201" y="732" text-anchor="middle">输入与监督</text>
  <text class="f body" x="106" y="766">RGB [B,3,960,960]</text>
  <text class="f body" x="106" y="796">GT: main_visual BBox</text>
  <text class="f small" x="106" y="822">组合图层先求联合框</text>
  <line x1="320" y1="766" x2="370" y2="766" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="386" y="686" width="300" height="160" rx="20" fill="#fff" stroke="#7857d8" stroke-width="3"/>
  <text class="f nodeTitle" x="536" y="722" text-anchor="middle">Tiny Backbone</text>
  <text class="f body" x="410" y="754">LeakyReLU Conv + ELAN-lite</text>
  <text class="f body" x="410" y="784">MaxPool 下采样到 P3/P4/P5</text>
  <text class="f small" x="410" y="816">减少层数与通道，保留三尺度</text>
  <line x1="686" y1="766" x2="736" y2="766" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="752" y="686" width="300" height="160" rx="20" fill="#fff" stroke="#7857d8" stroke-width="3"/>
  <text class="f nodeTitle" x="902" y="722" text-anchor="middle">SPP + PAN/FPN</text>
  <text class="f body" x="776" y="754">池化核 5 / 9 / 13</text>
  <text class="f body" x="776" y="784">上采样融合 + 下采样回流</text>
  <text class="f small" x="776" y="816">输出 P3=128, P4=256, P5=512</text>
  <line x1="1052" y1="766" x2="1102" y2="766" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1118" y="686" width="334" height="160" rx="20" fill="#fff" stroke="#7857d8" stroke-width="3"/>
  <text class="f nodeTitle" x="1285" y="722" text-anchor="middle">三尺度 IDetect</text>
  <text class="f body" x="1144" y="754">Raw: [B,18,120,120] / [B,18,60,60]</text>
  <text class="f body" x="1144" y="784">/ [B,18,30,30]，C=1</text>
  <text class="f small" x="1144" y="816">主视觉专属 Anchor 与置信阈值</text>
  <line x1="1452" y1="766" x2="1502" y2="766" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1518" y="696" width="270" height="140" rx="20" fill="#30255d"/>
  <text class="f whiteTitle" x="1653" y="732" text-anchor="middle">BBox → 像素资产</text>
  <text class="f whiteBody" x="1542" y="766">NMS + 越界 / 文字重叠门禁</text>
  <text class="f whiteBody" x="1542" y="796">SAM2 / Alpha 细化</text>
  <text class="f whiteBody" x="1542" y="824">输出 MainVisual 图层</text>
  <path d="M1420 872 H470" fill="none" stroke="#ee7441" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#gradArrow)"/>
  <text class="f chip" x="945" y="900" text-anchor="middle">检测损失更新整个 tiny detector；抠图模型不在这次训练图中更新</text>

  <!-- FLUX LoRA -->
  <rect x="52" y="962" width="1776" height="570" rx="28" fill="#f5fbf8" stroke="#c4dfd2" stroke-width="2"/>
  <text class="f panelTitle" x="82" y="1006">C. Object-removal LoRA：冻结 FLUX.1 Fill，只训练低秩增量</text>
  <text class="f panelSub" x="82" y="1036">原材料确认“FLUX Fill + 对象移除 LoRA”；注入层未留存，本文采用可复现的 q/k/v/o Attention LoRA（rank≈16）</text>
  <rect x="82" y="1080" width="240" height="182" rx="20" fill="#fff" stroke="#19a974" stroke-width="3"/>
  <text class="f nodeTitle" x="202" y="1118" text-anchor="middle">Sketch 训练三元组</text>
  <text class="f body" x="108" y="1152">I：带前景成品图</text>
  <text class="f body" x="108" y="1182">M：白色表示需重建</text>
  <text class="f body" x="108" y="1212">Ibg：隐藏前景的干净底图</text>
  <text class="f small" x="108" y="1242">同一模版确定性渲染</text>
  <line x1="322" y1="1171" x2="372" y2="1171" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="388" y="1080" width="254" height="182" rx="20" fill="#f2f4f7" stroke="#aeb8c6" stroke-width="3"/>
  <text class="f nodeTitle" x="515" y="1118" text-anchor="middle">冻结 VAE + 条件编码</text>
  <text class="f body" x="414" y="1152">E(Ibg) → 目标 latent z1</text>
  <text class="f body" x="414" y="1182">E(I⊙(1-M)) + M</text>
  <text class="f body" x="414" y="1212">CLIP pooled + T5 tokens</text>
  <text class="f small" x="414" y="1242">只提供 latent 与文本条件</text>
  <line x1="642" y1="1171" x2="692" y2="1171" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="708" y="1080" width="260" height="182" rx="20" fill="#f2f4f7" stroke="#aeb8c6" stroke-width="3"/>
  <text class="f nodeTitle" x="838" y="1118" text-anchor="middle">Flow Matching 出题</text>
  <text class="f body" x="734" y="1152">z0 ~ N(0,I), t ~ U(0,1)</text>
  <text class="f body" x="734" y="1182">zt=(1-t)z0+t z1</text>
  <text class="f body" x="734" y="1212">目标速度 v*=z1-z0</text>
  <text class="f small" x="734" y="1242">mask / 缺损图作为 Fill 条件</text>
  <line x1="968" y1="1171" x2="1018" y2="1171" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1034" y="1062" width="406" height="220" rx="22" fill="#fff" stroke="#ee7441" stroke-width="4" filter="url(#shadow)"/>
  <text class="f nodeTitle" x="1237" y="1100" text-anchor="middle">FLUX Transformer（基座冻结）</text>
  <text class="f body" x="1060" y="1134">19 × Dual-stream：图像 / 文本联合 Attention</text>
  <text class="f body" x="1060" y="1164">38 × Single-stream：融合 Token Attention + MLP</text>
  <text class="f body" x="1060" y="1194">24 heads × 128 dim = hidden 3072</text>
  <rect x="1060" y="1212" width="354" height="45" rx="16" fill="#fff0e9"/>
  <text class="f chip" x="1237" y="1241" text-anchor="middle">仅 q/k/v/o 的 A、B 低秩矩阵可训练</text>
  <line x1="1440" y1="1171" x2="1490" y2="1171" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1506" y="1080" width="282" height="182" rx="20" fill="#102a54"/>
  <text class="f whiteTitle" x="1647" y="1118" text-anchor="middle">速度预测与解码</text>
  <text class="f whiteBody" x="1532" y="1152">vθ(zt,t,mask,context)</text>
  <text class="f whiteBody" x="1532" y="1182">采样积分 → ẑbg</text>
  <text class="f whiteBody" x="1532" y="1212">冻结 VAE Decode</text>
  <text class="f whiteBody" x="1532" y="1242">输出完整背景 RGB</text>
  <path d="M1460 1320 H1110" fill="none" stroke="#ee7441" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#gradArrow)"/>
  <rect x="670" y="1300" width="790" height="82" rx="20" fill="#fff7f2" stroke="#ee7441" stroke-width="2"/>
  <text class="f nodeTitle" x="1065" y="1333" text-anchor="middle">训练目标：Lflow = E ||vθ - v*||²；可再叠加 mask 区域加权</text>
  <text class="f body" x="1065" y="1362" text-anchor="middle">反向传播只写 LoRA A/B，VAE、CLIP、T5 与 FLUX 基座权重保持不变</text>
  <rect x="82" y="1412" width="1706" height="82" rx="20" fill="#fff" stroke="#d8dee8" stroke-width="2"/>
  <circle cx="120" cy="1453" r="14" fill="#ee7441"/><text class="f legend" x="146" y="1459">训练并发布新 checkpoint / adapter</text>
  <circle cx="570" cy="1453" r="14" fill="#aeb8c6"/><text class="f legend" x="596" y="1459">冻结预训练权重</text>
  <line x1="920" y1="1453" x2="980" y2="1453" stroke="#2f6df6" stroke-width="4" marker-end="url(#arrow)"/><text class="f legend" x="1000" y="1459">前向推理</text>
  <line x1="1280" y1="1453" x2="1340" y2="1453" stroke="#ee7441" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#gradArrow)"/><text class="f legend" x="1360" y="1459">梯度回传</text>
  <text class="f small" x="58" y="1572">结构来源：YOLOv7 官方 training YAML、FLUX / Diffusers 官方实现；项目特有类别、LoRA 数据与门禁来自 Sketch 数据工厂。</text>
</svg>
