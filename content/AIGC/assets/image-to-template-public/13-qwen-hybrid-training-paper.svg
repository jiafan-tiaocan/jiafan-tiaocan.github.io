<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1740" viewBox="0 0 2000 1740">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315f9a"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d85c35"/></marker>
    <style>
      .f{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.title{font-size:38px;font-weight:800;fill:#172033}.subtitle{font-size:19px;fill:#5c6778}.label{font-size:22px;font-weight:800;fill:#172033}.node{font-size:19px;font-weight:800;fill:#172033}.body{font-size:16px;fill:#4f5c70}.small{font-size:14px;fill:#69758a}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#324158}.white{font-size:18px;font-weight:800;fill:#fff}.whiteBody{font-size:15px;fill:#edf3ff}.eq{font-size:17px;font-weight:700;fill:#853516}.step{font-size:16px;font-weight:800;fill:#fff}.metric{font-size:16px;font-weight:800;fill:#26364d}
    </style>
  </defs>
  <rect width="2000" height="1740" fill="#fff"/>
  <text class="f title" x="60" y="64">Hybrid QwenVL for Editable-Template Parsing</text>
  <text class="f subtitle" x="60" y="98">小模型不再独立决定答案，而是把 OCR、Logo 与控件候选作为可被 Qwen2.5-VL 校正的侧信息；训练仅更新 LoRA</text>
  <line x1="60" y1="120" x2="1940" y2="120" stroke="#aeb8c6" stroke-width="2"/>

  <!-- (a) Inputs -->
  <text class="f label" x="60" y="166">(a) Multi-source evidence</text>
  <rect x="60" y="188" width="360" height="430" rx="18" fill="#f8fafc" stroke="#9aa7b8" stroke-width="2"/>
  <rect x="84" y="218" width="312" height="102" rx="14" fill="#eaf2fd" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="108" y="250">Primary image</text>
  <text class="f body" x="108" y="280">RGB card · native size 1200×628</text>
  <text class="f small" x="108" y="306">它是最终事实源，所有 Hint 都可被否决</text>
  <rect x="84" y="338" width="312" height="118" rx="14" fill="#f2f7f4" stroke="#2b8a64" stroke-width="2"/>
  <text class="f node" x="108" y="370">OCR evidence</text>
  <text class="f mono" x="108" y="400">text="探索深海" score=.997</text>
  <text class="f mono" x="108" y="426">bbox=[58,91,578,203]</text>
  <text class="f small" x="108" y="448">文字、行框、置信度；不是最终角色标签</text>
  <rect x="84" y="474" width="312" height="118" rx="14" fill="#fff7f0" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="108" y="506">Region priors</text>
  <text class="f mono" x="108" y="536">YOLO: Logo [38,28,218,84]</text>
  <text class="f mono" x="108" y="562">DINO: Control [802,506,...]</text>
  <text class="f small" x="108" y="584">来源、框和 score 全部保留</text>

  <!-- (b) evidence adapter -->
  <line x1="420" y1="404" x2="478" y2="404" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="f label" x="490" y="166">(b) Evidence adapter</text>
  <rect x="490" y="188" width="360" height="430" rx="18" fill="#fff" stroke="#315f9a" stroke-width="3"/>
  <text class="f node" x="516" y="228">Coordinate-aware serializer</text>
  <rect x="516" y="248" width="308" height="184" rx="12" fill="#f5f7fa" stroke="#c9d0da"/>
  <text class="f mono" x="538" y="278">&lt;image&gt;</text>
  <text class="f mono" x="538" y="306">&lt;ocr_hints&gt;</text>
  <text class="f mono" x="538" y="334">  [text,bbox,score]...</text>
  <text class="f mono" x="538" y="362">&lt;region_hints&gt;</text>
  <text class="f mono" x="538" y="390">  [source,role?,bbox,score]...</text>
  <text class="f mono" x="538" y="418">&lt;schema&gt;...&lt;/schema&gt;</text>
  <text class="f body" x="516" y="466">• 全部 BBox 统一到原图 xyxy</text>
  <text class="f body" x="516" y="496">• Hint 明示“可能错误，请核对图像”</text>
  <text class="f body" x="516" y="526">• 训练时 20% hint dropout</text>
  <text class="f body" x="516" y="556">• 随机框抖动 / OCR 字符扰动</text>
  <text class="f small" x="516" y="590">避免模型退化成小模型结果的复读器</text>

  <!-- (c) core -->
  <line x1="850" y1="404" x2="908" y2="404" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="f label" x="920" y="166">(c) Modified Qwen2.5-VL 7B</text>
  <rect x="920" y="188" width="590" height="430" rx="18" fill="#fbf9ff" stroke="#6952bd" stroke-width="3"/>
  <rect x="946" y="220" width="250" height="142" rx="14" fill="#edf3ff" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="1071" y="252" text-anchor="middle">Vision ViT · frozen</text>
  <text class="f body" x="970" y="282">32 blocks · hidden 1280</text>
  <text class="f body" x="970" y="310">28 window + 4 full attention</text>
  <text class="f body" x="970" y="338">Patch merger: 1280→3584</text>
  <rect x="1230" y="220" width="250" height="142" rx="14" fill="#f3f5f8" stroke="#9aa7b8" stroke-width="2"/>
  <text class="f node" x="1355" y="252" text-anchor="middle">Hint text tokens</text>
  <text class="f body" x="1254" y="282">OCR / Region / Schema</text>
  <text class="f body" x="1254" y="310">source + score + xyxy</text>
  <text class="f body" x="1254" y="338">与 Prompt 共用 tokenizer</text>
  <line x1="1071" y1="362" x2="1148" y2="410" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1355" y1="362" x2="1280" y2="410" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1000" y="420" width="430" height="154" rx="16" fill="#fff" stroke="#d85c35" stroke-width="3"/>
  <text class="f node" x="1215" y="452" text-anchor="middle">28-layer Decoder-only LLM</text>
  <text class="f body" x="1026" y="482">hidden 3584 · 28 Q heads / 4 KV heads</text>
  <text class="f body" x="1026" y="510">视觉 Token 与 Hint Token 联合因果 Attention</text>
  <rect x="1026" y="528" width="378" height="30" rx="12" fill="#fff0e8"/>
  <text class="f eq" x="1215" y="549" text-anchor="middle">trainable: rank-8 LoRA on LLM all-linear</text>
  <text class="f small" x="946" y="596">“魔改”发生在输入适配、LoRA 与奖励计算；Qwen Vision Backbone 本身不重写</text>

  <!-- (d) output -->
  <line x1="1510" y1="404" x2="1568" y2="404" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="f label" x="1580" y="166">(d) Structured output</text>
  <rect x="1580" y="188" width="360" height="430" rx="18" fill="#102a54" stroke="#102a54" stroke-width="2"/>
  <text class="f white" x="1608" y="228">Schema prediction</text>
  <text class="f whiteBody" x="1608" y="264">• role + stable element_id</text>
  <text class="f whiteBody" x="1608" y="294">• text + original-pixel xyxy</text>
  <text class="f whiteBody" x="1608" y="324">• relation / z-order draft</text>
  <rect x="1608" y="350" width="304" height="150" rx="12" fill="#183966" stroke="#6e94c4"/>
  <text class="f mono" x="1628" y="380" style="fill:#ffffff">{"id":"logo_0",</text>
  <text class="f mono" x="1628" y="408" style="fill:#ffffff"> "type":"Logo",</text>
  <text class="f mono" x="1628" y="436" style="fill:#ffffff"> "bbox":[38,28,218,84],</text>
  <text class="f mono" x="1628" y="464" style="fill:#ffffff"> "evidence":["image","yolo"]}</text>
  <text class="f whiteBody" x="1608" y="536">Schema gate → SAM2 / FLUX / Sketch</text>
  <text class="f whiteBody" x="1608" y="566">冲突、越界或证据不一致则重试</text>
  <text class="f small" x="1608" y="594" fill="#b8c9e4">Hint 是证据来源，不是不可覆盖 GT</text>

  <!-- training -->
  <line x1="60" y1="662" x2="1940" y2="662" stroke="#aeb8c6" stroke-width="2"/>
  <text class="f label" x="60" y="706">(e) LLaMAFactory-based SFT → custom GRPO</text>
  <rect x="60" y="732" width="1880" height="590" rx="20" fill="#fcfcfd" stroke="#9aa7b8" stroke-width="2"/>
  <rect x="88" y="766" width="286" height="510" rx="16" fill="#f4f6f9" stroke="#9aa7b8" stroke-width="2"/>
  <text class="f node" x="231" y="804" text-anchor="middle">LLaMAFactory control plane</text>
  <text class="f body" x="112" y="842">Multimodal dataset plugin</text>
  <text class="f body" x="112" y="874">Qwen chat template</text>
  <text class="f body" x="112" y="906">LoRA rank 8 · bf16</text>
  <text class="f body" x="112" y="938">max_length 8192</text>
  <text class="f body" x="112" y="970">DeepSpeed ZeRO-3</text>
  <line x1="112" y1="994" x2="350" y2="994" stroke="#c7ced8"/>
  <text class="f body" x="112" y="1028">stage 1: SFT launcher</text>
  <text class="f body" x="112" y="1060">stage 2: GRPO policy init</text>
  <text class="f body" x="112" y="1092">custom CoordIoUORM</text>
  <text class="f small" x="112" y="1134">统一处理 checkpoint、</text>
  <text class="f small" x="112" y="1160">dataset、template 与 resume</text>
  <text class="f small" x="112" y="1216">RL 奖励为项目自定义插件，</text>
  <text class="f small" x="112" y="1242">不是把坐标当普通文本指标</text>

  <line x1="374" y1="1008" x2="432" y2="1008" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="448" y="786" width="370" height="444" rx="16" fill="#edf3ff" stroke="#315f9a" stroke-width="3"/>
  <rect x="474" y="812" width="96" height="34" rx="17" fill="#315f9a"/><text class="f step" x="522" y="835" text-anchor="middle">Stage 1</text>
  <text class="f node" x="474" y="878">SFT: learn task protocol</text>
  <text class="f body" x="474" y="916">Input: image + hints + prompt</text>
  <text class="f body" x="474" y="948">Target: canonical JSON / answer</text>
  <text class="f body" x="474" y="980">Teacher forcing; answer-only labels</text>
  <rect x="474" y="1012" width="318" height="64" rx="12" fill="#fff" stroke="#9db7d6"/>
  <text class="f eq" x="633" y="1052" text-anchor="middle">L_SFT = -Σ log pθ(y_t | I,h,q,y_&lt;t)</text>
  <text class="f body" x="474" y="1110">主要提升：</text>
  <text class="f body" x="494" y="1140">• Schema 解析率与角色稳定性</text>
  <text class="f body" x="494" y="1170">• OCR 文本与图像区域对齐</text>
  <text class="f small" x="474" y="1204">输出 SFT LoRA，作为 RL policy 初始值</text>

  <line x1="818" y1="1008" x2="876" y2="1008" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="892" y="786" width="570" height="444" rx="16" fill="#fff7f0" stroke="#d85c35" stroke-width="3"/>
  <rect x="918" y="812" width="96" height="34" rx="17" fill="#d85c35"/><text class="f step" x="966" y="835" text-anchor="middle">Stage 2</text>
  <text class="f node" x="918" y="878">GRPO: make small elements visible</text>
  <text class="f body" x="918" y="912">每张图采样 G 个答案 → parse / role / bounds gate</text>
  <text class="f body" x="918" y="944">面积自适应 + 类别先验：</text>
  <rect x="918" y="966" width="518" height="74" rx="12" fill="#fff" stroke="#e5a187"/>
  <text class="f eq" x="1177" y="996" text-anchor="middle">w_i = c_type · clip((medianArea/(area_i+ε))^0.5, 0.5, 4)</text>
  <text class="f eq" x="1177" y="1026" text-anchor="middle">q_i = 0.7·IoU_i + 0.3·exp(-normalized L1_i)</text>
  <text class="f body" x="918" y="1072">最终几何奖励：</text>
  <rect x="918" y="1090" width="518" height="70" rx="12" fill="#fff" stroke="#e5a187"/>
  <text class="f eq" x="1177" y="1118" text-anchor="middle">R_geo = .65·weightedMean(q) + .20·roleMacro(q)</text>
  <text class="f eq" x="1177" y="1146" text-anchor="middle">+ .15·bottom20%(q)</text>
  <text class="f small" x="918" y="1192">Logo / Control / 小字 c_type 更高；Background / MainVisual 更低</text>
  <text class="f small" x="918" y="1216">bottom-20% 项保证一个小元素彻底失败时，大奖励不会被大框掩盖</text>

  <line x1="1462" y1="1008" x2="1520" y2="1008" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1536" y="786" width="376" height="444" rx="16" fill="#f8f6ff" stroke="#6952bd" stroke-width="3"/>
  <text class="f node" x="1724" y="830" text-anchor="middle">Policy update &amp; gates</text>
  <text class="f body" x="1562" y="870">Group-normalized advantage</text>
  <text class="f body" x="1562" y="902">KL constraint to reference policy</text>
  <text class="f body" x="1562" y="934">Backprop only to LoRA A/B</text>
  <text class="f body" x="1562" y="966">Rollout GPU / Trainer GPU isolated</text>
  <line x1="1562" y1="994" x2="1886" y2="994" stroke="#c7ced8"/>
  <text class="f body" x="1562" y="1030">Offline gates</text>
  <text class="f body" x="1584" y="1060">• Schema pass</text>
  <text class="f body" x="1584" y="1090">• small-element recall</text>
  <text class="f body" x="1584" y="1120">• role-macro IoU</text>
  <text class="f body" x="1584" y="1150">• edit-action success</text>
  <text class="f small" x="1562" y="1190">奖励提高不自动发布：</text>
  <text class="f small" x="1562" y="1216">必须通过未见版式与编辑器回放</text>

  <!-- ablation -->
  <text class="f label" x="60" y="1372">(f) Reconstructed ablation path</text>
  <text class="f small" x="420" y="1372">按最终 82% / 89% 复盘口径校准的工程复原，非遗失实验日志</text>
  <line x1="118" y1="1484" x2="1870" y2="1484" stroke="#b9c2ce" stroke-width="5"/>
  <circle cx="150" cy="1484" r="28" fill="#6f7c8d"/><text class="f step" x="150" y="1490" text-anchor="middle">82</text>
  <text class="f metric" x="150" y="1540" text-anchor="middle">路线 A</text><text class="f small" x="150" y="1566" text-anchor="middle">工作流基线</text>
  <circle cx="470" cy="1484" r="28" fill="#8692a1"/><text class="f step" x="470" y="1490" text-anchor="middle">72</text>
  <text class="f metric" x="470" y="1540" text-anchor="middle">Image-only</text><text class="f small" x="470" y="1566" text-anchor="middle">Zero-shot</text>
  <circle cx="790" cy="1484" r="28" fill="#315f9a"/><text class="f step" x="790" y="1490" text-anchor="middle">82</text>
  <text class="f metric" x="790" y="1540" text-anchor="middle">+ SFT</text><text class="f small" x="790" y="1566" text-anchor="middle">稳定 Schema</text>
  <circle cx="1110" cy="1484" r="28" fill="#2b8a64"/><text class="f step" x="1110" y="1490" text-anchor="middle">85</text>
  <text class="f metric" x="1110" y="1540" text-anchor="middle">+ OCR hints</text><text class="f small" x="1110" y="1566" text-anchor="middle">小字与数字</text>
  <circle cx="1390" cy="1484" r="28" fill="#c37c35"/><text class="f step" x="1390" y="1490" text-anchor="middle">86</text>
  <text class="f metric" x="1390" y="1540" text-anchor="middle">+ Region priors</text><text class="f small" x="1390" y="1566" text-anchor="middle">Logo / Control</text>
  <circle cx="1630" cy="1484" r="28" fill="#d85c35"/><text class="f step" x="1630" y="1490" text-anchor="middle">88</text>
  <text class="f metric" x="1630" y="1540" text-anchor="middle">+ weighted GRPO</text><text class="f small" x="1630" y="1566" text-anchor="middle">小元素可见</text>
  <circle cx="1870" cy="1484" r="32" fill="#6952bd"/><text class="f step" x="1870" y="1490" text-anchor="middle">89</text>
  <text class="f metric" x="1870" y="1540" text-anchor="middle">+ tool gates</text><text class="f small" x="1870" y="1566" text-anchor="middle">最终方案</text>
  <path d="M178 1460L442 1460" stroke="#8692a1" stroke-width="3" marker-end="url(#arrow)"/><path d="M498 1460L762 1460" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M818 1460L1082 1460" stroke="#2b8a64" stroke-width="3" marker-end="url(#arrow)"/><path d="M1138 1460L1362 1460" stroke="#c37c35" stroke-width="3" marker-end="url(#arrow)"/><path d="M1418 1460L1602 1460" stroke="#d85c35" stroke-width="3" marker-end="url(#orange)"/><path d="M1658 1460L1838 1460" stroke="#6952bd" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="1610" width="1880" height="82" rx="14" fill="#f5f7fa" stroke="#c8d0db"/>
  <text class="f body" x="86" y="1642">关键结论：OCR / 小模型输出仍然保留，但责任从“最终裁决者”变成“带来源和置信度的证据”；QwenVL 负责跨证据校正，工具链负责像素执行。</text>
  <text class="f small" x="86" y="1672">网络配置依据 Qwen2.5-VL 官方 config；LLaMAFactory、SFT/GRPO 参数与混合输入来自项目复盘；消融数字为透明标注的复原口径。</text>
  <text class="f small" x="60" y="1720">Figure style: flat paper diagram; solid arrows are forward data flow, orange-bordered modules contain trainable parameters or project-specific optimization.</text>
</svg>
