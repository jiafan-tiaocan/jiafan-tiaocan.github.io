<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1320" viewBox="0 0 1880 1320">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315f9a"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d85c35"/></marker>
    <style>
      .f{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif}.title{font-size:36px;font-weight:800;fill:#172033}.sub{font-size:18px;fill:#5c6778}.label{font-size:21px;font-weight:800;fill:#172033}.node{font-size:18px;font-weight:800;fill:#172033}.body{font-size:15px;fill:#4f5c70}.small{font-size:13px;fill:#6b778c}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#31415b}.metric{font-size:38px;font-weight:800;fill:#163a70}.metricSub{font-size:15px;font-weight:700;fill:#33445e}.white{font-size:18px;font-weight:800;fill:#fff}.whiteBody{font-size:15px;fill:#eaf1ff}.chip{font-size:14px;font-weight:700;fill:#30415d}.eq{font-size:16px;font-weight:700;fill:#8a3d1d}
    </style>
  </defs>
  <rect width="1880" height="1320" fill="#fff"/>
  <text class="f title" x="52" y="58">Logo Slot 专项检测：封闭集 YOLOv7</text>
  <text class="f sub" x="52" y="91">可枚举 Logo 资产族 + Sketch 自动产标 + 单类专项检测：用域内近乎满召回换取持续增量训练</text>
  <line x1="52" y1="112" x2="1828" y2="112" stroke="#aeb8c6" stroke-width="2"/>

  <!-- a: data factory -->
  <text class="f label" x="52" y="150">(a) 封闭集数据工厂</text>
  <rect x="52" y="172" width="500" height="398" rx="18" fill="#f8fafc" stroke="#9aa7b8" stroke-width="2"/>
  <text class="f node" x="78" y="208">可枚举的 Logo 资产族</text>
  <rect x="78" y="228" width="116" height="64" rx="10" fill="#eaf2fd" stroke="#315f9a"/>
  <circle cx="105" cy="260" r="15" fill="#315f9a"/>
  <text class="f chip" x="129" y="265">ORBIT</text>
  <rect x="208" y="228" width="116" height="64" rx="10" fill="#fff3eb" stroke="#d85c35"/>
  <path d="M228 274 L248 244 L268 274Z" fill="#d85c35"/>
  <text class="f chip" x="274" y="265">KITE</text>
  <rect x="338" y="228" width="116" height="64" rx="10" fill="#edf7f2" stroke="#2b8a64"/>
  <rect x="355" y="244" width="28" height="28" rx="7" fill="#2b8a64"/>
  <text class="f chip" x="389" y="265">NOVA</text>
  <text class="f small" x="78" y="316">L = {外观族_1, ..., 外观族_k}；在线检测仍保持单类：logo_region</text>

  <line x1="300" y1="330" x2="300" y2="364" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="78" y="378" width="196" height="132" rx="14" fill="#fff" stroke="#6d8fbd" stroke-width="2"/>
  <text class="f node" x="176" y="410" text-anchor="middle">Sketch 人工模版</text>
  <rect x="98" y="428" width="156" height="60" rx="8" fill="#dce9f8"/>
  <rect x="112" y="440" width="57" height="19" rx="3" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <rect x="112" y="466" width="82" height="6" rx="3" fill="#7894ba"/>
  <circle cx="226" cy="458" r="22" fill="#5f84b5" opacity=".75"/>
  <text class="f small" x="176" y="532" text-anchor="middle">设计师 Slot frame 即真值</text>
  <line x1="274" y1="444" x2="316" y2="444" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="378" width="196" height="132" rx="14" fill="#fff" stroke="#6d8fbd" stroke-width="2"/>
  <text class="f node" x="428" y="410" text-anchor="middle">自动渲染训练对</text>
  <text class="f mono" x="352" y="442">RGB [3,960,960]</text>
  <text class="f mono" x="352" y="470">y=[0,cx,cy,w,h]</text>
  <text class="f small" x="428" y="500" text-anchor="middle">资产 × Slot × 版式 × 颜色</text>
  <text class="f small" x="78" y="552">先按模版族和 Logo 资产族切分，再做数据增强，防止同源样本泄漏。</text>

  <!-- b: network -->
  <text class="f label" x="590" y="150">(b) 开源 YOLOv7 骨架 + 项目单类训练配置</text>
  <rect x="590" y="172" width="716" height="398" rx="18" fill="#fbfcff" stroke="#315f9a" stroke-width="2"/>
  <text class="f small" x="667" y="194" text-anchor="middle" fill="#b54b2d">项目配置</text>
  <text class="f small" x="1019" y="194" text-anchor="middle">直接复用的官方骨架（不属于项目魔改）</text>
  <rect x="616" y="216" width="102" height="74" rx="12" fill="#fff3eb" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="667" y="246" text-anchor="middle">输入</text>
  <text class="f small" x="667" y="272" text-anchor="middle">960 × 960</text>
  <line x1="718" y1="253" x2="746" y2="253" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="758" y="204" width="150" height="98" rx="12" fill="#edf3ff" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="833" y="236" text-anchor="middle">E-ELAN</text>
  <text class="f small" x="833" y="262" text-anchor="middle">主干：多路提取特征</text>
  <text class="f small" x="833" y="284" text-anchor="middle">保留浅层边缘 + 深层形状</text>
  <line x1="908" y1="253" x2="936" y2="253" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="948" y="204" width="150" height="98" rx="12" fill="#f3f0ff" stroke="#6952bd" stroke-width="2"/>
  <text class="f node" x="1023" y="236" text-anchor="middle">SPPCSPC</text>
  <text class="f small" x="1023" y="262" text-anchor="middle">5 / 9 / 13 池化视野</text>
  <text class="f small" x="1023" y="284" text-anchor="middle">汇总局部与全局上下文</text>
  <line x1="1098" y1="253" x2="1126" y2="253" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1138" y="204" width="142" height="98" rx="12" fill="#edf7f2" stroke="#2b8a64" stroke-width="2"/>
  <text class="f node" x="1209" y="236" text-anchor="middle">PAN / FPN</text>
  <text class="f small" x="1209" y="262" text-anchor="middle">颈部：上下双向融合</text>
  <text class="f small" x="1209" y="284" text-anchor="middle">输出 P3 / P4 / P5</text>

  <text class="f small" x="616" y="326" fill="#b54b2d">项目训练配置：单类任务；检测头结构仍来自官方实现</text>
  <rect x="616" y="334" width="664" height="102" rx="14" fill="#fff8f2" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="638" y="365">官方 RepConv + IDetect；项目将 nc 配置为 1</text>
  <text class="f mono" x="638" y="394">P3 [B,18,120,120]   P4 [B,18,60,60]   P5 [B,18,30,30]</text>
  <text class="f small" x="638" y="420">3 Anchors ×（x, y, w, h, objectness, logo_region）；P3 保留小 Logo 细节</text>
  <path d="M1210 462 H680" fill="none" stroke="#d85c35" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#orangeArrow)"/>
  <text class="f eq" x="945" y="490" text-anchor="middle">L = λbox LCIoU + λobj LBCE-obj + λcls LBCE-cls</text>
  <text class="f small" x="945" y="516" text-anchor="middle">全量更新网络；保留轻度缩放 / 色彩 / JPEG 增强；主动降低强 Mosaic 比例</text>
  <rect x="616" y="530" width="122" height="26" rx="10" fill="#edf7f2"/><text class="f small" x="677" y="548" text-anchor="middle">困难负样本</text>
  <rect x="748" y="530" width="122" height="26" rx="10" fill="#edf7f2"/><text class="f small" x="809" y="548" text-anchor="middle">nc=1 单类 Head</text>
  <rect x="880" y="530" width="128" height="26" rx="10" fill="#edf7f2"/><text class="f small" x="944" y="548" text-anchor="middle">按资产族切分</text>
  <rect x="1018" y="530" width="134" height="26" rx="10" fill="#fff1e9"/><text class="f small" x="1085" y="548" text-anchor="middle">有意域内过拟合</text>

  <!-- c: output -->
  <text class="f label" x="1342" y="150">(c) 检测结果 → 可编辑 Logo Slot</text>
  <rect x="1342" y="172" width="486" height="398" rx="18" fill="#f8fafc" stroke="#9aa7b8" stroke-width="2"/>
  <rect x="1368" y="206" width="204" height="126" rx="12" fill="#dce9f8"/>
  <rect x="1390" y="226" width="79" height="28" rx="4" fill="#fff" stroke="#d85c35" stroke-width="3"/>
  <circle cx="1409" cy="240" r="8" fill="#315f9a"/>
  <text class="f small" x="1424" y="245">ORBIT</text>
  <rect x="1390" y="276" width="104" height="8" rx="4" fill="#7894ba"/>
  <circle cx="1528" cy="275" r="28" fill="#5f84b5" opacity=".72"/>
  <text class="f small" x="1470" y="352" text-anchor="middle">BBox + 安全边距</text>
  <line x1="1572" y1="269" x2="1612" y2="269" stroke="#315f9a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1626" y="206" width="176" height="126" rx="12" fill="#fff" stroke="#315f9a" stroke-width="2"/>
  <text class="f node" x="1714" y="236" text-anchor="middle">可替换 Logo Slot</text>
  <text class="f mono" x="1644" y="264">xyxy + score</text>
  <text class="f mono" x="1644" y="288">mode = contain</text>
  <text class="f mono" x="1644" y="312">anchor = center</text>
  <rect x="1368" y="382" width="434" height="146" rx="14" fill="#102a54"/>
  <text class="f white" x="1392" y="416">为什么整块保留？</text>
  <text class="f whiteBody" x="1392" y="450">1. 保护小字、描边和阴影不被切坏</text>
  <text class="f whiteBody" x="1392" y="480">2. 默认图块可以完整复现原卡片</text>
  <text class="f whiteBody" x="1392" y="510">3. 隐藏 / 替换时触发原区域背景恢复</text>

  <!-- d: metrics -->
  <line x1="52" y1="606" x2="1828" y2="606" stroke="#aeb8c6" stroke-width="2"/>
  <text class="f label" x="52" y="646">(d) 技术指标 → 几何门禁 → 编辑器良品率</text>
  <rect x="52" y="672" width="1776" height="218" rx="18" fill="#fbfcfe" stroke="#9aa7b8" stroke-width="2"/>
  <rect x="78" y="700" width="540" height="156" rx="14" fill="#edf3ff" stroke="#6d8fbd"/>
  <text class="f metric" x="348" y="755" text-anchor="middle">≈ 100%</text>
  <text class="f metricSub" x="348" y="790" text-anchor="middle">已知 Logo Recall @ IoU ≥ 0.5</text>
  <text class="f small" x="348" y="822" text-anchor="middle">检测门禁 · 找全资产库覆盖的 Logo Slot</text>
  <rect x="650" y="700" width="540" height="156" rx="14" fill="#edf7f2" stroke="#52a984"/>
  <text class="f metric" x="920" y="755" text-anchor="middle">≈ 100%</text>
  <text class="f metricSub" x="920" y="790" text-anchor="middle">完整覆盖 / 不切字率</text>
  <text class="f small" x="920" y="822" text-anchor="middle">几何门禁 · BBox 完整容纳字形、描边与阴影</text>
  <rect x="1222" y="700" width="580" height="156" rx="14" fill="#fff3eb" stroke="#d98a61"/>
  <text class="f metric" x="1512" y="755" text-anchor="middle">≈ 100%</text>
  <text class="f metricSub" x="1512" y="790" text-anchor="middle">替换 / 隐藏 / 缩放良品率</text>
  <text class="f small" x="1512" y="822" text-anchor="middle">编辑器回放 · 最终模版没有可见缺陷</text>

  <!-- e: maintenance -->
  <text class="f label" x="52" y="936">(e) 隐性成本：每新增一个 Logo，都要新增一次训练发布</text>
  <rect x="52" y="960" width="1776" height="292" rx="18" fill="#fff9f5" stroke="#d9a184" stroke-width="2"/>
  <rect x="82" y="1008" width="210" height="118" rx="14" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="187" y="1040" text-anchor="middle">新增 Logo 资产</text>
  <path d="M126 1096 L153 1054 L180 1096Z" fill="#d85c35"/>
  <text class="f chip" x="196" y="1082">新字标</text>
  <line x1="292" y1="1067" x2="352" y2="1067" stroke="#d85c35" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <rect x="368" y="1008" width="250" height="118" rx="14" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="493" y="1040" text-anchor="middle">覆盖门禁：未见资产族</text>
  <text class="f body" x="392" y="1072">进入训练集之前</text>
  <text class="f body" x="392" y="1098">不承诺检测准确率</text>
  <line x1="618" y1="1067" x2="678" y2="1067" stroke="#d85c35" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <rect x="694" y="1008" width="250" height="118" rx="14" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="819" y="1040" text-anchor="middle">生成监督变体</text>
  <text class="f body" x="718" y="1072">Slot / 版式 / 颜色 / 尺寸</text>
  <text class="f body" x="718" y="1098">+ 困难负样本回归集</text>
  <line x1="944" y1="1067" x2="1004" y2="1067" stroke="#d85c35" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <rect x="1020" y="1008" width="250" height="118" rx="14" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="1145" y="1040" text-anchor="middle">增量微调</text>
  <text class="f body" x="1044" y="1072">从 Checkpoint v_k 启动</text>
  <text class="f body" x="1044" y="1098">更新完整 YOLOv7</text>
  <line x1="1270" y1="1067" x2="1330" y2="1067" stroke="#d85c35" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <rect x="1346" y="1008" width="250" height="118" rx="14" fill="#fff" stroke="#d85c35" stroke-width="2"/>
  <text class="f node" x="1471" y="1040" text-anchor="middle">新旧 Logo 全量回归</text>
  <text class="f body" x="1370" y="1072">检测门禁 + 编辑器回放</text>
  <text class="f body" x="1370" y="1098">拒绝遗忘、切字和框漂移</text>
  <line x1="1596" y1="1067" x2="1640" y2="1067" stroke="#315f9a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1656" y="1008" width="146" height="118" rx="14" fill="#102a54"/>
  <text class="f white" x="1729" y="1046" text-anchor="middle">发布</text>
  <text class="f whiteBody" x="1729" y="1078" text-anchor="middle">Checkpoint</text>
  <text class="f whiteBody" x="1729" y="1104" text-anchor="middle">v_k+1</text>
  <path d="M1729 1126 V1188 H187 V1142" fill="none" stroke="#315f9a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <rect x="82" y="1172" width="1720" height="54" rx="12" fill="#fff" stroke="#e4c0ac"/>
  <text class="f node" x="942" y="1205" text-anchor="middle">取舍：可枚举域内接近确定性的质量 ↔ 持续的数据、GPU、回归与发布成本</text>
  <text class="f small" x="52" y="1288">边界：蓝 / 绿色网络模块为开源 YOLOv7；数据工厂、960 输入、nc=1、封闭域训练、Slot 适配与发布闭环为项目工作。图中 Logo 和卡片均为合成示例。</text>
</svg>
