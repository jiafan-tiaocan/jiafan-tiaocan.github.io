<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">Qwen 视觉语言模型从跨模态适配器到原生多模态智能体的因果演进</title>
  <desc id="desc">五个阶段依次展示 Qwen-VL、Qwen2-VL、Qwen2.5-VL、Qwen3-VL 与 Qwen3.5/3.6 如何解决固定分辨率、时空位置、视觉计算、深层融合和统一模型效率问题，底部总结稳定的生产责任。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#12162c"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: url(#bg); }
      .ink { fill: #172033; }
      .muted { fill: #526078; }
      .card { fill: #ffffff; stroke: #d7deeb; stroke-width: 1.5; }
      .rule { stroke: #d7deeb; stroke-width: 1.3; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .edge-label { fill: #475569; font-size: 17px; font-weight: 650; }
      .phase { font-size: 27px; font-weight: 760; letter-spacing: -.3px; }
      .date { font-size: 17px; font-weight: 700; }
      .tagline { font-size: 18px; font-weight: 650; }
      .label { font-size: 15px; font-weight: 760; letter-spacing: .9px; }
      .body { font-size: 17px; font-weight: 520; }
      .title { font-size: 32px; font-weight: 780; letter-spacing: -.5px; }
      .subtitle { font-size: 18px; font-weight: 520; }
      .converge-title { font-size: 20px; font-weight: 760; }
      .converge-body { font-size: 16px; font-weight: 560; }
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: url(#darkBg); }
        .ink { fill: #ecf3ff; }
        .muted { fill: #aebbd0; }
        .card { fill: #111c2d; stroke: #2f405a; }
        .rule { stroke: #31425d; }
        .connector { stroke: #8da0ba; }
        .edge-label { fill: #c0ccdd; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="1020" rx="30"/>
  <text class="ink title" x="72" y="62">Qwen 视觉语言主线：每一代都在移动“视觉进入语言模型”的边界</text>
  <text class="muted subtitle" x="72" y="94">不是型号堆叠，而是表示、位置、融合深度与系统责任的连续重写</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect class="card" x="70" y="130" width="390" height="300" rx="22"/>
  </g>
  <rect x="70" y="130" width="12" height="300" rx="6" fill="#4f46e5"/>
  <text class="date" x="104" y="166" fill="#4f46e5">2023</text>
  <text class="ink phase" x="104" y="202">Qwen-VL</text>
  <text class="ink tagline" x="104" y="232">先把视觉接入 Qwen-7B</text>
  <line class="rule" x1="104" y1="250" x2="428" y2="250"/>
  <text class="label" x="104" y="281" fill="#4f46e5">表示</text>
  <text class="ink body" x="170" y="281">固定 448² → 256 个视觉 Token</text>
  <text class="label" x="104" y="316" fill="#4f46e5">桥梁</text>
  <text class="ink body" x="170" y="316">Cross-Attention Resampler</text>
  <text class="label" x="104" y="351" fill="#4f46e5">解决</text>
  <text class="ink body" x="170" y="351">中英 OCR、Grounding、多图对话</text>
  <text class="label" x="104" y="386" fill="#4f46e5">留下</text>
  <text class="ink body" x="170" y="386">细节被缩放；视频与长宽比受限</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect class="card" x="525" y="130" width="390" height="300" rx="22"/>
  </g>
  <rect x="525" y="130" width="12" height="300" rx="6" fill="#0284c7"/>
  <text class="date" x="559" y="166" fill="#0284c7">2024</text>
  <text class="ink phase" x="559" y="202">Qwen2-VL</text>
  <text class="ink tagline" x="559" y="232">让分辨率与时空坐标进入 Token</text>
  <line class="rule" x1="559" y1="250" x2="883" y2="250"/>
  <text class="label" x="559" y="281" fill="#0284c7">表示</text>
  <text class="ink body" x="625" y="281">动态分辨率 + 2×2 Patch Merge</text>
  <text class="label" x="559" y="316" fill="#0284c7">位置</text>
  <text class="ink body" x="625" y="316">M-RoPE：时间 / 高 / 宽三轴</text>
  <text class="label" x="559" y="351" fill="#0284c7">解决</text>
  <text class="ink body" x="625" y="351">任意长宽比；图像与视频统一</text>
  <text class="label" x="559" y="386" fill="#0284c7">留下</text>
  <text class="ink body" x="625" y="386">视觉计算仍昂贵；帧号不等于时间</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect class="card" x="980" y="130" width="390" height="300" rx="22"/>
  </g>
  <rect x="980" y="130" width="12" height="300" rx="6" fill="#0f9f75"/>
  <text class="date" x="1014" y="166" fill="#0f9f75">2025 · 01</text>
  <text class="ink phase" x="1014" y="202">Qwen2.5-VL</text>
  <text class="ink tagline" x="1014" y="232">把效率、绝对时间与可执行输出补齐</text>
  <line class="rule" x1="1014" y1="250" x2="1338" y2="250"/>
  <text class="label" x="1014" y="281" fill="#0f9f75">计算</text>
  <text class="ink body" x="1080" y="281">Window Attention + 4 层全局注意力</text>
  <text class="label" x="1014" y="316" fill="#0f9f75">时间</text>
  <text class="ink body" x="1080" y="316">动态 FPS + 绝对时间 MRoPE</text>
  <text class="label" x="1014" y="351" fill="#0f9f75">解决</text>
  <text class="ink body" x="1080" y="351">BBox / Point / JSON / 长视频定位</text>
  <text class="label" x="1014" y="386" fill="#0f9f75">留下</text>
  <text class="ink body" x="1080" y="386">长视频稀疏位置；深层视觉信息损失</text>

  <path class="connector" d="M460 280 L515 280"/>
  <text class="edge-label" x="476" y="260">固定 → 动态</text>
  <path class="connector" d="M915 280 L970 280"/>
  <text class="edge-label" x="928" y="260">能看 → 可用</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect class="card" x="250" y="505" width="445" height="290" rx="22"/>
  </g>
  <rect x="250" y="505" width="12" height="290" rx="6" fill="#d97706"/>
  <text class="date" x="284" y="541" fill="#d97706">2025 · 09—11</text>
  <text class="ink phase" x="284" y="577">Qwen3-VL</text>
  <text class="ink tagline" x="284" y="607">让视觉在多个 LLM 深度持续注入</text>
  <line class="rule" x1="284" y1="625" x2="663" y2="625"/>
  <text class="label" x="284" y="656" fill="#d97706">融合</text>
  <text class="ink body" x="350" y="656">SigLIP-2 + DeepStack 多层残差注入</text>
  <text class="label" x="284" y="691" fill="#d97706">时空</text>
  <text class="ink body" x="350" y="691">Interleaved-MRoPE + 文本时间戳</text>
  <text class="label" x="284" y="726" fill="#d97706">规模</text>
  <text class="ink body" x="350" y="726">256K；Dense / MoE；Thinking 分支</text>
  <text class="label" x="284" y="761" fill="#d97706">留下</text>
  <text class="ink body" x="350" y="761">“VL 专用模型”仍与通用基座分家</text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect class="card" x="745" y="505" width="445" height="290" rx="22"/>
  </g>
  <rect x="745" y="505" width="12" height="290" rx="6" fill="#db2777"/>
  <text class="date" x="779" y="541" fill="#db2777">2026 · 02—04</text>
  <text class="ink phase" x="779" y="577">Qwen3.5 / 3.6</text>
  <text class="ink tagline" x="779" y="607">VL 后缀消失：多模态成为默认基座</text>
  <line class="rule" x1="779" y1="625" x2="1158" y2="625"/>
  <text class="label" x="779" y="656" fill="#db2777">训练</text>
  <text class="ink body" x="845" y="656">万亿级多模态 Token 的 Early Fusion</text>
  <text class="label" x="779" y="691" fill="#db2777">效率</text>
  <text class="ink body" x="845" y="691">3× Gated DeltaNet + 1× Full Attention</text>
  <text class="label" x="779" y="726" fill="#db2777">系统</text>
  <text class="ink body" x="845" y="726">Sparse MoE + 大规模 Agent RL</text>
  <text class="label" x="779" y="761" fill="#db2777">边界</text>
  <text class="ink body" x="845" y="761">官方博客 / 源码证据，非同粒度论文</text>

  <path class="connector" d="M1175 430 C1175 468 1010 470 1010 495"/>
  <text class="edge-label" x="1040" y="470">单点融合 → 深层融合</text>
  <path class="connector" d="M695 650 L735 650"/>
  <text class="edge-label" x="700" y="628">专用 → 原生</text>

  <!-- Convergence layer -->
  <rect x="70" y="850" width="1300" height="112" rx="22" fill="#172033" opacity=".96"/>
  <text x="100" y="886" fill="#ffffff" class="converge-title">收敛后的稳定责任</text>
  <line x1="318" y1="870" x2="318" y2="944" stroke="#53627a" stroke-width="1.5"/>
  <text x="346" y="884" fill="#8ec5ff" class="converge-title">视觉 Token 化</text>
  <text x="346" y="916" fill="#dce7f6" class="converge-body">按像素 / 帧预算保留细节</text>
  <text x="346" y="940" fill="#9fb0c6" class="converge-body">Vision Encoder + Merger</text>
  <line x1="596" y1="870" x2="596" y2="944" stroke="#53627a" stroke-width="1.5"/>
  <text x="624" y="884" fill="#9be8c8" class="converge-title">统一位置与序列</text>
  <text x="624" y="916" fill="#dce7f6" class="converge-body">空间、时间、文本同一上下文</text>
  <text x="624" y="940" fill="#9fb0c6" class="converge-body">MRoPE / Timestamp</text>
  <line x1="874" y1="870" x2="874" y2="944" stroke="#53627a" stroke-width="1.5"/>
  <text x="902" y="884" fill="#ffd58a" class="converge-title">生成与推理</text>
  <text x="902" y="916" fill="#dce7f6" class="converge-body">仍以自回归文本 Token 为核心</text>
  <text x="902" y="940" fill="#9fb0c6" class="converge-body">LLM / MoE / Hybrid Attention</text>
  <line x1="1152" y1="870" x2="1152" y2="944" stroke="#53627a" stroke-width="1.5"/>
  <text x="1180" y="884" fill="#f5a6d4" class="converge-title">生产闭环</text>
  <text x="1180" y="916" fill="#dce7f6" class="converge-body">Schema、工具、评测与回退</text>
  <text x="1180" y="940" fill="#9fb0c6" class="converge-body">Agent / Trust Gate</text>
  <text class="muted" x="70" y="994" font-size="15">论文事实截至 Qwen3-VL；Qwen3.5/3.6 依据 2026-07-30 核验的官方博客、仓库与固定源码版本。本文归纳。</text>
</svg>
