  <line x1="1368" y1="1008" x2="1414" y2="1008" stroke="#67e8f9" stroke-width="4"/>
  <text x="1424" y="1014" class="legend">前代公开</text>
  <line x1="1368" y1="1045" x2="1414" y2="1045" stroke="#fbbf24" stroke-width="4" stroke-dasharray="9 7"/>
