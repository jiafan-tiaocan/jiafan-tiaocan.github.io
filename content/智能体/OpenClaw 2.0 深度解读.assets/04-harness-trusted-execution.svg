<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="180mm" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Harness 的可信执行链</title>
  <desc id="desc">从运行接纳、原子快照、跨回退集选择 Harness、私有能力投影、执行、副作用闸门，到干净终态和持久提交的完整流程，并展示失败关闭路径。</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.node{fill:#fff;stroke:#8ca0b7;stroke-width:.65}.strong{fill:#e7f1fc;stroke:#2f6fb5;stroke-width:.85}.commit{fill:#e7f5ed;stroke:#3d9266;stroke-width:.85}.gate{fill:#fff1e6;stroke:#d96b24;stroke-width:.85}.fail{fill:#f9e9ea;stroke:#c45b62;stroke-width:.7}.ink{fill:#142238}.muted{fill:#65758a}.blue{fill:#2f6fb5}.red{fill:#ad3e47}.green{fill:#2f8157}.line{stroke:#2f6fb5;stroke-width:1;fill:none}.fail-line{stroke:#c45b62;stroke-width:.8;stroke-dasharray:2.5 2;fill:none}.t{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h1{font-size:10px;font-weight:700}.h2{font-size:6px;font-weight:700}.step{font-size:4.25px;font-weight:700}.failh{font-size:4.6px;font-weight:700}.body{font-size:4.4px}.small{font-size:3.8px}.micro{font-size:3.3px}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2f6fb5"/></marker>
    <marker id="fail-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#c45b62"/></marker>
  </defs>
  <rect class="bg" width="320" height="180"/>
  <text class="t h1 ink" x="17" y="17">Harness 的亮点：把一次 Agent 执行变成可证明、可关闭的事务</text>
  <text class="t body muted" x="17" y="26">关键不是“兼容更多模型”，而是跨插件、重试和副作用之后仍保持一个事实世界</text>
  <g id="main-pipeline">
    <rect class="strong" x="16" y="58" width="40" height="35" rx="4"/>
    <text class="t step ink" x="36" y="69" text-anchor="middle">1｜RUN ADMISSION</text>
    <text class="t small muted" x="36" y="77" text-anchor="middle">会话 / 身份 / 放置</text>
    <text class="t small muted" x="36" y="84" text-anchor="middle">原子 Generation 快照</text>
    <rect class="strong" x="66" y="58" width="47" height="35" rx="4"/>
    <text class="t step ink" x="89.5" y="69" text-anchor="middle">2｜HARNESS SELECT</text>
    <text class="t small muted" x="89.5" y="77" text-anchor="middle">覆盖整个 fallback 集</text>
    <text class="t small muted" x="89.5" y="84" text-anchor="middle">语义不兼容则拒绝</text>
    <rect class="strong" x="123" y="58" width="45" height="35" rx="4"/>
    <text class="t step ink" x="145.5" y="69" text-anchor="middle">3｜CAPABILITY</text>
    <text class="t small muted" x="145.5" y="77" text-anchor="middle">私有投影 / 最小权限</text>
    <text class="t small muted" x="145.5" y="84" text-anchor="middle">await 后重新验证</text>
    <rect class="node" x="178" y="58" width="37" height="35" rx="4"/>
    <text class="t step ink" x="196.5" y="69" text-anchor="middle">4｜EXECUTE</text>
    <text class="t small muted" x="196.5" y="77" text-anchor="middle">模型 / 工具循环</text>
    <text class="t small muted" x="196.5" y="84" text-anchor="middle">统一生命周期事件</text>
    <rect class="gate" x="225" y="58" width="38" height="35" rx="4"/>
    <text class="t step ink" x="244" y="69" text-anchor="middle">5｜EFFECT GATE</text>
    <text class="t small muted" x="244" y="77" text-anchor="middle">已提交副作用？</text>
    <text class="t small muted" x="244" y="84" text-anchor="middle">已有投递证据？</text>
    <rect class="commit" x="273" y="58" width="31" height="35" rx="4"/>
    <text class="t step ink" x="288.5" y="69" text-anchor="middle">6｜COMMIT</text>
    <text class="t small muted" x="288.5" y="77" text-anchor="middle">干净终态</text>
    <text class="t small muted" x="288.5" y="84" text-anchor="middle">Outbox 持久化</text>
    <path class="line" d="M56 75.5H66" marker-end="url(#arrow)"/><path class="line" d="M113 75.5H123" marker-end="url(#arrow)"/><path class="line" d="M168 75.5H178" marker-end="url(#arrow)"/><path class="line" d="M215 75.5H225" marker-end="url(#arrow)"/><path class="line" d="M263 75.5H273" marker-end="url(#arrow)"/>
  </g>
  <g id="fail-closed-branches">
    <rect class="fail" x="64" y="119" width="51" height="22" rx="4"/>
    <text class="t failh red" x="89.5" y="128" text-anchor="middle">跨 Harness 语义混用</text>
    <text class="t small muted" x="89.5" y="135" text-anchor="middle">禁止静默回退</text>
    <path class="fail-line" d="M89 93V119" marker-end="url(#fail-arrow)"/>
    <rect class="fail" x="121" y="119" width="50" height="22" rx="4"/>
    <text class="t failh red" x="146" y="128" text-anchor="middle">权限已关闭 / 已过期</text>
    <text class="t small muted" x="146" y="135" text-anchor="middle">旧引用立即失效</text>
    <path class="fail-line" d="M146 93V119" marker-end="url(#fail-arrow)"/>
    <rect class="fail" x="219" y="119" width="51" height="22" rx="4"/>
    <text class="t failh red" x="244.5" y="128" text-anchor="middle">副作用或投递已发生</text>
    <text class="t small muted" x="244.5" y="135" text-anchor="middle">阻止 fallback 重放</text>
    <path class="fail-line" d="M244 93V119" marker-end="url(#fail-arrow)"/>
  </g>
  <g id="properties">
    <rect fill="#163a5d" x="28" y="151" width="264" height="13" rx="3"/>
    <text class="t body" fill="#fff" x="160" y="159.5" text-anchor="middle">同一快照 · 最小能力 · 关闭即失效 · 副作用感知 · 干净终态才推进上下文</text>
  </g>
  <text class="t small muted" x="16" y="174">图 8｜可信执行链：成功路径可提交，危险路径显式 fail closed</text>
</svg>
