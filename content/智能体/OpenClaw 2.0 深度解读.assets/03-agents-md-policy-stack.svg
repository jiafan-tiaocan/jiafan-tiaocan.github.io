<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="180mm" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 的 AGENTS.md 分层策略</title>
  <desc id="desc">根级硬政策与路由、子树级所有者约束、技能级工作流、代码测试证据共同组成 AI 编码约束栈，并区分开发仓库 AGENTS 与用户工作区 AGENTS。</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d8e0ea;stroke-width:.7}.root{fill:#173a5c}.scope{fill:#dfeeff;stroke:#4c84be;stroke-width:.7}.skill{fill:#fff3e8;stroke:#e28a48;stroke-width:.7}.proof{fill:#e9f6ef;stroke:#4d9970;stroke-width:.7}.tag{fill:#eef2f6}.ink{fill:#142238}.muted{fill:#66758a}.white{fill:#fff}.blue{fill:#2f6fb5}.orange{fill:#d9651b}.line{stroke:#8294aa;stroke-width:.8;fill:none}.t{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h1{font-size:10px;font-weight:700}.h2{font-size:6.6px;font-weight:700}.body{font-size:4.7px}.small{font-size:4px}.micro{font-size:3.5px}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8294aa"/></marker>
  </defs>
  <rect class="bg" width="320" height="180"/>
  <text class="t h1 ink" x="17" y="17">AGENTS.md 不是“给 AI 的 README”，而是仓库的约束与路由层</text>
  <text class="t body muted" x="17" y="26">OpenClaw 的做法：通用硬规则上收，局部专业规则下沉，执行证据落到代码与测试</text>
  <g id="policy-stack">
    <rect class="card" x="16" y="38" width="190" height="125" rx="6"/>
    <text class="t h2 ink" x="27" y="52">开发仓库约束栈</text>
    <g id="root-policy">
      <rect class="root" x="29" y="62" width="164" height="25" rx="4"/>
      <text class="t h2 white" x="41" y="72">ROOT AGENTS.md</text>
      <text class="t small white" x="41" y="80">硬政策 · 产品/修复 Doctrine · 地图 · 精确命令 · 安全与证明门槛</text>
    </g>
    <path class="line" d="M111 87V96" marker-end="url(#arrow)"/>
    <g id="scoped-policy">
      <rect class="scope" x="29" y="99" width="164" height="22" rx="4"/>
      <text class="t h2 ink" x="41" y="108">SCOPED AGENTS.md</text>
      <text class="t small muted" x="41" y="116">agents / gateway / plugins / docs / apps：按所有者边界补充局部不变量</text>
    </g>
    <path class="line" d="M111 121V128" marker-end="url(#arrow)"/>
    <g id="workflow-and-proof">
      <rect class="skill" x="29" y="132" width="76" height="20" rx="4"/>
      <text class="t h2 ink" x="67" y="141" text-anchor="middle">SKILLS / WORKFLOW</text>
      <text class="t micro muted" x="67" y="147" text-anchor="middle">可复用操作流程与领域方法</text>
      <rect class="proof" x="117" y="132" width="76" height="20" rx="4"/>
      <text class="t h2 ink" x="155" y="141" text-anchor="middle">CODE / TEST / PROOF</text>
      <text class="t micro muted" x="155" y="147" text-anchor="middle">边界测试、真机证据、CI 合约</text>
    </g>
  </g>
  <g id="two-agents-classes">
    <rect class="card" x="217" y="38" width="87" height="78" rx="6"/>
    <text class="t h2 ink" x="228" y="52">同名但不同职责</text>
    <rect class="tag" x="228" y="61" width="65" height="19" rx="3"/>
    <text class="t body blue" x="260.5" y="69" text-anchor="middle">Repo AGENTS</text>
    <text class="t micro muted" x="260.5" y="75" text-anchor="middle">指导开发者 / Coding Agent 改代码</text>
    <rect class="tag" x="228" y="87" width="65" height="19" rx="3"/>
    <text class="t body orange" x="260.5" y="95" text-anchor="middle">Workspace AGENTS</text>
    <text class="t micro muted" x="260.5" y="101" text-anchor="middle">定义用户 Agent 的身份、记忆与行为</text>
  </g>
  <g id="design-rules">
    <rect class="card" x="217" y="123" width="87" height="40" rx="6"/>
    <text class="t h2 ink" x="228" y="136">最值得复用的三点</text>
    <circle fill="#2f6fb5" cx="230" cy="145" r="1.4"/><text class="t small muted" x="235" y="146.5">规则对准已知失败模式</text>
    <circle fill="#2f6fb5" cx="230" cy="153" r="1.4"/><text class="t small muted" x="235" y="154.5">仓库结构可被机器导航</text>
    <circle fill="#2f6fb5" cx="230" cy="161" r="1.4"/><text class="t small muted" x="235" y="162.5">完成定义包含验证证据</text>
  </g>
  <text class="t small muted" x="16" y="174">图 3｜AGENTS.md 的价值在“分层约束 + 所有者路由 + 证据闭环”，不在字数</text>
</svg>
