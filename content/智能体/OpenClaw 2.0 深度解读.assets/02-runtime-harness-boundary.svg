<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="180mm" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Runtime 与 Harness 的精确边界</title>
  <desc id="desc">Runtime 拥有系统事实和提交权，Harness 受托执行一次 Agent 回合，Agent Core 管理模型工具循环，模型只提出候选动作。</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.runtime{fill:#e9f2fc;stroke:#2f6fb5;stroke-width:1.1}.harness{fill:#fff;stroke:#eb7f36;stroke-width:1}.core{fill:#fff8ef;stroke:#d9651b;stroke-width:.8}.model{fill:#172f49}.chip{fill:#dbe9f8;stroke:#80a9d2;stroke-width:.5}.fact{fill:#fff;stroke:#8aa0b8;stroke-width:.55}.ink{fill:#132238}.muted{fill:#62738a}.white{fill:#fff}.blue{fill:#2f6fb5}.orange{fill:#d9651b}.line{stroke:#2f6fb5;stroke-width:1;fill:none}.return{stroke:#d9651b;stroke-width:1;fill:none;stroke-dasharray:3 2}.t{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h1{font-size:10px;font-weight:700}.h2{font-size:6.8px;font-weight:700}.body{font-size:4.7px}.small{font-size:4px}
    </style>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2f6fb5"/></marker>
    <marker id="orange-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#d9651b"/></marker>
  </defs>
  <rect class="bg" width="320" height="180"/>
  <g id="header">
    <text class="t h1 ink" x="17" y="17">Runtime 管“事实与提交”，Harness 管“一次受约束的执行”</text>
    <text class="t body muted" x="17" y="26">边界不在代码目录，而在谁拥有最终事实、谁只能使用被投影的能力</text>
  </g>
  <g id="runtime-boundary">
    <rect class="runtime" x="16" y="36" width="288" height="127" rx="7"/>
    <text class="t h2 blue" x="26" y="50">RUNTIME｜系统主权层</text>
    <text class="t small muted" x="26" y="57">接纳 Run · 固定代际快照 · 选择 Harness · 持久化 · 恢复 · 审计</text>
    <g id="runtime-owned-facts">
      <rect class="fact" x="26" y="68" width="46" height="15" rx="3"/><text class="t body ink" x="49" y="77.5" text-anchor="middle">会话与身份</text>
      <rect class="fact" x="26" y="89" width="46" height="15" rx="3"/><text class="t body ink" x="49" y="98.5" text-anchor="middle">权限与放置</text>
      <rect class="fact" x="26" y="110" width="46" height="15" rx="3"/><text class="t body ink" x="49" y="119.5" text-anchor="middle">状态与 Outbox</text>
      <rect class="fact" x="26" y="131" width="46" height="15" rx="3"/><text class="t body ink" x="49" y="140.5" text-anchor="middle">副作用证据</text>
    </g>
    <g id="harness-boundary">
      <rect class="harness" x="91" y="64" width="147" height="85" rx="6"/>
      <text class="t h2 orange" x="101" y="78">HARNESS｜执行适配协议</text>
      <text class="t small muted" x="101" y="85">被授予本次 Run 所需的最小能力；关闭后全部失效</text>
      <g id="capability-projection">
        <rect class="chip" x="101" y="93" width="29" height="12" rx="2.5"/><text class="t small ink" x="115.5" y="100.5" text-anchor="middle">上下文</text>
        <rect class="chip" x="135" y="93" width="29" height="12" rx="2.5"/><text class="t small ink" x="149.5" y="100.5" text-anchor="middle">工具面</text>
        <rect class="chip" x="169" y="93" width="29" height="12" rx="2.5"/><text class="t small ink" x="183.5" y="100.5" text-anchor="middle">模型目录</text>
        <rect class="chip" x="203" y="93" width="25" height="12" rx="2.5"/><text class="t small ink" x="215.5" y="100.5" text-anchor="middle">事件</text>
      </g>
      <rect class="core" x="112" y="113" width="104" height="25" rx="4"/>
      <text class="t h2 ink" x="164" y="123" text-anchor="middle">AGENT CORE</text>
      <text class="t small muted" x="164" y="131" text-anchor="middle">prompt → model → tool → observation 循环</text>
    </g>
    <g id="model-boundary">
      <rect class="model" x="255" y="82" width="37" height="50" rx="5"/>
      <text class="t h2 white" x="273.5" y="98" text-anchor="middle">MODEL</text>
      <text class="t small white" x="273.5" y="107" text-anchor="middle">理解</text>
      <text class="t small white" x="273.5" y="115" text-anchor="middle">规划</text>
      <text class="t small white" x="273.5" y="123" text-anchor="middle">提出候选动作</text>
    </g>
    <path class="line" d="M72 82C82 82 81 91 91 91" marker-end="url(#blue-arrow)"/>
    <text class="t small blue" x="78" y="76">授权投影</text>
    <path class="line" d="M216 119C236 119 236 105 255 105" marker-end="url(#blue-arrow)"/>
    <text class="t small blue" x="236" y="96" text-anchor="middle">请求</text>
    <path class="return" d="M255 124C238 143 232 143 216 134" marker-end="url(#orange-arrow)"/>
    <text class="t small orange" x="239" y="148" text-anchor="middle">建议 / token / tool call</text>
    <path class="return" d="M112 141C93 155 80 150 72 139" marker-end="url(#orange-arrow)"/>
    <text class="t small orange" x="89" y="158" text-anchor="middle">结果与证据</text>
  </g>
  <g id="definition-strip">
    <rect fill="#12385b" x="166" y="42" width="126" height="16" rx="3"/>
    <text class="t small white" x="229" y="49" text-anchor="middle">模型可以建议；Harness 可以执行</text>
    <text class="t small white" x="229" y="55" text-anchor="middle">Runtime 才能提交系统事实</text>
  </g>
  <text class="t small muted" x="16" y="174">图 3｜Runtime / Harness / Agent Core / Model 的责任与信任边界</text>
</svg>
