<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="180mm" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 从 1.0 到 2.0：从软约定到硬约束</title>
  <desc id="desc">对比由模型自觉维持的软约定，与由运行时强制执行的身份、权限、状态、生命周期、恢复和可观测性约束。</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:.7}.soft{fill:#f1f3f6;stroke:#aeb8c5;stroke-width:.65}.hard{fill:#eaf3ff;stroke:#2f6fb5;stroke-width:.8}.core{fill:#12385b}.accent{fill:#eb7f36}.ink{fill:#132238}.muted{fill:#66758a}.white{fill:#fff}.line{stroke:#7e8fa6;stroke-width:.8;fill:none}.strongline{stroke:#2f6fb5;stroke-width:1.1;fill:none}.dash{stroke:#aeb8c5;stroke-width:.7;stroke-dasharray:2.4 2;fill:none}.t{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h1{font-size:10px;font-weight:700}.h2{font-size:6.8px;font-weight:700}.body{font-size:4.7px}.small{font-size:4px}.num{font-size:11px;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2f6fb5"/></marker>
  </defs>
  <rect id="background" class="bg" width="320" height="180"/>
  <g id="header">
    <text class="t h1 ink" x="18" y="18">从“像个 Agent”到“按约束可靠运行”</text>
    <text class="t body muted" x="18" y="27">OpenClaw 2.0 的成熟感，主要来自运行时不变量，而不是模型突然更聪明</text>
    <rect class="accent" x="283" y="11" width="19" height="5" rx="2.5"/>
    <text class="t small white" x="292.5" y="14.8" text-anchor="middle">核心判断</text>
  </g>
  <g id="soft-conventions">
    <rect class="panel" x="16" y="39" width="121" height="119" rx="5"/>
    <text class="t num muted" x="27" y="57">1.0</text>
    <text class="t h2 ink" x="27" y="68">软约定驱动</text>
    <text class="t body muted" x="27" y="77">正确性依赖提示词、模型自觉和理想路径</text>
    <g id="soft-items">
      <rect class="soft" x="27" y="88" width="44" height="18" rx="3"/><text class="t body ink" x="49" y="96" text-anchor="middle">记住身份</text><text class="t small muted" x="49" y="102" text-anchor="middle">prompt 提醒</text>
      <rect class="soft" x="81" y="88" width="44" height="18" rx="3"/><text class="t body ink" x="103" y="96" text-anchor="middle">谨慎调用</text><text class="t small muted" x="103" y="102" text-anchor="middle">模型判断</text>
      <rect class="soft" x="27" y="114" width="44" height="18" rx="3"/><text class="t body ink" x="49" y="122" text-anchor="middle">保持上下文</text><text class="t small muted" x="49" y="128" text-anchor="middle">尽量不丢</text>
      <rect class="soft" x="81" y="114" width="44" height="18" rx="3"/><text class="t body ink" x="103" y="122" text-anchor="middle">失败再重试</text><text class="t small muted" x="103" y="128" text-anchor="middle">容易重复副作用</text>
    </g>
    <path class="dash" d="M27 141H125"/>
    <text class="t small muted" x="27" y="149">主要风险：静默失败 · 权限漂移 · 状态分叉</text>
  </g>
  <g id="transition">
    <path class="strongline" d="M143 99H171" marker-end="url(#arrow)"/>
    <text class="t small muted" x="157" y="91" text-anchor="middle">工程化</text>
    <text class="t small muted" x="157" y="108" text-anchor="middle">制度化</text>
  </g>
  <g id="hard-invariants">
    <rect class="panel" x="178" y="39" width="126" height="119" rx="5"/>
    <text class="t num" fill="#2f6fb5" x="189" y="57">2.0</text>
    <text class="t h2 ink" x="189" y="68">硬约束驱动</text>
    <text class="t body muted" x="189" y="77">正确性由 Runtime / Harness 在边界上执行</text>
    <rect id="work-object" class="core" x="221" y="104" width="40" height="22" rx="4"/>
    <text class="t h2 white" x="241" y="113" text-anchor="middle">工作对象</text>
    <text class="t small white" x="241" y="120" text-anchor="middle">一次被接纳的 Run</text>
    <g id="invariants">
      <rect class="hard" x="188" y="87" width="43" height="14" rx="3"/><text class="t body ink" x="209.5" y="96" text-anchor="middle">身份与会话</text>
      <rect class="hard" x="251" y="87" width="43" height="14" rx="3"/><text class="t body ink" x="272.5" y="96" text-anchor="middle">权限与工具面</text>
      <rect class="hard" x="188" y="109" width="28" height="14" rx="3"/><text class="t body ink" x="202" y="118" text-anchor="middle">状态</text>
      <rect class="hard" x="266" y="109" width="28" height="14" rx="3"/><text class="t body ink" x="280" y="118" text-anchor="middle">生命周期</text>
      <rect class="hard" x="188" y="131" width="43" height="14" rx="3"/><text class="t body ink" x="209.5" y="140" text-anchor="middle">失败与恢复</text>
      <rect class="hard" x="251" y="131" width="43" height="14" rx="3"/><text class="t body ink" x="272.5" y="140" text-anchor="middle">证据与观测</text>
      <path class="line" d="M218 101L225 106M264 101L257 106M216 116H221M266 116H261M218 133L226 125M264 133L256 125"/>
    </g>
    <text class="t small" fill="#2f6fb5" x="241" y="152" text-anchor="middle">越界即拒绝，失败有类型，完成必须可证明</text>
  </g>
  <text class="t small muted" x="16" y="171">图 1｜成熟度的分水岭：关键行为从“建议”升级为“运行时不变量”</text>
</svg>
