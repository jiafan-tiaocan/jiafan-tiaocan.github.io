<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Codex Harness 单轮执行链路</title><desc id="desc">从客户端请求到模型采样、工具执行、审批与事件回传的序列图。</desc>
  <defs><style>.bg{fill:#f8f9fb}.lane{fill:#fff;stroke:#ced6e2;stroke-width:2}.core{fill:#edf8f2;stroke:#299468;stroke-width:2}.head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#182235}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#182235}.label{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#344055}.small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#637085}.life{stroke:#9aa8bb;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#4d6079;stroke-width:2.5;fill:none;marker-end:url(#a)}.return{stroke:#277d5b;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#g)}.approval{stroke:#c36a27;stroke-width:2.5;fill:none;marker-end:url(#o)}.box{fill:#fff8ee;stroke:#d07a36;stroke-width:2}.loop{fill:none;stroke:#6e7e94;stroke-width:2;stroke-dasharray:10 7}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4d6079"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#277d5b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c36a27"/></marker></defs>
  <rect class="bg" width="1800" height="1080"/><text class="title" x="70" y="58">一次 Turn 如何跑完：请求是一次，事件是许多次；采样与工具可循环多轮</text>
  <g id="lanes"><rect class="lane" x="55" y="90" width="240" height="930" rx="16"/><rect class="lane" x="330" y="90" width="275" height="930" rx="16"/><rect class="core" x="640" y="90" width="300" height="930" rx="16"/><rect class="core" x="975" y="90" width="300" height="930" rx="16"/><rect class="lane" x="1310" y="90" width="210" height="930" rx="16"/><rect class="lane" x="1555" y="90" width="190" height="930" rx="16"/>
  <text class="head" x="175" y="130" text-anchor="middle">客户端</text><text class="small" x="175" y="155" text-anchor="middle">UI / CLI / 自建宿主</text><text class="head" x="468" y="130" text-anchor="middle">App Server</text><text class="small" x="468" y="155" text-anchor="middle">协议与事件翻译</text><text class="head" x="790" y="130" text-anchor="middle">Thread / Session</text><text class="small" x="790" y="155" text-anchor="middle">提交队列 + 状态</text><text class="head" x="1125" y="130" text-anchor="middle">Turn Loop</text><text class="small" x="1125" y="155" text-anchor="middle">上下文 / 工具 / 重试</text><text class="head" x="1415" y="130" text-anchor="middle">模型服务</text><text class="head" x="1650" y="130" text-anchor="middle">工具运行时</text>
  <line class="life" x1="175" y1="175" x2="175" y2="990"/><line class="life" x1="468" y1="175" x2="468" y2="990"/><line class="life" x1="790" y1="175" x2="790" y2="990"/><line class="life" x1="1125" y1="175" x2="1125" y2="990"/><line class="life" x1="1415" y1="175" x2="1415" y2="990"/><line class="life" x1="1650" y1="175" x2="1650" y2="990"/></g>
  <g id="flow">
    <path class="msg" d="M175 215H458"/><text class="label" x="315" y="204" text-anchor="middle">turn/start(threadId, input)</text>
    <path class="msg" d="M468 255H780"/><text class="label" x="625" y="244" text-anchor="middle">typed request + serialization scope</text>
    <path class="msg" d="M790 295H1115"/><text class="label" x="950" y="284" text-anchor="middle">Submission → submission_loop</text>
    <path class="return" d="M780 330H478"/><text class="small" x="630" y="320" text-anchor="middle">立即确认 Turn 已启动</text>
    <rect class="loop" x="1000" y="360" width="705" height="500" rx="18"/><text class="small" x="1022" y="390">重复，直到只剩最终消息 / 被中断 / 出错</text>
    <path class="msg" d="M1125 435H1405"/><text class="label" x="1265" y="424" text-anchor="middle">流式采样：history + tools + instructions</text>
    <path class="return" d="M1405 480H1135"/><text class="label" x="1270" y="469" text-anchor="middle">ResponseEvent / delta / tool call</text>
    <path class="return" d="M1115 520H478"/><text class="small" x="795" y="510" text-anchor="middle">item/started、delta 等 UI-ready 通知</text>
    <path class="msg" d="M1125 575H1640"/><text class="label" x="1380" y="564" text-anchor="middle">ToolRouter → Registry → Orchestrator</text>
    <rect class="box" x="1018" y="610" width="344" height="106" rx="13"/><text class="label" x="1040" y="642">若需批准：暂停工具，不阻塞协议</text><text class="small" x="1040" y="671">server→client request 带 request id</text><text class="small" x="1040" y="696">批准结果再回到同一 Session</text>
    <path class="approval" d="M1115 658H478"/><path class="approval" d="M468 688H185"/><text class="small" x="640" y="648">approval request</text><text class="small" x="295" y="678">展示给用户</text>
    <path class="approval" d="M175 738H458"/><path class="approval" d="M468 768H1115"/><text class="small" x="300" y="728">decision</text><text class="small" x="720" y="758">批准 / 拒绝 / 本会话批准</text>
    <path class="return" d="M1640 815H1135"/><text class="label" x="1385" y="804" text-anchor="middle">sandboxed output / error</text>
    <path class="msg" d="M1125 845H1405"/><text class="small" x="1265" y="835" text-anchor="middle">工具结果写回历史，继续采样</text>
    <path class="return" d="M1115 905H478"/><text class="label" x="800" y="894" text-anchor="middle">turn/completed + final item</text>
    <path class="return" d="M458 945H185"/><text class="label" x="320" y="934" text-anchor="middle">通知订阅者</text>
  </g>
  <text class="small" x="70" y="1052">关键语义：同一 Thread 的状态变更被串行化；不同 Thread 可并发。工具 future 可并行执行，但以有序队列回填，避免历史次序漂移。</text>
</svg>
