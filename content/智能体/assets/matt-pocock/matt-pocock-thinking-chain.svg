<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Matt Pocock 的六项核心成果</title>
  <desc id="desc">成果地图从 XState typegen、Total TypeScript、ts-reset 和错误翻译器，延伸到 Evalite、Agent Skills 与 Sandcastle。每张卡片列出解决的问题、交付物和实际改进。底部区分成熟旗舰、精准开源工具、注意力成果和新兴基础设施。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .eyebrow { font-size: 17px; font-weight: 760; letter-spacing: .1em; }
      .card-title { font-size: 27px; font-weight: 760; fill: #f8fafc; }
      .body { font-size: 20px; fill: #cbd5e1; }
      .small { font-size: 17px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="960" rx="28" fill="url(#bg)"/>
  <circle cx="1460" cy="30" r="230" fill="#38bdf8" opacity="0.07"/>
  <circle cx="80" cy="940" r="250" fill="#2dd4bf" opacity="0.06"/>

  <g class="sans">
    <text x="80" y="66" class="eyebrow" fill="#5eead4">MATT POCOCK · CORE WORK</text>
    <text x="80" y="120" font-size="43" font-weight="790" fill="#f8fafc">六项成果，一套从专业能力到产品影响力的路径</text>
    <text x="80" y="160" font-size="22" fill="#94a3b8">先解决真实摩擦，再把解法交付为类型工具、练习系统、Eval、Skill 与 Runtime</text>
    <rect x="80" y="190" width="1440" height="5" rx="3" fill="url(#line)"/>

    <g filter="url(#shadow)">
      <rect x="80" y="230" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="112" y="270" class="eyebrow" fill="#67e8f9">01 · XSTATE TYPEGEN</text>
      <text x="112" y="310" class="card-title">让状态机关系进入类型系统</text>
      <text x="112" y="352" class="body">问题：action 收到宽泛事件，缺少实现检查</text>
      <text x="112" y="387" class="body">交付：静态分析 + 生成类型 + VS Code 集成</text>
      <text x="112" y="426" class="small">提升：上下文事件收窄、补全、缺失实现报错</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="575" y="230" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="607" y="270" class="eyebrow" fill="#fbbf24">02 · TOTAL TYPESCRIPT</text>
      <text x="607" y="310" class="card-title">把 TypeScript 教学做成练习系统</text>
      <text x="607" y="352" class="body">问题：视频能看懂，复杂类型仍不会写</text>
      <text x="607" y="387" class="body">交付：问题文件 + 编辑器反馈 + 解法讲解</text>
      <text x="607" y="426" class="small">提升：从被动听课变成可重复的主动训练</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1070" y="230" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="1102" y="270" class="eyebrow" fill="#c4b5fd">03 · TS-RESET / ERRORS</text>
      <text x="1102" y="310" class="card-title">修正默认类型与错误反馈</text>
      <text x="1102" y="352" class="body">问题：JSON 返回 any，报错难以行动</text>
      <text x="1102" y="387" class="body">交付：声明合并包 + IDE 错误翻译器</text>
      <text x="1102" y="426" class="small">提升：更安全默认值，更短的理解路径</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="80" y="500" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="112" y="540" class="eyebrow" fill="#67e8f9">04 · EVALITE</text>
      <text x="112" y="580" class="card-title">把 LLM 评测拉回 TypeScript</text>
      <text x="112" y="622" class="body">问题：非确定输出只能靠人工看样例</text>
      <text x="112" y="657" class="body">交付：.eval.ts + scorer + trace + CI 阈值</text>
      <text x="112" y="696" class="small">提升：本地、可重复、无模型厂商绑定的 Eval</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="575" y="500" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="607" y="540" class="eyebrow" fill="#fbbf24">05 · AGENT SKILLS</text>
      <text x="607" y="580" class="card-title">把工程方法写成可调用协议</text>
      <text x="607" y="622" class="body">问题：Agent 缺需求、调试和交付纪律</text>
      <text x="607" y="657" class="body">交付：grill、spec、TDD、review 等 Skills</text>
      <text x="607" y="696" class="small">提升：工程动作可安装、组合、修改和复用</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1070" y="500" width="450" height="230" rx="22" fill="#111c2d" stroke="#2b3b54"/>
      <text x="1102" y="540" class="eyebrow" fill="#c4b5fd">06 · SANDCASTLE</text>
      <text x="1102" y="580" class="card-title">把 Agent 副作用收进 Runtime</text>
      <text x="1102" y="622" class="body">问题：Prompt 无法隔离文件、并发与恢复</text>
      <text x="1102" y="657" class="body">交付：sandbox + worktree + branch + merge</text>
      <text x="1102" y="696" class="small">提升：运行隔离、可恢复日志、提交式交付</text>
    </g>

    <text x="80" y="800" class="eyebrow" fill="#a5b4fc">客观定位</text>
    <g transform="translate(80 825)">
      <rect width="330" height="78" rx="16" fill="#10252a" stroke="#2dd4bf"/>
      <text x="22" y="32" font-size="19" font-weight="740" fill="#5eead4">最成熟的旗舰成果</text>
      <text x="22" y="58" class="small">Total TypeScript</text>
    </g>
    <g transform="translate(450 825)">
      <rect width="330" height="78" rx="16" fill="#2a2413" stroke="#fbbf24"/>
      <text x="22" y="32" font-size="19" font-weight="740" fill="#fcd34d">最精准的开源工具</text>
      <text x="22" y="58" class="small">ts-reset</text>
    </g>
    <g transform="translate(820 825)">
      <rect width="330" height="78" rx="16" fill="#1d2038" stroke="#818cf8"/>
      <text x="22" y="32" font-size="19" font-weight="740" fill="#c4b5fd">最大的注意力成果</text>
      <text x="22" y="58" class="small">Agent Skills</text>
    </g>
    <g transform="translate(1190 825)">
      <rect width="330" height="78" rx="16" fill="#132334" stroke="#38bdf8"/>
      <text x="22" y="32" font-size="19" font-weight="740" fill="#7dd3fc">最值得观察的新基础设施</text>
      <text x="22" y="58" class="small">Evalite + Sandcastle</text>
    </g>
  </g>
</svg>
