<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Matt Pocock Skills 的五阶段控制系统</title>
  <desc id="desc">将固定版本中 25 个正式发布的 Skills 按进入与路由、澄清与建模、计划与协调、执行与验证、系统与连续性五组排列，并说明它们把人的命令、模型纪律和持久工件连接起来。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 54px; font-weight: 750; fill: #f8fafc; letter-spacing: -1.2px; }
      .subtitle { font-size: 24px; fill: #aab6ce; }
      .stage-num { font-size: 17px; font-weight: 750; fill: #08111f; }
      .stage-title { font-size: 27px; font-weight: 720; fill: #f8fafc; }
      .stage-note { font-size: 17px; fill: #aebbd2; }
      .pill { font-size: 18px; font-weight: 620; fill: #e6edf7; }
      .kind { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .promise-title { font-size: 20px; font-weight: 720; fill: #f8fafc; }
      .promise-note { font-size: 16px; fill: #aebbd2; }
      .legend { font-size: 17px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#bg)"/>
  <circle cx="1690" cy="120" r="260" fill="#7c3aed" opacity="0.08"/>
  <circle cx="80" cy="1140" r="320" fill="#0ea5e9" opacity="0.07"/>

  <g class="sans">
    <text x="90" y="100" class="title">Skills 不是清单，而是一套开发控制系统</text>
    <text x="90" y="145" class="subtitle">固定版本 84fdeffd：25 个正式发布 Skill，把“人的命令 → 模型纪律 → 持久工件”接成反馈链</text>
    <rect x="90" y="178" width="1620" height="6" rx="3" fill="url(#accent)"/>

    <!-- Stage 1 -->
    <g filter="url(#shadow)">
      <rect x="90" y="235" width="300" height="585" rx="26" fill="#121b2e" stroke="#2b3a54"/>
    </g>
    <circle cx="132" cy="283" r="21" fill="#7dd3fc"/>
    <text x="132" y="289" text-anchor="middle" class="stage-num">1</text>
    <text x="166" y="291" class="stage-title">进入与路由</text>
    <text x="120" y="329" class="stage-note">先配置环境，再选择合适流程</text>
    <rect x="120" y="370" width="240" height="55" rx="15" fill="#17304a" stroke="#2c6b91"/>
    <text x="240" y="404" text-anchor="middle" class="pill">setup-matt-pocock-skills</text>
    <rect x="120" y="445" width="240" height="55" rx="15" fill="#17304a" stroke="#2c6b91"/>
    <text x="240" y="479" text-anchor="middle" class="pill">ask-matt</text>
    <text x="120" y="550" class="kind" fill="#7dd3fc">核心工件</text>
    <text x="120" y="582" class="stage-note">issue tracker 配置</text>
    <text x="120" y="610" class="stage-note">triage 标签与文档布局</text>
    <text x="120" y="674" class="kind" fill="#7dd3fc">主要心理承诺</text>
    <text x="120" y="706" class="stage-note">“我不必记住整套方法”</text>
    <text x="120" y="734" class="stage-note">“它会适配我的仓库”</text>

    <!-- Stage 2 -->
    <g filter="url(#shadow)">
      <rect x="410" y="235" width="300" height="585" rx="26" fill="#151a31" stroke="#3c3b69"/>
    </g>
    <circle cx="452" cy="283" r="21" fill="#a78bfa"/>
    <text x="452" y="289" text-anchor="middle" class="stage-num">2</text>
    <text x="486" y="291" class="stage-title">澄清与建模</text>
    <text x="440" y="329" class="stage-note">把模糊意图变成共享语言</text>
    <rect x="440" y="370" width="110" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="495" y="400" text-anchor="middle" class="pill">grill-me</text>
    <rect x="570" y="370" width="110" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="625" y="400" text-anchor="middle" class="pill">grilling</text>
    <rect x="440" y="434" width="240" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="560" y="464" text-anchor="middle" class="pill">grill-with-docs</text>
    <rect x="440" y="498" width="240" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="560" y="528" text-anchor="middle" class="pill">domain-modeling</text>
    <rect x="440" y="562" width="240" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="560" y="592" text-anchor="middle" class="pill">to-questionnaire</text>
    <rect x="440" y="626" width="110" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="495" y="656" text-anchor="middle" class="pill">research</text>
    <rect x="570" y="626" width="110" height="48" rx="14" fill="#29234f" stroke="#6d5aa8"/><text x="625" y="656" text-anchor="middle" class="pill">prototype</text>
    <text x="440" y="724" class="kind" fill="#a78bfa">核心工件</text>
    <text x="440" y="756" class="stage-note">CONTEXT.md · ADR · cited research</text>
    <text x="440" y="784" class="stage-note">prototype · questionnaire</text>

    <!-- Stage 3 -->
    <g filter="url(#shadow)">
      <rect x="730" y="235" width="300" height="585" rx="26" fill="#19192c" stroke="#4f4160"/>
    </g>
    <circle cx="772" cy="283" r="21" fill="#c084fc"/>
    <text x="772" y="289" text-anchor="middle" class="stage-num">3</text>
    <text x="806" y="291" class="stage-title">计划与协调</text>
    <text x="760" y="329" class="stage-note">把一次对话变成可接力的图</text>
    <rect x="760" y="370" width="240" height="55" rx="15" fill="#34203f" stroke="#855094"/><text x="880" y="404" text-anchor="middle" class="pill">to-spec</text>
    <rect x="760" y="445" width="240" height="55" rx="15" fill="#34203f" stroke="#855094"/><text x="880" y="479" text-anchor="middle" class="pill">to-tickets</text>
    <rect x="760" y="520" width="240" height="55" rx="15" fill="#34203f" stroke="#855094"/><text x="880" y="554" text-anchor="middle" class="pill">wayfinder</text>
    <rect x="760" y="595" width="240" height="55" rx="15" fill="#34203f" stroke="#855094"/><text x="880" y="629" text-anchor="middle" class="pill">triage</text>
    <text x="760" y="701" class="kind" fill="#c084fc">核心工件</text>
    <text x="760" y="733" class="stage-note">spec · tracer-bullet tickets</text>
    <text x="760" y="761" class="stage-note">blocking edges · decision map</text>

    <!-- Stage 4 -->
    <g filter="url(#shadow)">
      <rect x="1050" y="235" width="300" height="585" rx="26" fill="#211925" stroke="#654056"/>
    </g>
    <circle cx="1092" cy="283" r="21" fill="#fb7185"/>
    <text x="1092" y="289" text-anchor="middle" class="stage-num">4</text>
    <text x="1126" y="291" class="stage-title">执行与验证</text>
    <text x="1080" y="329" class="stage-note">用红灯、差异与审查代替相信</text>
    <rect x="1080" y="370" width="240" height="55" rx="15" fill="#43202f" stroke="#9f425f"/><text x="1200" y="404" text-anchor="middle" class="pill">implement</text>
    <rect x="1080" y="445" width="110" height="55" rx="15" fill="#43202f" stroke="#9f425f"/><text x="1135" y="479" text-anchor="middle" class="pill">tdd</text>
    <rect x="1210" y="445" width="110" height="55" rx="15" fill="#43202f" stroke="#9f425f"/><text x="1265" y="479" text-anchor="middle" class="pill">code-review</text>
    <rect x="1080" y="520" width="240" height="55" rx="15" fill="#43202f" stroke="#9f425f"/><text x="1200" y="554" text-anchor="middle" class="pill">diagnosing-bugs</text>
    <rect x="1080" y="595" width="240" height="55" rx="15" fill="#43202f" stroke="#9f425f"/><text x="1200" y="629" text-anchor="middle" class="pill">resolving-merge-conflicts</text>
    <text x="1080" y="701" class="kind" fill="#fb7185">核心工件</text>
    <text x="1080" y="733" class="stage-note">failing test · minimal repro</text>
    <text x="1080" y="761" class="stage-note">review findings · commit</text>

    <!-- Stage 5 -->
    <g filter="url(#shadow)">
      <rect x="1370" y="235" width="340" height="585" rx="26" fill="#1f1b27" stroke="#5a495b"/>
    </g>
    <circle cx="1412" cy="283" r="21" fill="#fda4af"/>
    <text x="1412" y="289" text-anchor="middle" class="stage-num">5</text>
    <text x="1446" y="291" class="stage-title">系统与连续性</text>
    <text x="1400" y="329" class="stage-note">让架构、人工边界与记忆可继承</text>
    <rect x="1400" y="370" width="280" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1540" y="400" text-anchor="middle" class="pill">codebase-design</text>
    <rect x="1400" y="434" width="280" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1540" y="464" text-anchor="middle" class="pill">improve-codebase-architecture</text>
    <rect x="1400" y="498" width="130" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1465" y="528" text-anchor="middle" class="pill">wizard</text>
    <rect x="1550" y="498" width="130" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1615" y="528" text-anchor="middle" class="pill">handoff</text>
    <rect x="1400" y="562" width="130" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1465" y="592" text-anchor="middle" class="pill">teach</text>
    <rect x="1550" y="562" width="130" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1615" y="592" text-anchor="middle" class="pill">wait-what</text>
    <rect x="1400" y="626" width="280" height="48" rx="14" fill="#3c2936" stroke="#8d5c72"/><text x="1540" y="656" text-anchor="middle" class="pill">writing-for-agents</text>
    <text x="1400" y="724" class="kind" fill="#fda4af">核心工件</text>
    <text x="1400" y="756" class="stage-note">deep modules · wizard · handoff</text>
    <text x="1400" y="784" class="stage-note">lesson workspace · agent docs</text>

    <!-- Arrows -->
    <g fill="none" stroke="#d6d9e4" stroke-width="3" opacity="0.58">
      <path d="M390 527h20"/><path d="M710 527h20"/><path d="M1030 527h20"/><path d="M1350 527h20"/>
    </g>
    <g fill="#d6d9e4" opacity="0.58">
      <path d="M410 527l-9-6v12z"/><path d="M730 527l-9-6v12z"/><path d="M1050 527l-9-6v12z"/><path d="M1370 527l-9-6v12z"/>
    </g>

    <!-- Inferred promises -->
    <text x="90" y="897" class="kind" fill="#aab6ce">产品层的心理承诺（本文推断，不是用户实验结论）</text>
    <g>
      <rect x="90" y="930" width="300" height="170" rx="22" fill="#101a2b" stroke="#304662"/>
      <text x="120" y="975" class="promise-title">控制感</text>
      <text x="120" y="1010" class="promise-note">人主动调用编排器</text>
      <text x="120" y="1038" class="promise-note">模型只复用局部纪律</text>
      <text x="120" y="1066" class="promise-note">小 Skill 可替换、可退出</text>

      <rect x="410" y="930" width="300" height="170" rx="22" fill="#15162c" stroke="#494272"/>
      <text x="440" y="975" class="promise-title">不确定性被看见</text>
      <text x="440" y="1010" class="promise-note">问题有依赖树与 frontier</text>
      <text x="440" y="1038" class="promise-note">任务有 blocking edges</text>
      <text x="440" y="1066" class="promise-note">失败有可运行红灯</text>

      <rect x="730" y="930" width="300" height="170" rx="22" fill="#1b1729" stroke="#5b456d"/>
      <text x="760" y="975" class="promise-title">专业身份被保留</text>
      <text x="760" y="1010" class="promise-note">TDD、DDD、ADR、code review</text>
      <text x="760" y="1038" class="promise-note">不是“把工程判断交给 AI”</text>
      <text x="760" y="1066" class="promise-note">而是让 AI 执行熟悉纪律</text>

      <rect x="1050" y="930" width="300" height="170" rx="22" fill="#231724" stroke="#714152"/>
      <text x="1080" y="975" class="promise-title">进度与完成感</text>
      <text x="1080" y="1010" class="promise-note">每一步都有明确工件</text>
      <text x="1080" y="1038" class="promise-note">从“聊了很多”变成</text>
      <text x="1080" y="1066" class="promise-note">spec、ticket、test、commit</text>

      <rect x="1370" y="930" width="340" height="170" rx="22" fill="#211923" stroke="#684b5b"/>
      <text x="1400" y="975" class="promise-title">跨会话的安全感</text>
      <text x="1400" y="1010" class="promise-note">决定和术语写入仓库</text>
      <text x="1400" y="1038" class="promise-note">新 Agent 从工件恢复上下文</text>
      <text x="1400" y="1066" class="promise-note">不再把记忆押在一次聊天里</text>
    </g>

    <g transform="translate(90 1160)">
      <circle cx="8" cy="0" r="7" fill="#7dd3fc"/><text x="26" y="6" class="legend">蓝紫：人主动调用的编排与澄清</text>
      <circle cx="410" cy="0" r="7" fill="#fb7185"/><text x="428" y="6" class="legend">玫红：执行反馈与治理</text>
      <text x="940" y="6" class="legend">持久化边界：Markdown / issue tracker / tests / Git</text>
    </g>
  </g>
</svg>
