<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">生产级 Meta-Harness 点火实验架构</title>
  <desc id="desc">不可变真值平面约束候选 Meta-Harness。每个候选在隐藏优化任务上运行内层能力优化，形成 Optimization Episode，再由独立元评测比较改进产出、成本、泛化和风险，最终决定灰度晋级或回滚。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1320"/><stop offset="1" stop-color="#162b34"/></linearGradient>
    <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f8cff"/><stop offset="1" stop-color="#ad7bff"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ca8ff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67dfbd"/></marker>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg2)"/>
  <text x="70" y="72" fill="#f7f9ff" font-family="Inter, PingFang SC, sans-serif" font-size="38" font-weight="700">怎样把“点火”从口号变成可证伪实验</text>
  <text x="70" y="112" fill="#acbbcf" font-family="Inter, PingFang SC, sans-serif" font-size="21">候选改进器可以修改优化方法，但不能修改用来证明自己进步的事实、裁判与安全边界。</text>

  <rect x="70" y="150" width="1460" height="118" rx="22" fill="#111b2c" stroke="#4e6380" stroke-width="2"/>
  <text x="102" y="192" fill="#ffcf8a" font-family="Inter, PingFang SC, sans-serif" font-size="22" font-weight="700">不可变真值平面 · candidate 无读写权</text>
  <g font-family="Inter, PingFang SC, sans-serif" font-size="18" fill="#dfe8f7">
    <rect x="102" y="213" width="230" height="38" rx="19" fill="#242536"/><text x="145" y="238">隐藏优化任务 D_meta</text>
    <rect x="355" y="213" width="190" height="38" rx="19" fill="#242536"/><text x="397" y="238">固定预算 B</text>
    <rect x="568" y="213" width="225" height="38" rx="19" fill="#242536"/><text x="607" y="238">Evaluator / Holdout</text>
    <rect x="816" y="213" width="225" height="38" rx="19" fill="#242536"/><text x="866" y="238">权限与安全策略</text>
    <rect x="1064" y="213" width="205" height="38" rx="19" fill="#242536"/><text x="1105" y="238">人工基线 H</text>
    <rect x="1292" y="213" width="205" height="38" rx="19" fill="#242536"/><text x="1333" y="238">晋级与回滚规则</text>
  </g>

  <g filter="url(#s2)">
    <rect x="80" y="330" width="330" height="265" rx="26" fill="#172239" stroke="#6f8cff" stroke-width="2"/>
    <rect x="465" y="330" width="670" height="265" rx="26" fill="#132b31" stroke="#45bfa7" stroke-width="2"/>
    <rect x="1190" y="330" width="330" height="265" rx="26" fill="#261f37" stroke="#ad7bff" stroke-width="2"/>
  </g>
  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="110" y="378" fill="#8ca8ff" font-size="20" font-weight="700">稳定改进器</text>
    <text x="110" y="421" fill="#ffffff" font-size="34" font-weight="700">Meta-Harness φg</text>
    <text x="110" y="463" fill="#d8e3f5" font-size="19">读取历史 Optimization Episode</text>
    <text x="110" y="494" fill="#d8e3f5" font-size="19">提出诊断、搜索、预算、拓扑 Diff</text>
    <rect x="108" y="525" width="270" height="43" rx="12" fill="#0c1425"/>
    <text x="130" y="553" fill="#a9bfff" font-size="18">只生成候选，不批准自己</text>

    <text x="500" y="378" fill="#67dfbd" font-size="20" font-weight="700">隐藏任务上的内层优化实验 · 多 Trial / 多 Seed</text>
    <rect x="510" y="410" width="155" height="62" rx="14" fill="#0c1d22" stroke="#4aa994"/>
    <text x="548" y="448" fill="#ffffff" font-size="21">能力 θ0</text>
    <rect x="720" y="410" width="175" height="62" rx="14" fill="#0c1d22" stroke="#4aa994"/>
    <text x="753" y="448" fill="#ffffff" font-size="21">候选 θ′</text>
    <rect x="950" y="410" width="145" height="62" rx="14" fill="#0c1d22" stroke="#4aa994"/>
    <text x="990" y="448" fill="#ffffff" font-size="21">赢家 θ*</text>
    <path d="M665 441H708" stroke="#67dfbd" stroke-width="4" marker-end="url(#ag)"/>
    <path d="M895 441H938" stroke="#67dfbd" stroke-width="4" marker-end="url(#ag)"/>
    <text x="530" y="515" fill="#cbe8e1" font-size="18">Trace → Evidence → 假设 → 最小 Diff → Eval → keep / discard</text>
    <text x="530" y="550" fill="#cbe8e1" font-size="18">每次实验产出完整 Episode：结果、成本、失败、回归和血缘</text>

    <text x="1220" y="378" fill="#c5a8ff" font-size="20" font-weight="700">候选改进器</text>
    <text x="1220" y="421" fill="#ffffff" font-size="34" font-weight="700">Meta-Harness φg+1</text>
    <text x="1220" y="463" fill="#e5dcf6" font-size="19">可修改：证据选择、归因方法</text>
    <text x="1220" y="494" fill="#e5dcf6" font-size="19">搜索策略、Trial 预算、控制拓扑</text>
    <rect x="1218" y="525" width="270" height="43" rx="12" fill="#171125"/>
    <text x="1251" y="553" fill="#d1baff" font-size="18">不能触碰真值平面</text>
  </g>
  <path d="M410 462H452" stroke="#8ca8ff" stroke-width="5" marker-end="url(#a2)"/>
  <path d="M1135 462H1178" stroke="#8ca8ff" stroke-width="5" marker-end="url(#a2)"/>

  <rect x="80" y="655" width="1440" height="200" rx="26" fill="#0b1422" stroke="#455974" stroke-width="2"/>
  <text x="112" y="702" fill="#ffffff" font-family="Inter, PingFang SC, sans-serif" font-size="25" font-weight="700">独立 Meta-Evaluation：比较的不是“谁改出一个高分答案”，而是谁在固定预算下更会制造改进</text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="112" y="735" width="246" height="82" rx="16" fill="#152238"/><text x="137" y="770" fill="#8db0ff" font-size="18" font-weight="700">改进产出 Y</text><text x="137" y="797" fill="#d8e3f5" font-size="17">任务效用增量 / 单位预算</text>
    <rect x="382" y="735" width="246" height="82" rx="16" fill="#152238"/><text x="407" y="770" fill="#8db0ff" font-size="18" font-weight="700">跨任务泛化</text><text x="407" y="797" fill="#d8e3f5" font-size="17">异构 Holdout 与时间外任务</text>
    <rect x="652" y="735" width="246" height="82" rx="16" fill="#152238"/><text x="677" y="770" fill="#8db0ff" font-size="18" font-weight="700">旧能力留存</text><text x="677" y="797" fill="#d8e3f5" font-size="17">回归、长尾与最坏切片</text>
    <rect x="922" y="735" width="246" height="82" rx="16" fill="#152238"/><text x="947" y="770" fill="#8db0ff" font-size="18" font-weight="700">复杂度与风险</text><text x="947" y="797" fill="#d8e3f5" font-size="17">维护成本、攻击面、作弊率</text>
    <rect x="1192" y="735" width="296" height="82" rx="16" fill="url(#candidate)"/><text x="1220" y="770" fill="#0c1020" font-size="18" font-weight="700">点火判定</text><text x="1220" y="797" fill="#111629" font-size="17">多代显著提升 → Canary；否则回滚</text>
  </g>
  <path d="M1370 855 C1370 920 260 930 245 606" fill="none" stroke="#ad7bff" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#a2)"/>
  <text x="550" y="925" fill="#c5b1ef" font-family="Inter, PingFang SC, sans-serif" font-size="18">晋级后的 φg+1 进入下一代，但每一代仍面对同一外部裁判；递归的是候选生成能力，不是治理权。</text>
</svg>
