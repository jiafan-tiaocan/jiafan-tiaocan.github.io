<svg xmlns="http://www.w3.org/2000/svg" width="148.1667mm" height="126.4708mm" viewBox="0 0 560 478" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Agent 的知识读取、记忆读取与记忆写入</title>
<desc id="figure-desc">时序图自上而下：Agent 向知识检索服务查询 P1、来源和计算入口；向记忆管理逻辑请求历史经历，后者读取存储 M 并返回 M1。Agent 读取本轮交易数据 D1，执行并核验净收入 280，得到运行依据 T1，再提交记忆 M2，由记忆管理逻辑按策略检查后写入存储。蓝色实线为读取请求、蓝色虚线为返回，橙色为写入请求。没有对知识检索服务的写入。所有版本标识为教学设定。</desc>
