<svg xmlns="http://www.w3.org/2000/svg" width="560" height="468" viewBox="0 0 560 468" role="img" aria-labelledby="title desc">
<title id="title">用 9 月线上净收入 280 元的教学案例解释六种知识职责</title>
<desc id="desc">教学政策 P1 将符合条件的退款按发生月扣减。知识管理复核该口径，本体区分退款发生月与业务归属月。OKF 用 metrics/net-revenue.md 链接政策与计算文件，图谱记录退款 R 关联订单 B 的关系。检索取齐口径、计算入口和表定义；Agent 读取数据、执行并核验 100 加 200 减 20 得 280，取消订单的 50 元不计。记忆保留范围、政策及执行依据供下次按需召回。虚线表示可选语义约束，并非必须部署的流水线；旧结果不能替代下次的口径与数据核验。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f6657"/></marker></defs>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect width="560" height="468" rx="14" fill="#f7f5ef"/><text x="20" y="28" text-anchor="start" font-size="18" font-weight="600" fill="#243c36">9 月线上净收入：同一案例，六种职责</text><rect x="8" y="42" width="544" height="418" rx="10" fill="none" stroke="#93ad9c"/><text x="22" y="66" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">知识管理｜复核 P1：退款按发生月扣减</text><rect x="24" y="82" width="512" height="54" rx="8" fill="#e8f1ea" stroke="#bdcfc3"/><text x="36" y="103" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">本体｜先定义对象与关系</text><text x="36" y="124" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">退款事件关联订单；退款发生月与业务归属月是不同属性</text><path d="M139 136V152" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="4 3"/><path d="M421 136V152" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="4 3"/><rect x="24" y="154" width="230" height="98" rx="8" fill="#fff" stroke="#bdcfc3"/><text x="36" y="176" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">OKF｜交付知识文件</text><text x="36" y="197" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">metrics/net-revenue.md</text><text x="36" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">链接政策 P1 与计算文件</text><text x="36" y="239" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">保存口径、来源、复核记录</text><rect x="306" y="154" width="230" height="98" rx="8" fill="#fff" stroke="#bdcfc3"/><text x="318" y="176" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">知识图谱｜连接具体对象</text><text x="318" y="197" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">退款 R：20 元，confirmed</text><path d="M328 202V225" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/><text x="340" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">关联订单</text><text x="318" y="242" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">订单 B：200 元，paid，线上</text><path d="M139 252V277" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M421 252V277" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/><text x="280" y="270" text-anchor="middle" font-size="14" font-weight="400" fill="#53695f">读取定义与关系</text><rect x="24" y="279" width="512" height="58" rx="8" fill="#e8f1ea" stroke="#bdcfc3"/><text x="36" y="301" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">知识检索｜问题：9 月线上净收入？</text><text x="36" y="324" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">取齐：P1 口径、计算入口、订单与退款表定义</text><path d="M139 337V370" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/><text x="157" y="359" text-anchor="start" font-size="14" font-weight="400" fill="#53695f">本轮依据</text><path d="M449 370V339" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/><text x="466" y="359" text-anchor="start" font-size="14" font-weight="400" fill="#53695f">下次召回</text><rect x="24" y="372" width="232" height="78" rx="8" fill="#fff" stroke="#bdcfc3"/><text x="36" y="394" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">Agent｜读取数据并执行</text><text x="36" y="416" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">核验：100 + 200 − 20 = 280</text><text x="36" y="438" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">取消 50 不计；结果附执行依据</text><rect x="322" y="372" width="214" height="78" rx="8" fill="#fbefe6" stroke="#bdcfc3"/><text x="334" y="394" text-anchor="start" font-size="16" font-weight="600" fill="#243c36">记忆系统｜保留这次经历</text><text x="334" y="416" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">记住：9 月线上 280 元</text><text x="334" y="438" text-anchor="start" font-size="14" font-weight="400" fill="#243c36">连同 P1 与本次执行依据</text><text x="289" y="398" text-anchor="middle" font-size="14" font-weight="400" fill="#243c36">写入</text><path d="M258 416H320" fill="none" stroke="#2f6657" stroke-width="1.7" marker-end="url(#arrow)"/></g>
</svg>