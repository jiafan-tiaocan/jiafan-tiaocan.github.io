="url(#arrow)"/><rect x="32" y="269" width="496" height="58" rx="9" fill="#e8f1ea" stroke="#bdcfc3"/><text x="280.0" y="296" text-anchor="middle" font-size="19" font-weight="600" fill="#243c36">知识检索</text><text x="280.0" y="318" text-anchor="middle" font-size="14" font-weight="400" fill="#53695f">围绕当前问题选取证据</text><path d="M127 327V379" fill="none" stroke="#2f6657" stroke-width="1.8" marker-end="url(#arrow)"/><text x="179" y="355" text-anchor="middle" font-size="14" font-weight="400" fill="#243c36">本轮证据</text><path d="M427 374V328" fill="none" stroke="#2f6657" stroke-width="1.8" marker-end="url(#arrow)"/><text x="477" y="355" text-anchor="middle" font-size="14" font-weight="400" fill="#243c36">召回经验</text><rect x="32" y="381" width="190" height="54" rx="9" fill="#fff" stroke="#bdcfc3"/><text x="127.0" y="414.0" text-anchor="middle" font-size="19" font-weight="600" fill="#243c36">Agent 当前任务</text><rect x="324" y="376" width="204" height="66" rx="9" fill="#fbefe6" stroke="#bdcfc3"/><text x="426.0" y="403" text-anchor="middle" font-size="19" font-weight="600" fill="#243c36">Agent 记忆系统</text><text x="426.0" y="425" text-anchor="middle" font-size="14" font-weight="400" fill="#53695f">状态、事实与经历</text><text x="273" y="396" text-anchor="middle" font-size="14" font-weight="400" fill="#243c36">记录经历</text><path d="M223 413H322" fill="none" stroke="#2f6657" stroke-width="1.8" marker-end="url(#arrow)"/></g>
