<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">预训练、SFT、强化学习与运行时证据的分工</title>
  <desc id="desc">预训练从海量语料建立知识和潜在能力，SFT用专家答案建立行为协议，强化学习依据结果重排模型自己的轨迹；搜索、RAG、工具和独立验证器提供参数外的当前证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#111A2D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="55" y="62" fill="#F8FAFC" font-size="34" font-weight="700">可靠回答不是一次训练得到的：四层各解一个问题</text>
    <text x="55" y="102" fill="#94A3B8" font-size="18">能力从哪里来？默认怎样做？哪些策略更值得重复？回答时依据什么事实？</text>

    <path d="M455 399 L492 399" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M900 399 L937 399" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="55" y="145" width="400" height="530" rx="24" fill="#101B30" stroke="#315F96"/>
      <rect x="500" y="145" width="400" height="530" rx="24" fill="#1A182D" stroke="#6654A6"/>
      <rect x="945" y="145" width="400" height="530" rx="24" fill="#0F2422" stroke="#2D746A"/>
    </g>
    <rect x="55" y="145" width="400" height="9" rx="5" fill="#60A5FA"/>
    <rect x="500" y="145" width="400" height="9" rx="5" fill="#A78BFA"/>
    <rect x="945" y="145" width="400" height="9" rx="5" fill="#2DD4BF"/>

    <!-- Pretraining card -->
    <text x="85" y="201" fill="#93C5FD" font-size="24" font-weight="700">1 · 预训练：建立能力</text>
    <text x="85" y="232" fill="#AFC0D5" font-size="15">海量原始 Token · next-token prediction</text>
    <g fill="none" stroke="#60A5FA" stroke-width="2.5">
      <path d="M102 292 C136 253 176 329 210 286 S282 251 321 292 S383 326 410 281"/>
      <path d="M102 320 C137 357 176 281 211 324 S282 360 321 318 S382 284 410 327" opacity="0.55"/>
    </g>
    <g fill="#172554" stroke="#60A5FA" stroke-width="2">
      <circle cx="102" cy="292" r="11"/><circle cx="158" cy="282" r="11"/><circle cx="211" cy="306" r="11"/>
      <circle cx="267" cy="287" r="11"/><circle cx="321" cy="307" r="11"/><circle cx="377" cy="297" r="11"/>
    </g>
    <text x="85" y="382" fill="#E2E8F0" font-size="16" font-weight="700">主要得到</text>
    <text fill="#B9C7D8" font-size="15">
      <tspan x="85" y="417">知识覆盖、语言表示、代码模式</tspan>
      <tspan x="85" y="447">数学与推理的潜在算法</tspan>
      <tspan x="85" y="477">上下文学习与长结构续写能力</tspan>
    </text>
    <rect x="82" y="531" width="346" height="103" rx="15" fill="#111827" stroke="#334155"/>
    <text x="102" y="560" fill="#FBBF24" font-size="14" font-weight="700">盲点</text>
    <text fill="#AFC0D5" font-size="14">
      <tspan x="102" y="587">“像语料”不等于“在现实中为真”</tspan>
      <tspan x="102" y="612">过时、冲突和缺失证据仍会导致幻觉</tspan>
    </text>

    <!-- SFT card -->
    <text x="530" y="201" fill="#C4B5FD" font-size="24" font-weight="700">2 · SFT：建立行为协议</text>
    <text x="530" y="232" fill="#AFC0D5" font-size="15">专家 (x, y*) · 逐 Token 交叉熵</text>
    <g>
      <path d="M548 307 C595 279 621 329 665 297 S744 274 789 304 S837 302 861 286" fill="none" stroke="#A78BFA" stroke-width="4"/>
      <g fill="#2E1065" stroke="#A78BFA" stroke-width="2.5">
        <circle cx="548" cy="307" r="15"/><circle cx="625" cy="308" r="15"/><circle cx="704" cy="291" r="15"/>
        <circle cx="783" cy="300" r="15"/><circle cx="861" cy="286" r="15"/>
      </g>
      <g fill="#F5F3FF" font-size="11" text-anchor="middle">
        <text x="548" y="311">x</text><text x="625" y="312">y*₁</text><text x="704" y="295">y*₂</text>
        <text x="783" y="304">y*₃</text><text x="861" y="290">EOS</text>
      </g>
    </g>
    <text x="530" y="382" fill="#E2E8F0" font-size="16" font-weight="700">主要得到</text>
    <text fill="#B9C7D8" font-size="15">
      <tspan x="530" y="417">回答格式、工具接口、清晰步骤</tspan>
      <tspan x="530" y="447">引用、拒答与不确定性表达</tspan>
      <tspan x="530" y="477">可读、稳定的冷启动策略</tspan>
    </text>
    <rect x="527" y="531" width="346" height="103" rx="15" fill="#111827" stroke="#334155"/>
    <text x="547" y="560" fill="#FBBF24" font-size="14" font-weight="700">盲点</text>
    <text fill="#AFC0D5" font-size="14">
      <tspan x="547" y="587">teacher forcing 总站在专家前缀上</tspan>
      <tspan x="547" y="612">不自然覆盖模型自己的错误状态</tspan>
    </text>

    <!-- RL card -->
    <text x="975" y="201" fill="#5EEAD4" font-size="24" font-weight="700">3 · RL：按结果重排策略</text>
    <text x="975" y="232" fill="#AFC0D5" font-size="15">自身 rollout · reward / verifier / 环境</text>
    <g fill="none" stroke-width="3">
      <path d="M995 310 C1044 310 1054 258 1104 258" stroke="#2DD4BF"/>
      <path d="M995 310 C1044 310 1054 310 1104 310" stroke="#FB7185"/>
      <path d="M995 310 C1044 310 1054 362 1104 362" stroke="#FB7185"/>
      <path d="M1134 258 L1272 258" stroke="#2DD4BF" marker-end="url(#arrow)"/>
      <path d="M1134 310 L1272 310" stroke="#FB7185" opacity="0.65"/>
      <path d="M1134 362 L1272 362" stroke="#FB7185" opacity="0.65"/>
    </g>
    <circle cx="995" cy="310" r="16" fill="#134E4A" stroke="#2DD4BF" stroke-width="2.5"/>
    <g fill="#134E4A" stroke="#2DD4BF" stroke-width="2.5"><circle cx="1119" cy="258" r="14"/><circle cx="1286" cy="258" r="16"/></g>
    <g fill="#4C1D2D" stroke="#FB7185" stroke-width="2.5"><circle cx="1119" cy="310" r="14"/><circle cx="1119" cy="362" r="14"/><circle cx="1286" cy="310" r="16"/><circle cx="1286" cy="362" r="16"/></g>
    <text x="1286" y="263" text-anchor="middle" fill="#ECFDF5" font-size="12">+1</text>
    <text x="1286" y="315" text-anchor="middle" fill="#FFE4E6" font-size="12">0</text>
    <text x="1286" y="367" text-anchor="middle" fill="#FFE4E6" font-size="12">0</text>
    <text x="975" y="382" fill="#E2E8F0" font-size="16" font-weight="700">主要得到</text>
    <text fill="#B9C7D8" font-size="15">
      <tspan x="975" y="417">有效路线、自检、回退与重试</tspan>
      <tspan x="975" y="447">在自身状态中利用成功与失败</tspan>
      <tspan x="975" y="477">对不可微结果做概率重排</tspan>
    </text>
    <rect x="972" y="531" width="346" height="103" rx="15" fill="#111827" stroke="#334155"/>
    <text x="992" y="560" fill="#FBBF24" font-size="14" font-weight="700">盲点</text>
    <text fill="#AFC0D5" font-size="14">
      <tspan x="992" y="587">reward 看不见的错误就很难优化</tspan>
      <tspan x="992" y="612">评分器有漏洞时会出现 reward hacking</tspan>
    </text>

    <!-- Runtime evidence band -->
    <rect x="55" y="718" width="1290" height="132" rx="24" fill="#171F2D" stroke="#60738C"/>
    <text x="85" y="760" fill="#F8FAFC" font-size="22" font-weight="700">4 · 运行时证据：回答这一刻，依据什么判断真假？</text>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="85" y="785" width="150" height="42" rx="14" fill="#132A3A" stroke="#38BDF8"/><text x="160" y="812" fill="#BAE6FD">搜索 / RAG</text>
      <rect x="255" y="785" width="150" height="42" rx="14" fill="#132A3A" stroke="#38BDF8"/><text x="330" y="812" fill="#BAE6FD">数据库</text>
      <rect x="425" y="785" width="150" height="42" rx="14" fill="#1D273A" stroke="#818CF8"/><text x="500" y="812" fill="#C7D2FE">代码 / 工具</text>
      <rect x="595" y="785" width="150" height="42" rx="14" fill="#1D273A" stroke="#818CF8"/><text x="670" y="812" fill="#C7D2FE">结构化记忆</text>
      <rect x="765" y="785" width="185" height="42" rx="14" fill="#142D29" stroke="#2DD4BF"/><text x="857" y="812" fill="#99F6E4">独立 verifier</text>
    </g>
    <text x="985" y="802" fill="#FDE68A" font-size="15" font-weight="700">参数训练不能替代当前证据</text>
    <text x="985" y="827" fill="#AFC0D5" font-size="14">事实会变化，外部状态必须在运行时读取并核验。</text>
  </g>
</svg>
