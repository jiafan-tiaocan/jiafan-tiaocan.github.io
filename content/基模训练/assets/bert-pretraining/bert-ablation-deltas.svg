<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BERT 预训练目标消融的性能下降</title>
  <desc id="desc">五个下游任务上，去掉 NSP 相对完整 BERT 的性能下降，以及在都不使用 NSP 时把双向 MLM 改为从左到右语言模型的性能下降。后者在 MRPC 和 SQuAD 上降幅最大。</desc>
  <rect width="1200" height="720" fill="#0B1220"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="64" y="58" fill="#E6EDF7" font-size="30" font-weight="700">预训练目标消融：双向 MLM 的价值集中在哪些任务</text>
    <text x="64" y="91" fill="#9FB0C6" font-size="17">BERT-Base，Dev；条长表示相对基线下降的百分点，来源为论文 Table 5</text>

    <rect x="350" y="102" width="18" height="18" rx="4" fill="#F6C85F"/>
    <text x="379" y="117" fill="#C9D6E5" font-size="16">去掉 NSP（相对完整 BERT）</text>
    <rect x="730" y="102" width="18" height="18" rx="4" fill="#46D9E8"/>
    <text x="759" y="117" fill="#C9D6E5" font-size="16">LTR 替代 MLM（两者均无 NSP）</text>

    <g stroke="#31445F" stroke-width="1">
      <line x1="350" y1="135" x2="350" y2="630"/>
      <line x1="495" y1="135" x2="495" y2="630" stroke-dasharray="5 7"/>
      <line x1="640" y1="135" x2="640" y2="630" stroke-dasharray="5 7"/>
      <line x1="785" y1="135" x2="785" y2="630" stroke-dasharray="5 7"/>
      <line x1="930" y1="135" x2="930" y2="630" stroke-dasharray="5 7"/>
      <line x1="1075" y1="135" x2="1075" y2="630" stroke-dasharray="5 7"/>
      <line x1="64" y1="227" x2="1125" y2="227"/>
      <line x1="64" y1="327" x2="1125" y2="327"/>
      <line x1="64" y1="427" x2="1125" y2="427"/>
      <line x1="64" y1="527" x2="1125" y2="527"/>
      <line x1="64" y1="627" x2="1125" y2="627"/>
    </g>

    <g fill="#9FB0C6" font-size="15" text-anchor="middle">
      <text x="350" y="656">0</text>
      <text x="495" y="656">2.5</text>
      <text x="640" y="656">5.0</text>
      <text x="785" y="656">7.5</text>
      <text x="930" y="656">10.0</text>
      <text x="1075" y="656">12.5</text>
      <text x="712" y="692" font-size="17">性能下降（百分点）</text>
    </g>

    <g fill="#E6EDF7" font-size="21" font-weight="650">
      <text x="64" y="178">MNLI-m</text>
      <text x="64" y="278">QNLI</text>
      <text x="64" y="378">MRPC</text>
      <text x="64" y="478">SST-2</text>
      <text x="64" y="578">SQuAD</text>
    </g>
    <g fill="#9FB0C6" font-size="14">
      <text x="174" y="178">Acc</text>
      <text x="174" y="278">Acc</text>
      <text x="174" y="378">Acc</text>
      <text x="174" y="478">Acc</text>
      <text x="174" y="578">F1</text>
    </g>

    <g>
      <rect x="350" y="148" width="29" height="22" rx="5" fill="#F6C85F"/>
      <rect x="350" y="181" width="104" height="22" rx="5" fill="#46D9E8"/>
      <text x="390" y="165" fill="#F9E6A2" font-size="16">-0.5</text>
      <text x="464" y="198" fill="#9EF0F6" font-size="16">-1.8</text>

      <rect x="350" y="248" width="203" height="22" rx="5" fill="#F6C85F"/>
      <rect x="350" y="281" width="35" height="22" rx="5" fill="#46D9E8"/>
      <text x="563" y="265" fill="#F9E6A2" font-size="16">-3.5</text>
      <text x="395" y="298" fill="#9EF0F6" font-size="16">-0.6</text>

      <rect x="350" y="348" width="12" height="22" rx="5" fill="#F6C85F"/>
      <rect x="350" y="381" width="522" height="22" rx="5" fill="#46D9E8"/>
      <text x="372" y="365" fill="#F9E6A2" font-size="16">-0.2</text>
      <text x="882" y="398" fill="#9EF0F6" font-size="16">-9.0</text>

      <rect x="350" y="448" width="6" height="22" rx="3" fill="#F6C85F"/>
      <rect x="350" y="481" width="29" height="22" rx="5" fill="#46D9E8"/>
      <text x="366" y="465" fill="#F9E6A2" font-size="16">-0.1</text>
      <text x="389" y="498" fill="#9EF0F6" font-size="16">-0.5</text>

      <rect x="350" y="548" width="35" height="22" rx="5" fill="#F6C85F"/>
      <rect x="350" y="581" width="586" height="22" rx="5" fill="#46D9E8"/>
      <text x="395" y="565" fill="#F9E6A2" font-size="16">-0.6</text>
      <text x="946" y="598" fill="#9EF0F6" font-size="16">-10.1</text>
    </g>

    <rect x="965" y="342" width="160" height="90" rx="12" fill="#111C2E" stroke="#31445F"/>
    <text x="985" y="370" fill="#5DD39E" font-size="16" font-weight="700">读图结论</text>
    <text x="985" y="395" fill="#C9D6E5" font-size="15">单向约束首先伤害</text>
    <text x="985" y="417" fill="#C9D6E5" font-size="15">细粒度 token/span 任务</text>
  </g>
</svg>
