<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">语言模型逐 Token 生成与终局奖励</title>
  <desc id="desc">提示词和已生成前缀构成当前状态，每个新 Token 是一次动作，完整回答结束后获得一个终局奖励。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#101A2D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5EEAD4"/>
    </marker>
    <marker id="reward-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="60" y="62" fill="#F8FAFC" font-size="31" font-weight="700">一段回答如何变成一条强化学习轨迹</text>
    <text x="60" y="98" fill="#94A3B8" font-size="17">每生成一个 Token，前缀就变成下一状态；完整回答结束后才获得结果分数</text>

    <g filter="url(#shadow)">
      <rect x="55" y="158" width="235" height="150" rx="20" fill="#111D31" stroke="#365073" stroke-width="2"/>
      <rect x="350" y="158" width="235" height="150" rx="20" fill="#111D31" stroke="#365073" stroke-width="2"/>
      <rect x="645" y="158" width="235" height="150" rx="20" fill="#111D31" stroke="#365073" stroke-width="2"/>
      <rect x="940" y="158" width="205" height="150" rx="20" fill="#17202E" stroke="#8A6B22" stroke-width="2"/>
    </g>

    <g text-anchor="middle">
      <text x="172" y="194" fill="#93C5FD" font-size="15" font-weight="700">起始状态</text>
      <text x="467" y="194" fill="#93C5FD" font-size="15" font-weight="700">下一状态</text>
      <text x="762" y="194" fill="#93C5FD" font-size="15" font-weight="700">继续生成</text>
      <text x="1042" y="194" fill="#FDE68A" font-size="15" font-weight="700">回答结束</text>

      <text x="172" y="239" fill="#F8FAFC" font-size="24" font-weight="700">提示词 x</text>
      <text x="467" y="239" fill="#F8FAFC" font-size="24" font-weight="700">x + y₁</text>
      <text x="762" y="239" fill="#F8FAFC" font-size="24" font-weight="700">x + y₁ + y₂</text>
      <text x="1042" y="239" fill="#F8FAFC" font-size="24" font-weight="700">完整回答 y</text>

      <text x="172" y="277" fill="#94A3B8" font-size="14">只看到用户问题</text>
      <text x="467" y="277" fill="#94A3B8" font-size="14">拼入第一个 Token</text>
      <text x="762" y="277" fill="#94A3B8" font-size="14">前缀继续增长</text>
      <text x="1042" y="277" fill="#FBBF24" font-size="14" font-weight="700">生成 EOS</text>
    </g>

    <g stroke="#5EEAD4" stroke-width="3" marker-end="url(#arrow)">
      <line x1="290" y1="232" x2="340" y2="232"/>
      <line x1="585" y1="232" x2="635" y2="232"/>
      <line x1="880" y1="232" x2="930" y2="232"/>
    </g>

    <g text-anchor="middle" font-size="14" font-weight="700" fill="#99F6E4">
      <text x="315" y="211">动作：选 y₁</text>
      <text x="610" y="211">动作：选 y₂</text>
      <text x="905" y="211">继续至 EOS</text>
    </g>

    <rect x="310" y="382" width="580" height="105" rx="22" fill="#2A2412" stroke="#8A6B22" stroke-width="2"/>
    <text x="600" y="422" text-anchor="middle" fill="#FDE68A" font-size="17" font-weight="700">完整回答结束后，才得到终局奖励</text>
    <text x="600" y="459" text-anchor="middle" fill="#F8FAFC" font-size="25" font-weight="700">R(x, y)：这段回答最终有多好？</text>

    <path d="M1042 320 C1042 350 880 353 858 382" fill="none" stroke="#FBBF24" stroke-width="3" marker-end="url(#reward-arrow)"/>
    <path d="M342 435 C250 435 171 385 171 320" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#reward-arrow)"/>
    <text x="171" y="510" fill="#FDE68A" font-size="15" font-weight="700">训练难点：这一个结果，应该怎样影响前面每次 Token 选择？</text>
    <text x="1128" y="535" text-anchor="end" fill="#64748B" font-size="12">示意图：真实 Token 切分由 tokenizer 决定</text>
  </g>
</svg>
