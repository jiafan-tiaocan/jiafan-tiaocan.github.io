<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">持续学习的技术演进与系统收敛路线</title>
  <desc id="desc">从灾难性遗忘问题、经典保留机制、真实协议与可塑性，到大模型和智能体系统级持续学习的四阶段路线图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#151d32"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8da2c7"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif}
      .title{font-size:36px;font-weight:750;fill:#f8fafc}
      .sub{font-size:18px;fill:#a9b7d0}
      .phase{font-size:18px;font-weight:700;letter-spacing:.7px}
      .head{font-size:25px;font-weight:720;fill:#f8fafc}
      .body{font-size:17px;fill:#d6deed}
      .small{font-size:15px;fill:#aebbd1}
      .flow{font-size:17px;font-weight:650;fill:#eef2ff}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="sans title">持续学习不是一种算法，而是一条逐步扩大的问题链</text>
  <text x="70" y="108" class="sans sub">研究对象从“别忘掉旧任务”，扩展到“长期保持可学习、跨阶段迁移，并让系统更新可验证、可回滚”</text>

  <g filter="url(#shadow)">
    <rect x="65" y="165" width="292" height="350" rx="22" fill="#18243c" stroke="#5978a8"/>
    <rect x="388" y="165" width="292" height="350" rx="22" fill="#1a263d" stroke="#6d63b5"/>
    <rect x="711" y="165" width="292" height="350" rx="22" fill="#182b3a" stroke="#3b9a91"/>
    <rect x="1034" y="165" width="302" height="350" rx="22" fill="#2b2337" stroke="#c1778e"/>
  </g>

  <text x="91" y="202" class="sans phase" fill="#83b4ff">阶段一 · 问题被看见</text>
  <text x="91" y="244" class="sans head">顺序学习会互相干扰</text>
  <text x="91" y="284" class="sans body">新数据的梯度覆盖旧解</text>
  <text x="91" y="314" class="sans body">灾难性遗忘暴露出</text>
  <text x="91" y="344" class="sans body">稳定性—可塑性矛盾</text>
  <line x1="91" y1="386" x2="331" y2="386" stroke="#344762"/>
  <text x="91" y="422" class="sans small">旧范式：一次训练 → 固定部署</text>
  <text x="91" y="449" class="sans small">新问题：数据流永远不结束</text>

  <text x="414" y="202" class="sans phase" fill="#a99df5">阶段二 · 三类经典答案</text>
  <text x="414" y="244" class="sans head">保数据、保参数、加容量</text>
  <text x="414" y="284" class="sans body">回放：重现过去分布</text>
  <text x="414" y="314" class="sans body">正则：限制重要参数移动</text>
  <text x="414" y="344" class="sans body">隔离：为新任务分配空间</text>
  <line x1="414" y1="386" x2="654" y2="386" stroke="#413b65"/>
  <text x="414" y="422" class="sans small">代价没有消失，只是在</text>
  <text x="414" y="449" class="sans small">存储、算力、容量间转移</text>

  <text x="737" y="202" class="sans phase" fill="#62d4c7">阶段三 · 问题重新定义</text>
  <text x="737" y="244" class="sans head">协议与可塑性同样重要</text>
  <text x="737" y="284" class="sans body">Task / Domain / Class-IL</text>
  <text x="737" y="314" class="sans body">任务边界可能不可见</text>
  <text x="737" y="344" class="sans body">模型还会逐渐“学不动”</text>
  <line x1="737" y1="386" x2="977" y2="386" stroke="#315652"/>
  <text x="737" y="422" class="sans small">只报最终准确率不够：</text>
  <text x="737" y="449" class="sans small">还要测遗忘、迁移与学习速度</text>

  <text x="1060" y="202" class="sans phase" fill="#f0a2b8">阶段四 · LLM 与 Agent</text>
  <text x="1060" y="244" class="sans head">持续学习成为系统属性</text>
  <text x="1060" y="284" class="sans body">预训练、指令、对齐会互扰</text>
  <text x="1060" y="314" class="sans body">记忆、技能、适配器、权重</text>
  <text x="1060" y="344" class="sans body">构成多速度更新层</text>
  <line x1="1060" y1="386" x2="1310" y2="386" stroke="#624353"/>
  <text x="1060" y="422" class="sans small">难点从“学新任务”扩大到</text>
  <text x="1060" y="449" class="sans small">归因、治理、发布与回滚</text>

  <path d="M357 340 H380" stroke="#8da2c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M680 340 H703" stroke="#8da2c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1003 340 H1026" stroke="#8da2c7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="65" y="565" width="1271" height="183" rx="24" fill="#0e1729" stroke="#3b4d6d"/>
  <text x="91" y="608" class="sans phase" fill="#f5c36a">工程上的收敛：把“学会”改写成一个受控闭环</text>
  <g class="sans flow">
    <rect x="91" y="641" width="165" height="61" rx="15" fill="#20304c"/>
    <text x="173.5" y="679" text-anchor="middle">经验进入</text>
    <rect x="299" y="641" width="190" height="61" rx="15" fill="#25304d"/>
    <text x="394" y="679" text-anchor="middle">筛选与归因</text>
    <rect x="532" y="641" width="224" height="61" rx="15" fill="#203b45"/>
    <text x="644" y="668" text-anchor="middle">选择更新位置</text>
    <text x="644" y="690" text-anchor="middle" class="small">记忆 / 技能 / 参数</text>
    <rect x="799" y="641" width="210" height="61" rx="15" fill="#3c304b"/>
    <text x="904" y="668" text-anchor="middle">新旧能力 + 安全</text>
    <text x="904" y="690" text-anchor="middle" class="small">联合评测</text>
    <rect x="1052" y="641" width="254" height="61" rx="15" fill="#4a303c"/>
    <text x="1179" y="668" text-anchor="middle">影子发布 / 灰度</text>
    <text x="1179" y="690" text-anchor="middle" class="small">通过则晋级，失败即回滚</text>
  </g>
  <g stroke="#8da2c7" stroke-width="3" marker-end="url(#arrow)">
    <path d="M256 671 H291"/>
    <path d="M489 671 H524"/>
    <path d="M756 671 H791"/>
    <path d="M1009 671 H1044"/>
  </g>
  <text x="1333" y="790" text-anchor="end" class="sans small">作者绘制 · 更新截至 2026-07-27</text>
</svg>
