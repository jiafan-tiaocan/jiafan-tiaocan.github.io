<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">生产级持续学习闭环</title>
  <desc id="desc">经验从生产环境进入证据账本，经过归因和三种速度的更新路径，形成候选版本，再经保留、安全、隐私与成本门禁后灰度发布或回滚。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="s2" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#6b7280" flood-opacity=".2"/>
    </filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#536a88"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif}
      .title{font-size:36px;font-weight:760;fill:#142033}
      .sub{font-size:18px;fill:#52637a}
      .head{font-size:22px;font-weight:730;fill:#172033}
      .body{font-size:17px;fill:#37465c}
      .small{font-size:15px;fill:#5e6d81}
      .label{font-size:17px;font-weight:680;fill:#1a2638}
      .onDark{fill:#ffffff}
    </style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg2)"/>
  <text x="70" y="72" class="sans title">生产级持续学习：更新对象可以不同，证据门禁不能省</text>
  <text x="70" y="108" class="sans sub">同一条经验先进入可追溯账本，再按风险选择快、中、慢三条更新路径；任何路径都不直接写入生产系统</text>

  <g filter="url(#s2)">
    <rect x="65" y="166" width="210" height="168" rx="22" fill="#ffffff" stroke="#95a8bf"/>
    <rect x="328" y="166" width="246" height="168" rx="22" fill="#ffffff" stroke="#648ab7"/>
    <rect x="635" y="144" width="347" height="376" rx="24" fill="#f6f2ff" stroke="#8d79c8"/>
    <rect x="1042" y="166" width="292" height="168" rx="22" fill="#ffffff" stroke="#9b7ab0"/>
  </g>

  <text x="170" y="207" text-anchor="middle" class="sans head">生产经验流</text>
  <text x="91" y="246" class="sans body">• 用户反馈与纠错</text>
  <text x="91" y="275" class="sans body">• 工具执行结果</text>
  <text x="91" y="304" class="sans body">• 环境变化与失败</text>

  <text x="451" y="207" text-anchor="middle" class="sans head">证据账本</text>
  <text x="354" y="246" class="sans body">去敏、去重、可信度</text>
  <text x="354" y="275" class="sans body">任务与版本归因</text>
  <text x="354" y="304" class="sans body">保留原始证据和撤销键</text>

  <text x="808.5" y="184" text-anchor="middle" class="sans head">按速度与风险选择更新位置</text>
  <rect x="675" y="218" width="267" height="77" rx="16" fill="#e8f5f2" stroke="#5aa292"/>
  <text x="695" y="248" class="sans label">快路径 · 分钟到小时</text>
  <text x="695" y="275" class="sans body">外部记忆、检索索引、技能库</text>
  <rect x="675" y="315" width="267" height="77" rx="16" fill="#eef2ff" stroke="#7388c8"/>
  <text x="695" y="345" class="sans label">中路径 · 小时到天</text>
  <text x="695" y="372" class="sans body">提示策略、路由器、Adapter</text>
  <rect x="675" y="412" width="267" height="77" rx="16" fill="#fff1ed" stroke="#d4836a"/>
  <text x="695" y="442" class="sans label">慢路径 · 天到版本周期</text>
  <text x="695" y="469" class="sans body">回放数据、全量或持续训练</text>

  <text x="1188" y="207" text-anchor="middle" class="sans head">候选学习版本</text>
  <text x="1068" y="246" class="sans body">模型 + 记忆 + 技能</text>
  <text x="1068" y="275" class="sans body">数据、代码、配置同版本</text>
  <text x="1068" y="304" class="sans body">继承上一稳定版本</text>

  <path d="M275 250 H320" stroke="#536a88" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M574 250 H627" stroke="#536a88" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M982 250 H1034" stroke="#536a88" stroke-width="3" marker-end="url(#a2)"/>

  <rect x="169" y="584" width="1062" height="164" rx="24" fill="#0b1730" stroke="#6380aa" stroke-width="2"/>
  <text x="204" y="627" class="sans head onDark">统一评测门禁</text>
  <g class="sans">
    <rect x="204" y="653" width="176" height="59" rx="14" fill="#dff4ff" stroke="#6bc2e8"/>
    <text x="292" y="689" text-anchor="middle" class="label">新能力是否学会</text>
    <rect x="402" y="653" width="176" height="59" rx="14" fill="#e8ecff" stroke="#8fa3e8"/>
    <text x="490" y="689" text-anchor="middle" class="label">旧能力是否保留</text>
    <rect x="600" y="653" width="176" height="59" rx="14" fill="#f5e8ff" stroke="#b98ad8"/>
    <text x="688" y="689" text-anchor="middle" class="label">安全边界是否退化</text>
    <rect x="798" y="653" width="176" height="59" rx="14" fill="#ddf7f0" stroke="#6bbda9"/>
    <text x="886" y="689" text-anchor="middle" class="label">隐私与来源合规</text>
    <rect x="996" y="653" width="200" height="59" rx="14" fill="#fff0d8" stroke="#d8a65f"/>
    <text x="1096" y="689" text-anchor="middle" class="label">成本、延迟与容量预算</text>
  </g>
  <path d="M1188 334 V545 H1093 V576" fill="none" stroke="#536a88" stroke-width="3" marker-end="url(#a2)"/>

  <rect x="169" y="792" width="356" height="69" rx="18" fill="#e5f5ea" stroke="#5c9b70"/>
  <text x="347" y="820" text-anchor="middle" class="sans label">通过：影子流量 → 灰度 → 晋级</text>
  <text x="347" y="844" text-anchor="middle" class="sans small">反馈回到下一轮，但不绕过账本</text>
  <rect x="875" y="792" width="356" height="69" rx="18" fill="#fdebec" stroke="#c36c73"/>
  <text x="1053" y="820" text-anchor="middle" class="sans label">失败：拒绝更新 → 回滚稳定版本</text>
  <text x="1053" y="844" text-anchor="middle" class="sans small">保留失败证据，修正归因或更新策略</text>
  <path d="M525 827 H867" stroke="#5c9b70" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M875 827 H533" stroke="#c36c73" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M700 748 V780 H347 V784" fill="none" stroke="#5c9b70" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M700 748 V780 H1053 V784" fill="none" stroke="#c36c73" stroke-width="3" marker-end="url(#a2)"/>
  <text x="1332" y="878" text-anchor="end" class="sans small">作者绘制 · 生产系统参考架构</text>
</svg>
