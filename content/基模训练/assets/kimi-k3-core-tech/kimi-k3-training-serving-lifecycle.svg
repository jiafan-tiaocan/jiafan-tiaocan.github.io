<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 从预训练到在线服务的生命周期</title>
  <desc id="desc">流程从原生多模态预训练与渐进上下文扩展开始，经过 SFT、三个领域乘三个推理档位的强化学习、MOPD 合并，再进入量化感知和混合缓存的在线服务。</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#46D9E8"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { fill:#E6EDF7; font-size:30px; font-weight:700; }
      .subtitle { fill:#9FB0C6; font-size:18px; }
      .phase { fill:#E6EDF7; font-size:22px; font-weight:700; }
      .body { fill:#C6D1E1; font-size:17px; }
      .small { fill:#9FB0C6; font-size:15px; }
      .pill { fill:#0B1220; font-size:15px; font-weight:700; }
      .takeaway { fill:#E6EDF7; font-size:20px; font-weight:650; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#0B1220"/>
  <text x="64" y="58" class="title">从 8K 预训练到 1M Agent：能力是沿生命周期共同塑造的</text>
  <text x="64" y="91" class="subtitle">Kimi K3 把部署精度、推理预算、工具轨迹和长上下文状态提前带进训练目标。</text>

  <line x1="130" y1="360" x2="1085" y2="360" stroke="#31445F" stroke-width="6" marker-end="url(#arrow2)"/>

  <rect x="64" y="135" width="245" height="180" rx="22" fill="#111C2E" stroke="#46D9E8" stroke-width="2"/>
  <text x="88" y="172" class="phase">① 原生多模态预训练</text>
  <text x="88" y="207" class="body">文本、图像、视频统一做</text>
  <text x="88" y="232" class="body">next-token prediction</text>
  <text x="88" y="265" class="small">Web · Code · Math · Knowledge</text>
  <text x="88" y="288" class="small">MoonViT-V2 从头联合训练</text>

  <rect x="339" y="135" width="245" height="180" rx="22" fill="#111C2E" stroke="#A78BFA" stroke-width="2"/>
  <text x="363" y="172" class="phase">② 上下文课程</text>
  <rect x="363" y="202" width="48" height="29" rx="14" fill="#46D9E8"/><text x="387" y="222" text-anchor="middle" class="pill">8K</text>
  <rect x="427" y="202" width="55" height="29" rx="14" fill="#46D9E8"/><text x="454" y="222" text-anchor="middle" class="pill">64K</text>
  <rect x="498" y="202" width="61" height="29" rx="14" fill="#A78BFA"/><text x="528" y="222" text-anchor="middle" class="pill">256K</text>
  <line x1="411" y1="216" x2="427" y2="216" stroke="#9FB0C6" stroke-width="2"/>
  <line x1="482" y1="216" x2="498" y2="216" stroke="#9FB0C6" stroke-width="2"/>
  <rect x="363" y="247" width="72" height="29" rx="14" fill="#F6C85F"/><text x="399" y="267" text-anchor="middle" class="pill">1M</text>
  <text x="451" y="267" class="small">NoPE，无需 RoPE 外推</text>
  <text x="363" y="293" class="small">长文/视频清洗 + 必须跨段取证的合成任务</text>

  <rect x="614" y="135" width="245" height="180" rx="22" fill="#111C2E" stroke="#F6C85F" stroke-width="2"/>
  <text x="638" y="172" class="phase">③ SFT 冷启动</text>
  <text x="638" y="207" class="body">复杂工具轨迹与人类校验</text>
  <text x="638" y="232" class="body">统一为 XTML 消息结构</text>
  <text x="638" y="265" class="small">从此阶段开始 QAT</text>
  <text x="638" y="288" class="small">MXFP4 专家权重 / MXFP8 激活</text>

  <rect x="889" y="135" width="247" height="180" rx="22" fill="#111C2E" stroke="#5DD39E" stroke-width="2"/>
  <text x="913" y="172" class="phase">④ 9 个 RL 专家</text>
  <text x="913" y="207" class="body">3 个领域 × 3 个 effort</text>
  <text x="913" y="235" class="small">通用任务 · 通用 Agent · Coding Agent</text>
  <text x="913" y="259" class="small">low · high · max</text>
  <text x="913" y="288" class="small">partial rollout + verifier + 预算约束</text>

  <circle cx="186" cy="360" r="12" fill="#46D9E8"/>
  <circle cx="461" cy="360" r="12" fill="#A78BFA"/>
  <circle cx="736" cy="360" r="12" fill="#F6C85F"/>
  <circle cx="1012" cy="360" r="12" fill="#5DD39E"/>

  <path d="M1012 372 L1012 419 L820 419" fill="none" stroke="#46D9E8" stroke-width="3" marker-end="url(#arrow2)"/>
  <rect x="562" y="397" width="258" height="114" rx="20" fill="#16253B" stroke="#A78BFA" stroke-width="2"/>
  <text x="586" y="433" class="phase">⑤ MOPD 合并</text>
  <text x="586" y="464" class="body">九个 teacher 的 on-policy</text>
  <text x="586" y="489" class="body">稠密奖励合入一个统一模型</text>

  <path d="M562 454 L445 454" fill="none" stroke="#46D9E8" stroke-width="3" marker-end="url(#arrow2)"/>
  <rect x="64" y="397" width="381" height="114" rx="20" fill="#16253B" stroke="#5DD39E" stroke-width="2"/>
  <text x="88" y="433" class="phase">⑥ 部署感知推理</text>
  <text x="88" y="464" class="body">EAGLE-3 draft · KDA/MLA 联合缓存</text>
  <text x="88" y="489" class="body">保留 reasoning/tool history · 预算调度</text>

  <rect x="64" y="572" width="1072" height="88" rx="22" fill="#111C2E" stroke="#31445F" stroke-width="2"/>
  <text x="600" y="608" text-anchor="middle" class="takeaway">核心变化：训练目标不再只优化“下一 token”，还显式塑造工具步骤、思考预算、量化误差与长程环境状态。</text>
  <text x="600" y="638" text-anchor="middle" class="small">但公开材料没有给出完整数据配比、RL 任务集、reward model、训练代码与生产配置，因此不能从头复现。</text>
</svg>
