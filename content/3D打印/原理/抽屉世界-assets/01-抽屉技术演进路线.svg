<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <rect width="1440" height="760" fill="#f7f4ed"/>
  <text x="72" y="72" font-family="Arial,'PingFang SC'" font-size="34" font-weight="700" fill="#17232d">抽屉技术：每一次升级都在拆分一种职责</text>
  <text x="72" y="112" font-family="Arial,'PingFang SC'" font-size="19" fill="#53606a">从最少零件，到可控运动，再到可制造、可维护的系统</text>
  <path d="M130 350 H1310" stroke="#a5afb5" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial,'PingFang SC'">
    <g transform="translate(105,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">1</text><rect x="-70" y="178" width="140" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">滑动木盒</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">面摩擦承重</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：涩、胀、歪</text></g>
    <g transform="translate(305,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">2</text><rect x="-70" y="178" width="140" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">木托与槽</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">导向独立</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：仍靠滑动</text></g>
    <g transform="translate(505,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">3</text><rect x="-70" y="178" width="140" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">滚轮轨</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">滚动减摩</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：行程有限</text></g>
    <g transform="translate(705,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">4</text><rect x="-76" y="178" width="152" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">伸缩滚珠轨</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">全拉出与承重</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：空间与精度</text></g>
    <g transform="translate(920,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">5</text><rect x="-80" y="178" width="160" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">隐藏同步轨</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">调节与运动质量</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：成本复杂度</text></g>
    <g transform="translate(1135,0)"><circle cx="0" cy="350" r="38" fill="#256d85"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">6</text><rect x="-80" y="178" width="160" height="102" rx="14" fill="#dcecf0"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#173848">运动模块</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#35515e">缓闭、触开、锁定</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：系统集成</text></g>
    <g transform="translate(1335,0)"><circle cx="0" cy="350" r="38" fill="#d4773b"/><text x="0" y="358" text-anchor="middle" font-size="24" fill="white">7</text><rect x="-80" y="178" width="160" height="102" rx="14" fill="#f4dfce"/><text x="0" y="217" text-anchor="middle" font-size="22" font-weight="700" fill="#61321f">FDM 模块</text><text x="0" y="249" text-anchor="middle" font-size="16" fill="#754933">重写几何与公差</text><text x="0" y="450" text-anchor="middle" font-size="17" fill="#a34b32">瓶颈：层向与磨损</text></g>
  </g>
  <rect x="72" y="545" width="1296" height="128" rx="18" fill="#17232d"/>
  <text x="108" y="593" font-family="Arial,'PingFang SC'" font-size="21" font-weight="700" fill="#f7f4ed">贯穿所有时代的七项职责</text>
  <text x="108" y="638" font-family="Arial,'PingFang SC'" font-size="22" fill="#bcdce5">承重　·　导向　·　侧向约束　·　抗抬起　·　止挡　·　释放　·　柜体稳定</text>
