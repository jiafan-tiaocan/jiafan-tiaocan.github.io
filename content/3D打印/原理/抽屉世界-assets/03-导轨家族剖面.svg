<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930">
  <rect width="1440" height="930" fill="#f8f6f1"/>
  <text x="70" y="70" font-family="Arial,'PingFang SC'" font-size="34" font-weight="700" fill="#17232d">六种导轨家族：同一任务，不同约束方式</text>
  <g font-family="Arial,'PingFang SC'" fill="#17232d">
    <g transform="translate(90,145)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">A 面接触木滑道</text><rect x="30" y="75" width="300" height="55" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><rect x="0" y="130" width="360" height="40" fill="#263a45"/><path d="M75 120 H285" stroke="#d4773b" stroke-width="8" stroke-dasharray="14 8"/><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">简单 / 摩擦面积大</text></g>
    <g transform="translate(540,145)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">B 中央 T 形导向</text><path d="M50 75 H310 V130 H220 V170 H140 V130 H50 Z" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><path d="M120 170 V110 H240 V170" fill="none" stroke="#263a45" stroke-width="22"/><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">省侧面 / 宽抽抗扭弱</text></g>
    <g transform="translate(990,145)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">C 双侧滚轮轨</text><path d="M30 85 H330 V125 H70 V170 H30 Z" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><path d="M0 160 H250 V115 H330" fill="none" stroke="#263a45" stroke-width="18"/><circle cx="78" cy="145" r="25" fill="#d4773b"/><circle cx="280" cy="115" r="25" fill="#d4773b"/><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">低成本 / 常为部分拉出</text></g>
    <g transform="translate(90,520)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">D 三节滚珠伸缩轨</text><path d="M10 80 H350 V170 H10 Z" fill="none" stroke="#263a45" stroke-width="16"/><path d="M40 102 H320 V148 H40 Z" fill="none" stroke="#71818a" stroke-width="13"/><path d="M75 119 H285 V131 H75 Z" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><g fill="#d4773b"><circle cx="68" cy="95" r="10"/><circle cx="110" cy="95" r="10"/><circle cx="250" cy="155" r="10"/><circle cx="292" cy="155" r="10"/></g><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">全拉出 / 占侧向空间</text></g>
    <g transform="translate(540,520)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">E 底装隐藏轨</text><path d="M30 65 H330 V145 H265 V170 H95 V145 H30 Z" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><rect x="75" y="153" width="210" height="22" rx="9" fill="#263a45"/><g fill="#d4773b"><circle cx="115" cy="164" r="8"/><circle cx="245" cy="164" r="8"/></g><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">隐藏 / 调节、同步、缓闭</text></g>
    <g transform="translate(990,520)"><text x="180" y="0" text-anchor="middle" font-size="23" font-weight="700">F 塑料一体侧槽</text><path d="M45 65 H315 V120 H260 V170 H100 V120 H45 Z" fill="#b8dce5" stroke="#1e6279" stroke-width="4"/><path d="M80 170 V105 H280 V170" fill="none" stroke="#263a45" stroke-width="20"/><path d="M250 106 l22 -28 l22 28" fill="#d4773b"/><text x="180" y="215" text-anchor="middle" font-size="17" fill="#59676e">少零件 / 形状承担多职责</text></g>
  </g>
  <g transform="translate(90,835)" font-family="Arial,'PingFang SC'" font-size="17"><rect width="22" height="22" fill="#b8dce5"/><text x="34" y="18" fill="#17232d">抽屉</text><rect x="150" width="22" height="22" fill="#263a45"/><text x="184" y="18" fill="#17232d">柜体/柜轨</text><rect x="335" width="22" height="22" fill="#d4773b"/><text x="369" y="18" fill="#17232d">滚动、止挡或关键接触</text></g>
</svg>
