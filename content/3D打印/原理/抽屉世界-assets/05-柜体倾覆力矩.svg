  <text x="925" y="620" font-family="Arial" font-size="25" fill="#bcdce5">Wc · a + Manchor ≥ S · Wd · x</text>
  <text x="925" y="655" font-family="Arial,'PingFang SC'" font-size="17" fill="#c8d2d6">层间卡槽 ≠ 墙锚；S 应大于 1</text>
